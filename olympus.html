const DOR=[146.83,164.81,174.61,196,220,246.94,261.63,293.66,329.63,349.23,392,440];
function noiseBuf(sec,decay){const b=AC.createBuffer(2,AC.sampleRate*sec,AC.sampleRate);for(let c=0;c<2;c++){const d=b.getChannelData(c);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*(decay?Math.pow(1-i/d.length,2.5):1)}return b}
function audioInit(){AC=new (window.AudioContext||window.webkitAudioContext)();MG=AC.createGain();MG.gain.value=0;MG.connect(AC.destination);DRY=AC.createGain();DRY.connect(MG);
 RV=AC.createConvolver();RV.buffer=noiseBuf(3,true);const wg=AC.createGain();wg.gain.value=.55;RV.connect(wg);wg.connect(MG);
 [[73.42,.04],[110,.03],[146.83,.015]].forEach(q=>{const o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.value=q[0];g.gain.value=q[1];o.connect(g);g.connect(DRY);g.connect(RV);o.start()});
 const n=AC.createBufferSource();n.buffer=noiseBuf(2,false);n.loop=true;const hp=AC.createBiquadFilter();hp.type='highpass';hp.frequency.value=1400;RNS=AC.createGain();RNS.gain.value=0;n.connect(hp);hp.connect(RNS);RNS.connect(MG);n.start()}
function pluck(f,t,v){const o=AC.createOscillator(),o2=AC.createOscillator(),g=AC.createGain(),lp=AC.createBiquadFilter(),g2=AC.createGain();o.type='triangle';o.frequency.value=f;o2.type='sine';o2.frequency.value=f*2;g2.gain.value=.35;lp.type='lowpass';lp.frequency.value=2400;
 g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+2.4);o.connect(lp);o2.connect(g2);g2.connect(lp);lp.connect(g);g.connect(DRY);g.connect(RV);o.start(t);o2.start(t);o.stop(t+2.6);o2.stop(t+2.6)}
function flute(f,t,d){const o=AC.createOscillator(),l=AC.createOscillator(),lg=AC.createGain(),g=AC.createGain();o.type='sine';o.frequency.value=f;l.frequency.value=5;lg.gain.value=f*.008;l.connect(lg);lg.connect(o.frequency);

function thunder(){if(!AC||!mOn)return;const s=AC.createBufferSource();s.buffer=noiseBuf(3,true);const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=140;const g=AC.createGain();g.gain.value=.9;s.connect(lp);lp.connect(g);g.connect(MG);s.start(AC.currentTime+.25)}
function seq(){if(!mOn)return;const t=AC.currentTime+.05,beat=wk==='night'?1.1:.85,roots=[0,6,3,4];

 step++;mt=setTimeout(seq,beat*500)}

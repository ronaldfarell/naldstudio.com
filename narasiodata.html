<style>
:root{
  /* light / white theme -- default */
  --void:#ffffff;
  --surface:#f7f7f4;
  --surface-2:#eeeee8;
  --line: rgba(10,11,20,.12);
  --line-soft: rgba(10,11,20,.07);
  --ink:#0e0f16;
  --ink-dim:#55586a;
  --ink-faint:#9a9dab;
  --paper:#ffffff;
  --paper-2:#e7e7e2;
  --paper-ink:#0e0f16;
  --paper-ink-dim:#5b5d6b;
  --blue:#3358e0;
  --violet:#8146e0;
  --pink:#e0489f;
  --yellow:#c99a00;
  --radius-s:2px;
  --radius-m:4px;
  --ease: cubic-bezier(.16,.84,.32,1);
  --safe-t: env(safe-area-inset-top, 0px);
  --safe-b: env(safe-area-inset-bottom, 0px);
}
/* dark accent sections -- used sparingly for cinematic moments (hero, closing, products) */
.on-dark{
  --void:#08090f;
  --surface:#0f1120;
  --surface-2:#151832;
  --line: rgba(244,245,249,.14);
  --line-soft: rgba(244,245,249,.08);
  --ink:#f4f5f9;
  --ink-dim:#9297b0;
  --ink-faint:#5b6080;
  --paper-ink-dim:#9297b0;
  --blue:#7ba0ff;
  --violet:#b79bff;
  --pink:#ff9ad6;
  --yellow:#ffd447;
  background-color:var(--void); color:var(--ink);
}
.on-dark .btn{ border-color:var(--ink); color:var(--ink); }
.on-dark .btn.primary{ background:var(--ink); color:var(--void); }
*{box-sizing:border-box;}
html{-webkit-text-size-adjust:100%; scroll-padding-top: var(--safe-t);}
html,body{height:100%;}
body{
  margin:0; background-color:var(--void); color:var(--ink);
  font-family:'Inter', ui-sans-serif, system-ui, -apple-system, sans-serif;
  padding-top: var(--safe-t); padding-bottom: var(--safe-b);
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}
/* Absolutely-positioned decorative layer, sized to full document height via JS
   so the grid/glow scroll together with the page content (not fixed in place). */
#bgAccents{
  position:absolute; top:0; left:0; width:100%; z-index:0; pointer-events:none;
  background-image:
    radial-gradient(circle at 1px 1px, rgba(14,15,22,.13) 1.3px, transparent 0),
    linear-gradient(rgba(14,15,22,.055) 1px, transparent 1px),
    linear-gradient(90deg, rgba(14,15,22,.055) 1px, transparent 1px),
    radial-gradient(ellipse 65% 45% at 10% 0%, rgba(51,88,224,.10), transparent 62%),
    radial-gradient(ellipse 60% 50% at 92% 22%, rgba(224,72,159,.09), transparent 62%),
    radial-gradient(ellipse 55% 45% at 30% 100%, rgba(201,154,0,.07), transparent 60%);
  background-size: 26px 26px, 130px 130px, 130px 130px, 100% 100%, 100% 100%, 100% 100%;
  transition: opacity .4s var(--ease);
}
body.on-dark-active #bgAccents{
  background-image:
    radial-gradient(circle at 1px 1px, rgba(244,245,249,.16) 1.3px, transparent 0),
    radial-gradient(ellipse 60% 45% at 14% 0%, rgba(123,160,255,.22), transparent 60%),
    radial-gradient(ellipse 55% 50% at 90% 30%, rgba(255,154,214,.18), transparent 60%),
    radial-gradient(ellipse 50% 40% at 40% 100%, rgba(183,155,255,.14), transparent 60%);
  background-size: 26px 26px, 100% 100%, 100% 100%, 100% 100%;
}
::selection{ background:var(--blue); color:#fff; }
h1,h2,h3,h4{ font-family:'Space Grotesk', ui-sans-serif, system-ui, sans-serif; margin:0; font-weight:600; letter-spacing:-.01em; }
p{ margin:0; }
a{ color:inherit; text-decoration:none; }
button{ font-family:inherit; }
img{ max-width:100%; display:block; }
.mono{ font-family:'IBM Plex Mono', ui-monospace, monospace; }

/* ---------- layout shells ---------- */
.wrap{ max-width:1280px; margin:0 auto; padding:0 clamp(20px,5vw,64px); }
#app{ position:relative; z-index:1; }
.page{ display:none; }
.page.is-active{ display:block; }
.hero-glow{
  position:absolute; inset:-10% -10% auto -10%; height:130%; z-index:-1; pointer-events:none; overflow:hidden;
}
.hero-glow::before, .hero-glow::after{
  content:''; position:absolute; width:52vw; height:52vw; max-width:640px; max-height:640px; border-radius:50%;
  filter:blur(100px); opacity:.32; mix-blend-mode:multiply;
}
.on-dark .hero-glow::before, .on-dark .hero-glow::after{ mix-blend-mode:screen; opacity:.35; }
.hero-glow::before{ top:-14%; left:-8%; background:radial-gradient(circle, var(--blue), transparent 70%); animation: driftA 16s ease-in-out infinite alternate; }
.hero-glow::after{ bottom:-18%; right:-6%; background:radial-gradient(circle, var(--pink), transparent 70%); animation: driftB 18s ease-in-out infinite alternate; }
@keyframes driftA{ from{ transform:translate(0,0) scale(1); } to{ transform:translate(6%,4%) scale(1.12); } }
@keyframes driftB{ from{ transform:translate(0,0) scale(1); } to{ transform:translate(-5%,-6%) scale(1.1); } }
.hero, .final-cta{ position:relative; overflow:hidden; }
.page-fade{ animation: pagein .5s var(--ease) both; }
@keyframes pagein{ from{ opacity:0; transform:translateY(10px);} to{opacity:1; transform:none;} }

section{ position:relative; }
.section-pad{ padding: clamp(64px,10vw,140px) 0; }
.on-light{ background:transparent; color:var(--paper-ink); }
.on-light .ink-dim{ color:var(--paper-ink-dim); }
.ink-dim{ color:var(--ink-dim); }

/* ---------- scroll progress ---------- */
#scrollProgress{ position:fixed; top:0; left:0; height:2px; width:0%; background:var(--blue); z-index:200; transition:width .08s linear; }

/* ---------- bg network canvas ---------- */
#netcanvas{ position:absolute; top:0; left:0; width:100%; z-index:0; pointer-events:none; opacity:.55; }
body.on-dark-active #netcanvas{ opacity:.65; }

/* ---------- header ---------- */
header.site{
  position:fixed; top:0; left:0; right:0; z-index:100;
  padding-top: var(--safe-t);
  transition: background .4s var(--ease), border-color .4s var(--ease), backdrop-filter .4s var(--ease);
  border-bottom:1px solid transparent;
}
header.site.solid{
  background:rgba(255,255,255,.78); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  border-bottom-color: rgba(14,15,22,.1);
}
body.on-dark-active header.site.solid{
  background:rgba(8,9,15,.72); border-bottom-color: rgba(244,245,249,.14);
}
.nav-row{ display:flex; align-items:center; justify-content:space-between; height:72px; }
.brand{ display:flex; align-items:center; gap:10px; }
.brand img{ height:22px; width:auto; }
.brand .dark-logo{ display:none; }
.brand .light-logo{ display:block; }
body.on-dark-active .brand .dark-logo{ display:block; }
body.on-dark-active .brand .light-logo{ display:none; }
nav.main-nav{ display:flex; align-items:center; gap:clamp(18px,2.4vw,34px); }
nav.main-nav a{
  font-size:13px; letter-spacing:.04em; font-weight:600; color:rgba(14,15,22,.86); position:relative; padding:6px 0;
  transition:color .25s var(--ease);
}
body.on-dark-active nav.main-nav a{ color:rgba(244,245,249,.86); }
nav.main-nav a::after{
  content:''; position:absolute; left:0; right:100%; bottom:0; height:1px; background:var(--paper-ink);
  transition:right .3s var(--ease);
}
body.on-dark-active nav.main-nav a::after{ background:#f4f5f9; }
nav.main-nav a:hover, nav.main-nav a.active{ color:var(--paper-ink); }
body.on-dark-active nav.main-nav a:hover, body.on-dark-active nav.main-nav a.active{ color:#f4f5f9; }
nav.main-nav a:hover::after, nav.main-nav a.active::after{ right:0; }
.nav-cta{
  border:1px solid rgba(14,15,22,.18); padding:9px 16px; font-size:12px; letter-spacing:.03em;
  border-radius:999px; white-space:nowrap; display:flex; align-items:center; gap:8px; color:var(--paper-ink);
}
body.on-dark-active .nav-cta{ border-color:rgba(244,245,249,.2); color:#f4f5f9; }
.hamburger{ display:none; }

/* ---------- buttons / links ---------- */
.btn{
  display:inline-flex; align-items:center; gap:10px; font-size:14px; letter-spacing:.02em;
  padding:14px 26px; border-radius:999px; border:1px solid var(--ink); cursor:pointer;
  position:relative; overflow:hidden; background:transparent; color:var(--ink);
}
.btn.primary{ background:var(--ink); color:var(--void); }
.on-light .btn{ border-color:var(--paper-ink); color:var(--paper-ink); }
.on-light .btn.primary{ background:var(--paper-ink); color:var(--paper); }
.btn .arrow{ transition:transform .3s var(--ease); }
.btn:hover .arrow{ transform:translateX(4px); }
.text-link{ display:inline-flex; align-items:center; gap:8px; font-size:14px; border-bottom:1px solid currentColor; padding-bottom:2px; }

.eyebrow{
  font-size:11px; letter-spacing:.12em; color:var(--ink-faint); display:flex; align-items:center; gap:10px; margin-bottom:18px;
}
.on-light .eyebrow{ color:var(--paper-ink-dim); }
.eyebrow .dot{ width:5px; height:5px; border-radius:50%; background:var(--blue); }

/* ---------- hero ---------- */
.hero{ min-height:100svh; display:flex; flex-direction:column; justify-content:flex-end; padding-top:140px; }
.hero-inner{ padding-bottom:clamp(48px,8vw,96px); }
.hero-kicker{ font-size:12px; letter-spacing:.14em; color:var(--ink-faint); margin-bottom:26px; }
.hero h1{
  font-size:clamp(40px,7.4vw,104px); line-height:.98; max-width:16ch;
}
.hero h1 .word{ display:inline-block; overflow:hidden; vertical-align:top; }
.hero h1 .word span{ display:inline-block; transform:translateY(110%); transition:transform .8s var(--ease); }
.hero.revealed h1 .word span{ transform:translateY(0); }
.hero-sub{ margin-top:30px; max-width:44ch; font-size:clamp(16px,1.6vw,19px); color:var(--ink-dim); line-height:1.5; }
.hero-ctas{ display:flex; flex-wrap:wrap; gap:16px; margin-top:44px; }
.scroll-cue{ position:absolute; bottom:28px; left:clamp(20px,5vw,64px); display:flex; align-items:center; gap:10px; font-size:11px; letter-spacing:.1em; color:var(--ink-faint); }
.scroll-cue .line{ width:1px; height:34px; background:linear-gradient(var(--ink-faint), transparent); position:relative; overflow:hidden; }
.scroll-cue .line::after{ content:''; position:absolute; top:-100%; left:0; width:100%; height:100%; background:var(--ink); animation:cue 2.2s ease-in-out infinite; }
@keyframes cue{ to{ top:100%; } }

/* ---------- reveal utility ---------- */
.reveal{ opacity:0; transform:translateY(46px) rotate(.6deg); transition:opacity 1s var(--ease), transform 1s var(--ease); }
.reveal.in{ opacity:1; transform:none; }
.reveal-d1{ transition-delay:.09s; } .reveal-d2{ transition-delay:.18s; } .reveal-d3{ transition-delay:.27s; } .reveal-d4{ transition-delay:.36s; }

/* ---------- split word-by-word kinetic reveal ---------- */
.split-line{ display:block; overflow:hidden; padding-bottom:.08em; }
.split-word{ display:inline-block; transform:translateY(115%) rotate(4deg); transition:transform .85s var(--ease); }
.split-line.in .split-word{ transform:none; }

/* ---------- playful hover tilt (cards) ---------- */
.tilt{ transition:transform .35s var(--ease), border-color .35s var(--ease); will-change:transform; }
@media (hover:hover) and (pointer:fine){
  .tilt:hover{ transform:translateY(-6px) scale(1.015); }
}

/* ---------- storytelling / kinetic words ---------- */
.kinetic{ padding:clamp(80px,14vw,160px) 0; }
.kinetic-q{ font-size:clamp(28px,4.6vw,58px); line-height:1.08; max-width:20ch; color:var(--ink-faint); }
.kinetic-q .flip{ color:var(--ink); }
.kinetic-copy{ margin-top:56px; max-width:56ch; font-size:clamp(17px,1.7vw,21px); line-height:1.6; color:var(--ink-dim); }
.word-cloud{ display:flex; flex-wrap:wrap; gap:14px 10px; margin-top:56px; }
.word-cloud span{
  font-family:'Space Grotesk'; font-size:clamp(14px,1.6vw,18px); padding:9px 18px; border:1px solid var(--line);
  border-radius:999px; color:var(--ink-faint); opacity:0; transform:scale(.85); transition:opacity .5s var(--ease), transform .5s var(--ease), color .4s, border-color .4s;
}
.word-cloud span.on{ opacity:1; transform:scale(1); color:var(--ink); border-color:var(--blue); }

/* ---------- meet narasio / ecosystem hover diagram ---------- */
.grid-2{ display:grid; grid-template-columns:1fr 1fr; gap:clamp(32px,6vw,90px); align-items:start; }
@media (max-width:860px){ .grid-2{ grid-template-columns:1fr; } }
.big-copy{ font-size:clamp(24px,3.2vw,38px); line-height:1.25; max-width:18ch; }
.eco-flow{ display:flex; flex-wrap:wrap; gap:12px; margin-top:20px; }
.eco-node{
  border:1px solid var(--line); border-radius:999px; padding:12px 20px; font-size:13px; letter-spacing:.03em;
  cursor:pointer; position:relative; transition:border-color .3s, background .3s, color .3s;
  font-family:'Space Grotesk';
}
.eco-node:hover, .eco-node.active{ border-color:var(--blue); background:rgba(79,125,243,.1); }
.eco-detail{
  margin-top:26px; padding:24px; border:1px solid var(--line); border-radius:var(--radius-m);
  min-height:96px; font-size:15px; color:var(--ink-dim); line-height:1.6; background:rgba(0,0,0,.02);
}
.on-dark .eco-detail{ background:rgba(255,255,255,.03); }
.eco-detail b{ color:var(--ink); font-family:'Space Grotesk'; display:block; margin-bottom:8px; font-size:16px; }

/* leadership strip */
.leaders{ display:grid; grid-template-columns:repeat(4,1fr); gap:20px; margin-top:64px; }
@media (max-width:860px){ .leaders{ grid-template-columns:repeat(2,1fr); } }
.leader-card{ border-top:1px solid var(--line); padding-top:16px; }
.leader-photo{ width:76px; height:76px; border-radius:10px; overflow:hidden; margin-bottom:14px; background:var(--surface-2); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.leader-photo img{ width:100%; height:100%; object-fit:cover; filter:grayscale(1) contrast(1.04); transition:filter .35s var(--ease); }
.leader-card:hover .leader-photo img{ filter:grayscale(0) contrast(1); }
.leader-photo .initials{ font-family:'Space Grotesk'; font-size:20px; color:var(--ink-faint); }
.leader-name{ font-family:'Space Grotesk'; font-size:14.5px; }
.leader-role{ font-size:11.5px; color:var(--blue); margin-top:3px; }
.leader-tags{ font-size:11px; color:var(--ink-faint); margin-top:8px; line-height:1.6; }

/* partner badges */
.badges{ display:flex; flex-wrap:wrap; align-items:center; gap:clamp(20px,4vw,44px); margin-top:40px; padding-top:32px; border-top:1px solid var(--line); }
.badges img{ height:26px; width:auto; filter:grayscale(1); opacity:.7; }
.on-dark .badges img{ filter:grayscale(1) brightness(1.8); opacity:.75; }
.badges .claude-badge{ font-family:'Space Grotesk'; font-size:13px; color:var(--ink-dim); }

/* ---------- the narasio way ---------- */
.way-item{ display:grid; grid-template-columns:120px 1fr; gap:32px; padding:40px 0; border-top:1px solid var(--line); }
.way-item:last-child{ border-bottom:1px solid var(--line); }
.way-num{ font-family:'Space Grotesk'; font-size:44px; color:var(--paper-ink-dim); opacity:.4; }
.way-title{ font-size:clamp(20px,2.2vw,28px); margin-bottom:10px; }
.way-body{ max-width:52ch; color:var(--paper-ink-dim); font-size:16px; line-height:1.6; }
@media (max-width:640px){ .way-item{ grid-template-columns:1fr; gap:8px; } }

/* ---------- ecosystem pathways ---------- */
.pathway-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:1px; background:var(--line); margin-top:56px; border:1px solid var(--line); }
@media (max-width:900px){ .pathway-grid{ grid-template-columns:1fr; } }
.pathway{ background:var(--void); padding:34px 28px; min-height:220px; display:flex; flex-direction:column; justify-content:space-between; }
.pathway .tag{ font-size:11px; letter-spacing:.1em; color:var(--blue); }
.pathway h4{ font-size:19px; margin-top:12px; line-height:1.3; }
.pathway p{ font-size:13px; color:var(--ink-faint); margin-top:14px; line-height:1.5; }

/* ---------- impact numbers ---------- */
.stat-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:1px; background:var(--line); border:1px solid var(--line); margin-top:20px;}
@media (max-width:760px){ .stat-grid{ grid-template-columns:repeat(2,1fr); } }
.stat{ background:var(--void); padding:36px 24px; }
.stat .num{ font-family:'Space Grotesk'; font-size:clamp(38px,5vw,60px); color:var(--yellow); }
.stat .label{ font-size:13px; color:var(--ink-dim); margin-top:8px; }

/* ---------- final cta ---------- */
.final-cta{ text-align:center; padding:clamp(100px,16vw,180px) 0; }
.final-cta h2{ font-size:clamp(32px,6vw,76px); line-height:1.05; max-width:16ch; margin:0 auto; }
.final-cta .sub{ margin-top:26px; color:var(--ink-dim); font-size:17px; max-width:40ch; margin-left:auto; margin-right:auto; }
.final-cta .ctas{ display:flex; gap:16px; justify-content:center; margin-top:46px; flex-wrap:wrap; }

/* ---------- business model canvas (interaktif) ---------- */
.bmc-section{ position:relative; overflow:hidden; }
.bmc-section::before{
  content:''; position:absolute; inset:0; pointer-events:none; opacity:.55;
  background:
    radial-gradient(60% 50% at 50% 38%, rgba(123,160,255,.14), transparent 70%),
    radial-gradient(30% 30% at 88% 8%, rgba(255,212,71,.08), transparent 70%),
    radial-gradient(rgba(244,245,249,.07) 1px, transparent 1px) 0 0/26px 26px;
  -webkit-mask-image:linear-gradient(#000 60%, transparent); mask-image:linear-gradient(#000 60%, transparent);
}
.bmc-section .wrap{ position:relative; }
.bmc-toolbar{ display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:14px; margin-top:40px; }
.bmc-hint{ font-size:11px; letter-spacing:.08em; color:var(--ink-faint); display:flex; align-items:center; gap:10px; }
.bmc-hint i{ width:6px; height:6px; background:var(--blue); display:inline-block; }
.bmc-steps{ display:flex; align-items:center; gap:8px; }
.bmc-steps button{
  font:inherit; font-size:11px; letter-spacing:.1em; color:var(--ink); background:transparent;
  border:1px solid var(--line); border-radius:999px; padding:9px 16px; cursor:pointer; transition:border-color .25s, background .25s;
}
.bmc-steps button:hover{ border-color:var(--blue); background:rgba(123,160,255,.1); }
.bmc-steps button:focus-visible, .bmc-tile:focus-visible, .bmc-chip:focus-visible{ outline:2px solid var(--blue); outline-offset:2px; }
.bmc-pos{ font-size:11px; color:var(--ink-faint); min-width:48px; text-align:center; }

.bmc-grid{ display:grid; grid-template-columns:1fr; gap:12px; margin-top:16px; }
@media (min-width:700px){ .bmc-grid{ grid-template-columns:repeat(2,1fr); } }
@media (min-width:1080px){
  .bmc-grid{
    grid-template-columns:repeat(5,1fr); grid-template-rows:repeat(3,auto);
    grid-template-areas:
      "partners activities value        relationships segments"
      "partners resources  value        channels       segments"
      "cost     cost        revenue      revenue        revenue";
  }
  .bmc-tile[data-bmc="partners"]{ grid-area:partners; }
  .bmc-tile[data-bmc="activities"]{ grid-area:activities; }
  .bmc-tile[data-bmc="value"]{ grid-area:value; }
  .bmc-tile[data-bmc="relationships"]{ grid-area:relationships; }
  .bmc-tile[data-bmc="segments"]{ grid-area:segments; }
  .bmc-tile[data-bmc="resources"]{ grid-area:resources; }
  .bmc-tile[data-bmc="channels"]{ grid-area:channels; }
  .bmc-tile[data-bmc="cost"]{ grid-area:cost; }
  .bmc-tile[data-bmc="revenue"]{ grid-area:revenue; }
}
@media (max-width:1079px){
  .bmc-tile[data-bmc="value"]{ order:-1; grid-column:1/-1; }
}
.bmc-tile{
  position:relative; box-sizing:border-box; display:flex; flex-direction:column; cursor:pointer; min-width:0;
  padding:22px 20px 24px; border:1px solid var(--line); border-radius:6px;
  background:linear-gradient(180deg, rgba(255,255,255,.035), rgba(255,255,255,0) 60%), var(--surface);
  transition:opacity .35s var(--ease), border-color .3s var(--ease), transform .35s var(--ease), box-shadow .35s var(--ease), background .3s;
  -webkit-tap-highlight-color:transparent;
}
.bmc-grid.in .bmc-tile{ animation:bmcIn .75s var(--ease) backwards; animation-delay:calc(var(--i) * 70ms); }
@keyframes bmcIn{ from{ opacity:0; transform:translateY(22px); } }
@media (hover:hover) and (pointer:fine){ .bmc-tile:hover{ border-color:rgba(123,160,255,.55); } }
.bmc-grid.has-active .bmc-tile:not(.active):not(.linked){ opacity:.4; }
.bmc-grid.has-active .bmc-tile[data-bmc="value"]:not(.active):not(.linked){ opacity:.72; }
.bmc-tile.linked{ border-color:rgba(123,160,255,.5); background:linear-gradient(180deg, rgba(123,160,255,.09), rgba(123,160,255,0) 70%), var(--surface); }
.bmc-tile.active{
  border-color:var(--blue); transform:translateY(-4px);
  background:linear-gradient(180deg, rgba(123,160,255,.16), rgba(123,160,255,.02) 75%), var(--surface-2);
  box-shadow:0 18px 50px -18px rgba(123,160,255,.45), 0 0 0 1px rgba(123,160,255,.35);
}
.bmc-top{ display:flex; align-items:center; gap:10px; margin-bottom:14px; flex-wrap:wrap; }
.bmc-idx{ font-size:11px; color:var(--ink-faint); }
.bmc-eyebrow{ font-size:10px; letter-spacing:.12em; color:var(--blue); }
.bmc-tile .tag{ margin-left:auto; }
.bmc-title{ font-family:'Space Grotesk'; font-size:17px; line-height:1.25; }
.bmc-list{ list-style:none; margin:16px 0 0; padding:0; font-size:13px; line-height:1.55; color:var(--ink-dim); }
.bmc-list li{ position:relative; padding-left:16px; margin-bottom:8px; }
.bmc-list li:last-child{ margin-bottom:0; }
.bmc-list li::before{ content:''; position:absolute; left:0; top:.5em; width:5px; height:5px; background:var(--blue); transition:background .3s; }
.bmc-tile.active .bmc-list li::before{ background:var(--yellow); }
.bmc-list b{ color:var(--ink); font-weight:600; }

/* value propositions = pusat kanvas */
.bmc-tile[data-bmc="value"]{
  padding:26px 22px 28px; border-color:transparent;
  background:radial-gradient(120% 70% at 50% 0%, rgba(123,160,255,.22), transparent 65%), var(--surface-2);
  animation:bmcPulse 4.8s ease-in-out infinite;
}
.bmc-tile[data-bmc="value"]::after{
  content:''; position:absolute; inset:-1px; border-radius:6px; padding:1px; pointer-events:none;
  background:linear-gradient(140deg, var(--blue), transparent 40%, var(--yellow));
  -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite:xor;
  mask:linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0);
}
@keyframes bmcPulse{ 0%,100%{ box-shadow:0 0 0 0 rgba(123,160,255,0), 0 24px 60px -28px rgba(123,160,255,.35); } 50%{ box-shadow:0 0 0 6px rgba(123,160,255,.06), 0 24px 70px -22px rgba(255,212,71,.28); } }
.bmc-tile[data-bmc="value"] .bmc-eyebrow{ color:var(--yellow); }
.bmc-tile[data-bmc="value"] .bmc-title{ font-size:clamp(22px,2.2vw,28px); line-height:1.15; }
.bmc-tile[data-bmc="value"] .bmc-list{ font-size:14px; color:var(--ink); }
.bmc-tile[data-bmc="value"] .bmc-list li::before{ background:var(--yellow); }
.bmc-pixels{ position:absolute; top:16px; right:16px; width:6px; height:6px; pointer-events:none; opacity:.9;
  box-shadow:-7px 0 #ff8fd8, -14px 0 #ffd447, 0 7px #a35cf5, -7px 7px #4d8df0, -14px 7px transparent, -7px 14px #a35cf5, 0 14px transparent; background:#4d8df0; }
.bmc-nori{ display:flex; flex-wrap:wrap; gap:6px; margin-top:18px; padding-top:16px; border-top:1px solid var(--line); }
.bmc-nori span{ font-size:10px; letter-spacing:.08em; color:var(--ink-dim); border:1px solid var(--line); border-radius:999px; padding:5px 10px; }

/* detail: panel (desktop) / di dalam blok (layar kecil) */
.bmc-detail{
  display:none; margin-top:12px; padding:28px 30px; border:1px solid var(--line); border-radius:6px; background:var(--surface);
  grid-template-columns:1.25fr 1fr; gap:36px; align-items:start; min-height:132px;
}
@media (min-width:1080px){ .bmc-detail{ display:grid; } .bmc-more{ display:none !important; } }
.bmc-d-eyebrow{ font-size:10.5px; letter-spacing:.12em; color:var(--blue); }
.bmc-d-title{ font-family:'Space Grotesk'; font-size:22px; line-height:1.2; margin-top:8px; }
.bmc-d-desc{ margin:10px 0 0; font-size:14.5px; line-height:1.65; color:var(--ink-dim); max-width:56ch; }
.bmc-d-label{ font-size:10px; letter-spacing:.12em; color:var(--ink-faint); margin-bottom:10px; }
.bmc-chips{ display:flex; flex-wrap:wrap; gap:8px; }
.bmc-chip{
  font:inherit; font-size:12px; color:var(--ink); background:transparent; border:1px solid var(--line); border-radius:999px;
  padding:7px 14px; cursor:pointer; transition:border-color .25s, background .25s;
}
.bmc-chip:hover{ border-color:var(--blue); background:rgba(123,160,255,.12); }
.bmc-d-link{ display:inline-block; margin-top:16px; font-size:13px; color:var(--ink); border-bottom:1px solid var(--line); padding-bottom:1px; }
.bmc-d-link:hover{ border-color:var(--ink); }
.bmc-more{ display:grid; grid-template-rows:0fr; transition:grid-template-rows .45s var(--ease); }
.bmc-tile.active .bmc-more{ grid-template-rows:1fr; }
.bmc-more-in{ overflow:hidden; min-height:0; }
.bmc-more-in > p{ margin:18px 0 12px; padding-top:16px; border-top:1px solid var(--line); font-size:13px; line-height:1.6; color:var(--ink-dim); }
.bmc-cta{ display:flex; flex-wrap:wrap; align-items:center; gap:18px 26px; margin-top:44px; }
.bmc-cta p{ margin:0; font-size:13px; color:var(--ink-faint); max-width:46ch; }

/* ---------- footer ---------- */
footer.site{ border-top:1px solid var(--line); padding:56px 0 calc(40px + var(--safe-b)); }
.foot-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:24px; flex-wrap:wrap; }
.foot-nav{ display:flex; gap:26px; flex-wrap:wrap; font-size:13px; color:var(--ink-dim); }
.foot-nav a:hover{ color:var(--ink); }
.foot-statement{ font-family:'Space Grotesk'; font-size:clamp(18px,2.4vw,26px); margin-top:48px; max-width:20ch; }
.foot-bottom{ margin-top:40px; padding-top:24px; border-top:1px solid var(--line-soft); display:flex; justify-content:space-between; font-size:12px; color:var(--ink-faint); flex-wrap:wrap; gap:10px; }

/* ---------- products page ---------- */
.product-tabs{ display:flex; gap:10px; flex-wrap:wrap; margin-top:8px; }
.product-tab{
  border:1px solid var(--line); border-radius:999px; padding:11px 20px; font-size:13px; cursor:pointer;
  color:var(--ink-dim); font-family:'Space Grotesk'; transition:all .3s var(--ease);
}
.product-tab.active{ border-color:var(--blue); color:var(--ink); background:rgba(79,125,243,.12); }
.product-stage{ margin-top:48px; display:grid; grid-template-columns:1fr 1.1fr; gap:clamp(30px,6vw,70px); align-items:center; }
@media (max-width:900px){ .product-stage{ grid-template-columns:1fr; } }
.product-visual{ aspect-ratio:1/1; position:relative; border-radius:var(--radius-m); overflow:hidden; background:radial-gradient(circle at 30% 30%, rgba(79,125,243,.18), transparent 60%), var(--surface); }
.product-visual canvas{ width:100%; height:100%; display:block; cursor:grab; }
.globe-city-label{
  position:absolute; transform:translate(-50%,-100%); font-family:'IBM Plex Mono',monospace; font-size:10.5px;
  letter-spacing:.04em; white-space:nowrap; pointer-events:none; opacity:0; transition:opacity .25s var(--ease);
}

/* ---------- footprint globe (portfolio, tema terang) ---------- */
.fp-grid{ display:grid; grid-template-columns:1fr 1fr; gap:clamp(28px,5vw,64px); align-items:start; margin-top:44px; }
@media (min-width:901px){ .fp-grid > div:first-child{ position:sticky; top:96px; } }
@media (max-width:900px){ .fp-grid{ grid-template-columns:1fr; } }
.fp-globe{ position:relative; aspect-ratio:1/1; max-width:560px; width:100%; margin:0 auto; border-radius:var(--radius-m); overflow:hidden;
  background:radial-gradient(circle at 32% 28%, rgba(79,125,243,.14), transparent 62%), var(--surface); border:1px solid var(--line); }
.fp-globe canvas{ width:100%; height:100%; display:block; cursor:grab; }
.fp-globe .globe-city-label{ font-weight:600; background:rgba(255,255,255,.88); padding:3px 8px; border-radius:999px; border:1px solid var(--line); }
.fp-list{ list-style:none; margin:0; padding:0; display:grid; gap:8px; }
.fp-item{ display:grid; grid-template-columns:auto 1fr; gap:4px 14px; padding:13px 16px; border:1px solid var(--line); border-radius:6px; cursor:pointer; background:var(--surface); transition:border-color .25s, background .25s; text-align:left; font:inherit; color:inherit; width:100%; }
.fp-item:hover, .fp-item.on{ border-color:var(--blue); background:rgba(79,125,243,.07); }
.fp-item:focus-visible{ outline:2px solid var(--blue); outline-offset:2px; }
.fp-city{ font-family:'Space Grotesk'; font-weight:600; font-size:15px; }
.fp-tag{ font-size:10px; letter-spacing:.1em; color:var(--ink-faint); align-self:center; justify-self:end; }
.fp-who{ grid-column:1/-1; font-size:12.5px; line-height:1.5; color:var(--ink-dim); }
/* ---------- factory hero (products) ---------- */
.fx{ border-radius:var(--radius-m); overflow:hidden; background:#000; color:#f0f0f0; }
.fx-stage{ position:relative; aspect-ratio:1/1; touch-action:none; }
.fx-stage canvas{ display:block; width:100%; height:100%; cursor:grab; }
.fx-note{ position:absolute; inset:0; display:grid; place-items:center; padding:24px; text-align:center; font-size:12px; color:#9a9aa2; }
.fx-dock{ padding:14px 16px 18px; }
.fx-cap{ font-size:12.5px; line-height:1.5; color:#c9c9ce; text-align:center; margin:0; }
.fx-chips{ display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin-top:12px; }
.fx-chip{ font:inherit; font-size:12.5px; color:#f0f0f0; background:#161618; border:0; box-shadow:inset 0 0 0 1px #26262b; border-radius:999px; padding:9px 15px; cursor:pointer; transition:background .24s, box-shadow .24s; }
.fx-chip:hover{ background:#1f1f22; box-shadow:inset 0 0 0 1px #9a9aa2; }
.fx-chip[aria-pressed=true]{ background:#f0f0f0; color:#111; font-weight:700; box-shadow:none; }
.fx-chip:focus-visible{ outline:2px solid #ff7a1a; outline-offset:2px; }
.fx-chip .nori-mark{ height:1.5em; vertical-align:-.38em; margin:-.3em 0; }
.fx-chap{ min-height:20px; margin:10px 0 0; font-size:12px; text-align:center; color:#9a9aa2; }
.fx-chap b{ color:#f0f0f0; }
.globe-hint{ margin-top:14px; font-size:11px; letter-spacing:.08em; color:var(--ink-faint); text-align:center; }

/* ---------- certification ecosystem (products page) ---------- */
.cert-pillars{ display:flex; flex-wrap:wrap; gap:10px; margin-top:26px; }
.cert-pillars span{
  font-family:'Space Grotesk'; font-size:12.5px; padding:9px 16px; border:1px solid var(--line);
  border-radius:999px; color:var(--ink-dim);
}
.cert-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:20px; margin-top:34px; }
@media (max-width:900px){ .cert-grid{ grid-template-columns:1fr; } }
.cert-card{ border:1px solid var(--line); border-radius:var(--radius-m); padding:26px; background:rgba(255,255,255,.02); }
.cert-logo-wrap{ display:inline-flex; align-items:center; background:#fff; padding:12px 16px; border-radius:8px; }
.cert-logo{ height:26px; width:auto; display:block; }
.cert-desc{ margin-top:18px; font-size:14px; line-height:1.6; color:var(--ink-dim); }
.cert-list{ margin:16px 0 0; padding-left:18px; font-size:13px; color:var(--ink-dim); line-height:1.8; }

/* ---------- company profile upload + slideshow (products page) ---------- */
.product-actions{ display:flex; align-items:center; flex-wrap:wrap; gap:14px; margin-top:28px; }
.compro-widget{ display:inline-flex; align-items:center; }
.compro-upload-btn{
  font-family:'Space Grotesk'; font-size:12px; letter-spacing:.02em; padding:11px 18px; border-radius:999px;
  border:1px dashed var(--line); background:transparent; color:var(--ink-faint); cursor:pointer; transition:all .3s var(--ease);
}
.compro-upload-btn:hover{ border-color:var(--blue); border-style:solid; color:var(--ink); }
.compro-loaded{ display:inline-flex; align-items:center; gap:8px; }
.compro-name{ max-width:130px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--ink-faint); font-family:'IBM Plex Mono',monospace; font-size:10.5px; }
.compro-open-btn, .compro-remove-btn{
  font-family:'Space Grotesk'; font-size:11.5px; padding:9px 14px; border-radius:999px; border:1px solid var(--line);
  background:transparent; cursor:pointer; transition:all .25s var(--ease); color:var(--ink-dim);
}
.compro-open-btn{ border-color:var(--blue); color:var(--blue); }
.compro-open-btn:hover{ background:var(--blue); color:#fff; }
.compro-remove-btn:hover{ border-color:#e0489f; color:#e0489f; }
.compro-status{ font-size:11px; color:var(--ink-faint); font-family:'IBM Plex Mono',monospace; }

.compro-viewer{
  position:fixed; inset:0; z-index:400; background:#08090f; display:none; flex-direction:column;
  padding-top:var(--safe-t); padding-bottom:var(--safe-b);
}
.compro-viewer.open{ display:flex; }
.cv-bar{ display:flex; align-items:center; justify-content:space-between; padding:16px 22px; color:#f4f5f9; font-family:'Space Grotesk'; flex-shrink:0; }
.cv-title{ font-size:13.5px; max-width:50vw; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.cv-page{ font-family:'IBM Plex Mono',monospace; font-size:12px; color:#9297b0; }
.cv-close{ background:none; border:1px solid rgba(244,245,249,.2); color:#f4f5f9; border-radius:999px; padding:8px 16px; font-size:12px; cursor:pointer; font-family:'Space Grotesk'; }
.cv-close:hover{ border-color:#f4f5f9; }
.cv-stage{ flex:1; display:flex; align-items:center; justify-content:center; position:relative; padding:10px 60px; min-height:0; }
.cv-nav{
  position:absolute; top:50%; transform:translateY(-50%); width:48px; height:48px; border-radius:50%;
  border:1px solid rgba(244,245,249,.2); background:rgba(255,255,255,.04); color:#f4f5f9; font-size:22px; cursor:pointer;
  display:flex; align-items:center; justify-content:center; font-family:'Space Grotesk'; transition:background .25s;
}
.cv-prev{ left:14px; } .cv-next{ right:14px; }
.cv-nav:hover{ background:rgba(255,255,255,.14); }
.cv-nav:disabled{ opacity:.2; cursor:default; }
@media (max-width:640px){ .cv-stage{ padding:10px 46px; } .cv-nav{ width:36px; height:36px; font-size:17px; } .cv-title{ max-width:40vw; } }

/* ---------- company profile upload + slideshow (products page) ---------- */
.panel-actions{ display:flex; align-items:center; gap:14px; flex-wrap:wrap; margin-top:28px; }
.compro-slot{ display:inline-flex; }
.compro-hint{ margin-top:10px; font-size:11px; color:var(--ink-faint); max-width:38ch; line-height:1.5; }
.compro-upload{
  display:inline-flex; align-items:center; gap:8px; font-family:'Space Grotesk'; font-size:12.5px;
  padding:10px 18px; border:1px dashed var(--line); border-radius:999px; cursor:pointer; color:var(--ink-dim);
  transition:border-color .3s var(--ease), color .3s var(--ease), background .3s var(--ease);
}
.compro-upload:hover{ border-color:var(--blue); color:var(--ink); background:rgba(79,125,243,.08); }
.compro-upload .cp-icon{ font-size:15px; line-height:1; }
.compro-loaded{
  display:inline-flex; align-items:center; gap:10px; font-size:12.5px; color:var(--ink-dim);
  border:1px solid var(--line); padding:8px 8px 8px 16px; border-radius:999px; background:rgba(255,255,255,.03);
}
.cp-name{ max-width:170px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-family:'Space Grotesk'; color:var(--ink); }
.cp-present{
  background:var(--blue); color:#fff; border:none; padding:7px 14px; border-radius:999px; font-size:11.5px;
  font-family:'Space Grotesk'; cursor:pointer; letter-spacing:.02em; white-space:nowrap;
}
.cp-remove{
  background:transparent; border:none; color:var(--ink-faint); cursor:pointer; font-size:13px;
  width:24px; height:24px; border-radius:50%; flex-shrink:0; transition:background .25s, color .25s;
}
.cp-remove:hover{ background:rgba(255,90,90,.15); color:#ff6b6b; }

.compro-viewer{
  position:fixed; inset:0; z-index:500; background:#08090c; display:flex; flex-direction:column;
}
.compro-viewer[hidden]{ display:none; }
.cv-top{
  display:flex; align-items:center; justify-content:space-between; padding:18px clamp(16px,4vw,32px);
  padding-top:calc(18px + var(--safe-t)); color:#f4f5f9; flex-shrink:0;
}
.cv-title{ font-family:'Space Grotesk'; font-size:14px; color:#9297b0; }
.cv-close{
  background:transparent; border:1px solid rgba(244,245,249,.2); color:#f4f5f9; border-radius:999px;
  padding:8px 16px; font-size:12px; font-family:'Space Grotesk'; cursor:pointer; letter-spacing:.03em;
}
.cv-close:hover{ background:rgba(244,245,249,.1); }
.cv-stage{ flex:1; display:flex; align-items:center; justify-content:center; gap:16px; min-height:0; padding:0 clamp(8px,3vw,24px); }
.cv-canvas-wrap{ flex:1 1 auto; min-width:0; height:100%; display:flex; align-items:center; justify-content:center; min-height:0; }
#cvCanvas{ display:block; max-width:none; max-height:none; flex:none; box-shadow:0 30px 80px rgba(0,0,0,.6); border-radius:2px; background:#fff; }
.cv-nav{
  background:rgba(244,245,249,.06); border:1px solid rgba(244,245,249,.16); color:#f4f5f9; width:46px; height:46px;
  border-radius:50%; font-size:18px; cursor:pointer; flex-shrink:0; transition:background .25s;
}
.cv-nav:hover{ background:rgba(244,245,249,.16); }
.cv-nav:disabled{ opacity:.25; cursor:default; }
.cv-bottom{
  text-align:center; padding:16px; padding-bottom:calc(16px + var(--safe-b)); color:#5b6080; font-family:'IBM Plex Mono',monospace;
  font-size:12px; flex-shrink:0;
}
@media (max-width:640px){ .cv-nav{ width:38px; height:38px; font-size:15px; } }

.product-panel[hidden]{ display:none; }
.product-tag{ font-size:12px; letter-spacing:.1em; color:var(--blue); margin-bottom:14px; }
.product-name{ font-size:clamp(28px,4vw,44px); }
.product-desc{ margin-top:18px; font-size:16px; color:var(--ink-dim); max-width:48ch; line-height:1.6; }
.product-meta{ margin-top:28px; display:grid; gap:18px; }
.product-meta .row{ display:grid; grid-template-columns:130px 1fr; gap:16px; padding-top:16px; border-top:1px solid var(--line-soft); font-size:14px; }
.product-meta .row .k{ color:var(--ink-faint); font-size:12px; letter-spacing:.06em; }
.product-meta .row .v{ color:var(--ink-dim); line-height:1.55; }
.product-meta ul{ margin:0; padding-left:16px; color:var(--ink-dim); }
.product-meta li{ margin-bottom:4px; }

.eyebrow .nori-mark, .tag .nori-mark, .mono .nori-mark, .btn .nori-mark, .faq-q .nori-mark{ height:1.4em; vertical-align:-.32em; }
nav.main-nav .nori-mark{ height:1.45em; vertical-align:-.34em; }
h1 .nori-mark, h2 .nori-mark, h3 .nori-mark, h4 .nori-mark{ height:1em; vertical-align:-.1em; margin:0; }
.nori-logo .nori-mark{ height:1em; vertical-align:baseline; margin:0; }

.pathway-steps{ display:flex; align-items:center; flex-wrap:wrap; gap:0; margin-top:56px; }
.pathway-steps .step{ font-family:'Space Grotesk'; font-size:clamp(14px,1.8vw,20px); padding:14px 22px; border:1px solid var(--line); border-radius:999px; color:var(--ink-faint); }
.pathway-steps .step.on{ color:var(--ink); border-color:var(--yellow); }
.pathway-steps .arrow-sep{ padding:0 14px; color:var(--ink-faint); }
.radar-wrap{ display:grid; grid-template-columns:1fr 1fr; gap:60px; align-items:center; margin-top:24px; }
@media (max-width:860px){ .radar-wrap{ grid-template-columns:1fr; } }
.radar-list{ display:grid; gap:14px; }
.radar-item{ display:grid; grid-template-columns:1fr auto; gap:12px; align-items:center; padding-bottom:12px; border-bottom:1px solid var(--paper-2); font-size:15px; }
.radar-item .bar{ width:140px; height:4px; background:var(--paper-2); border-radius:2px; overflow:hidden; }
.radar-item .bar i{ display:block; height:100%; background:var(--blue); width:0; transition:width 1.1s var(--ease); }

/* ---------- portfolio ---------- */
.case{ border-top:1px solid var(--paper-ink-dim); padding:44px 0; cursor:pointer; }
.case:last-child{ border-bottom:1px solid var(--paper-ink-dim); }
.case-head{ display:flex; justify-content:space-between; align-items:baseline; gap:20px; }
.case-head h3{ font-size:clamp(20px,2.6vw,32px); }
.case-tag{ font-size:12px; color:var(--paper-ink-dim); white-space:nowrap; }
.case-body{ max-height:0; overflow:hidden; transition:max-height .5s var(--ease); }
.case.open .case-body{ max-height:600px; }
.case-photo{ width:100%; max-height:280px; object-fit:cover; border-radius:6px; margin-top:26px; filter:grayscale(.15); }
.case-body-in{ padding-top:26px; display:grid; grid-template-columns:repeat(4,1fr); gap:24px; }
.case-body-in.has-photo{ padding-top:20px; }
@media (max-width:800px){ .case-body-in{ grid-template-columns:1fr 1fr; } }
.case-col .k{ font-size:11px; letter-spacing:.08em; color:var(--paper-ink-dim); margin-bottom:8px; }
.case-col .v{ font-size:14px; line-height:1.55; }
.case-metric{ font-family:'Space Grotesk'; font-size:22px; color:var(--blue); }
.case-toggle{ font-size:22px; font-family:'Space Grotesk'; transition:transform .4s var(--ease); }
.case.open .case-toggle{ transform:rotate(45deg); }
.sector-cols{ display:grid; grid-template-columns:repeat(3,1fr); gap:32px; margin-top:20px; }
@media (max-width:760px){ .sector-cols{ grid-template-columns:1fr; } }
.sector-panel{ margin-top:32px; display:grid; grid-template-columns:repeat(3,1fr); gap:20px; }
@media (max-width:860px){ .sector-panel{ grid-template-columns:1fr; } }

/* ---------- interactive sector hover list ---------- */
.sector-links{ margin-top:12px; position:relative; }
.sector-link{
  position:relative; display:flex; align-items:center; justify-content:space-between; gap:20px;
  padding:30px 6px; border-top:1px solid var(--paper-2); cursor:pointer; overflow:hidden;
}
.sector-link:last-child{ border-bottom:1px solid var(--paper-2); }
.sl-text{ position:relative; z-index:3; transition:transform .45s var(--ease); }
.sector-link:hover .sl-text, .sector-link.active .sl-text{ transform:translateX(-14px); }
.sl-heading{
  font-family:'Space Grotesk'; font-weight:700; letter-spacing:-.01em;
  font-size:clamp(30px,5.2vw,54px); color:var(--paper-ink-dim); display:block; line-height:1;
  transition:color .4s var(--ease);
}
.sector-link:hover .sl-heading{ color:var(--paper-ink); }
.sector-link.active .sl-heading{ color:var(--blue); }
.sl-sub{ display:block; font-size:13px; color:var(--paper-ink-dim); margin-top:10px; max-width:38ch; }
.sl-arrow{
  font-family:'Space Grotesk'; font-size:26px; color:var(--paper-ink); position:relative; z-index:3;
  opacity:0; transform:translateY(10px) rotate(-90deg); transition:all .4s var(--ease); flex-shrink:0;
}
.sector-link:hover .sl-arrow{ opacity:1; transform:translateY(0) rotate(-90deg); }
.sector-link.active .sl-arrow{ opacity:1; transform:translateY(0) rotate(0deg); color:var(--blue); }
.sl-image{
  position:absolute; width:230px; height:150px; object-fit:cover; border-radius:12px; z-index:2;
  pointer-events:none; opacity:0; top:50%; left:78%;
  transform:translate(-50%,-50%) scale(.55) rotate(-10deg);
  transition:opacity .3s var(--ease), transform .5s cubic-bezier(.34,1.56,.64,1);
  box-shadow:0 24px 48px rgba(14,15,22,.28), 0 0 0 1px rgba(14,15,22,.06);
  filter:grayscale(.2);
}
@media (hover:hover) and (pointer:fine){
  .sector-link:hover .sl-image{ opacity:1; transform:translate(-50%,-50%) scale(1) rotate(3deg); }
}
@media (max-width:700px){
  .sl-image{ display:none; }
  .sl-heading{ font-size:clamp(24px,8vw,34px); }
}
.sector-cols h5{ font-size:12px; letter-spacing:.08em; color:var(--paper-ink-dim); margin-bottom:14px; font-weight:600; }
.chip-list{ display:flex; flex-wrap:wrap; gap:8px; }
.chip{ font-size:12.5px; padding:7px 12px; border:1px solid var(--paper-2); border-radius:999px; color:var(--paper-ink-dim); }

/* ---------- FAQ ---------- */
.faq-item{ border-top:1px solid var(--paper-2); }
.faq-item:last-child{ border-bottom:1px solid var(--paper-2); }
.faq-q{ display:flex; justify-content:space-between; align-items:center; gap:20px; padding:26px 0; cursor:pointer; }
.faq-q h4{ font-size:clamp(16px,2vw,20px); font-weight:500; }
.faq-plus{ font-family:'Space Grotesk'; font-size:22px; transition:transform .35s var(--ease); flex-shrink:0; }
.faq-item.open .faq-plus{ transform:rotate(45deg); }
.faq-a{ max-height:0; overflow:hidden; transition:max-height .45s var(--ease); }
.faq-item.open .faq-a{ max-height:260px; }
.faq-a-in{ padding-bottom:26px; max-width:62ch; color:var(--paper-ink-dim); font-size:15px; line-height:1.6; }

/* ---------- contact ---------- */
.contact-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:1px; background:var(--line); border:1px solid var(--line); margin-top:56px; }
@media (max-width:860px){ .contact-grid{ grid-template-columns:repeat(2,1fr); } }
@media (max-width:520px){ .contact-grid{ grid-template-columns:1fr; } }
.contact-cell{ background:var(--void); padding:34px 28px; }
.contact-cell .k{ font-size:11px; letter-spacing:.1em; color:var(--ink-faint); }
.contact-cell .v{ font-family:'Space Grotesk'; font-size:20px; margin-top:12px; }
.contact-cell .d{ font-size:13px; color:var(--ink-dim); margin-top:10px; }
.contact-cell .go{ margin-top:18px; display:inline-flex; align-items:center; gap:8px; font-size:13px; border-bottom:1px solid var(--ink-faint); padding-bottom:2px; }

/* ---------- magnetic + cursor dot ---------- */
.cursor-dot{ position:fixed; width:9px; height:9px; border-radius:50%; background:#0e0f16; pointer-events:none; z-index:9999; transform:translate(-50%,-50%); transition:width .25s var(--ease),height .25s var(--ease),opacity .25s,background .3s; opacity:0; }
body.on-dark-active .cursor-dot{ background:#f4f5f9; }
.cursor-dot.hovering{ background:var(--blue); }
@media (hover:hover) and (pointer:fine){ .cursor-dot.show{ opacity:1; } }

/* ---------- floating conversation bubble ---------- */
.float-chat{
  position:fixed; right:clamp(16px,3vw,32px); bottom:calc(clamp(16px,3vw,32px) + var(--safe-b));
  z-index:150; display:flex; align-items:center; gap:10px;
  background:#0e0f16; color:#f4f5f9; border-radius:999px; padding:14px; text-decoration:none;
  box-shadow:0 10px 30px rgba(14,15,22,.28); transition:padding .35s var(--ease), gap .35s var(--ease), transform .3s var(--ease), box-shadow .3s var(--ease);
  overflow:hidden;
}
.float-chat:hover{ padding:14px 22px 14px 14px; transform:translateY(-2px); box-shadow:0 16px 40px rgba(14,15,22,.34); }
.float-chat .fc-icon{ width:22px; height:22px; flex-shrink:0; display:flex; align-items:center; justify-content:center; }
.float-chat .fc-icon svg{ width:100%; height:100%; }
.float-chat .fc-dot{ position:absolute; top:10px; right:10px; width:8px; height:8px; border-radius:50%; background:#4ade80; box-shadow:0 0 0 2px #0e0f16; animation:fcPulse 2.4s ease-in-out infinite; }
.float-chat .fc-label{ max-width:0; overflow:hidden; white-space:nowrap; font-size:13px; font-family:'Space Grotesk'; font-weight:600; transition:max-width .4s var(--ease); }
.float-chat:hover .fc-label{ max-width:160px; }
@keyframes fcPulse{ 0%,100%{ box-shadow:0 0 0 2px #0e0f16, 0 0 0 0 rgba(74,222,128,.5);} 50%{ box-shadow:0 0 0 2px #0e0f16, 0 0 0 6px rgba(74,222,128,0);} }
@media (max-width:640px){ .float-chat .fc-label{ display:none; } .float-chat:hover{ padding:14px; } }

@media (prefers-reduced-motion: reduce){
  *{ animation-duration:.001ms !important; transition-duration:.001ms !important; }
}

@media (max-width:760px){
  nav.main-nav{ display:none; }
  .hamburger{ display:flex; }
}
.hamburger{ width:34px; height:34px; align-items:center; justify-content:center; border:1px solid rgba(14,15,22,.18); border-radius:50%; cursor:pointer; }
.hamburger span{ width:14px; height:1px; background:var(--paper-ink); position:relative; }
.hamburger span::before,.hamburger span::after{ content:''; position:absolute; left:0; width:14px; height:1px; background:var(--paper-ink); }
.hamburger span::before{ top:-4px; } .hamburger span::after{ top:4px; }
body.on-dark-active .hamburger{ border-color:rgba(244,245,249,.2); }
body.on-dark-active .hamburger span, body.on-dark-active .hamburger span::before, body.on-dark-active .hamburger span::after{ background:#f4f5f9; }
.mobile-menu{ position:fixed; inset:0; z-index:99; display:none; flex-direction:column; padding:100px 28px 40px; gap:22px; }
.mobile-menu.open{ display:flex; }
.mobile-menu a{ font-family:'Space Grotesk'; font-size:26px; }
.mobile-menu .close{ position:absolute; top:26px; right:24px; font-size:14px; }
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
<script>
(function(){
"use strict";

var reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
var fineHover = window.matchMedia('(hover:hover) and (pointer:fine)').matches;

/* ============ CONTENT TEMPLATES ============ */
var TPL = {
  home: document.getElementById('tpl-home').innerHTML,
  nori: document.getElementById('tpl-nori').innerHTML,
  products: document.getElementById('tpl-products').innerHTML,
  portfolio: document.getElementById('tpl-portfolio').innerHTML,
  contact: document.getElementById('tpl-contact').innerHTML
};

var app = document.getElementById('app');
var body = document.body;
var header = document.getElementById('siteHeader');

/* ============ ROUTER ============ */
function routeFromHash(){
  var h = location.hash.replace('#','').replace(/^\//,'').trim();
  if(!h) h = 'home';
  if(!TPL[h]) h = 'home';
  return h;
}

function renderPage(name){
  app.innerHTML = TPL[name];
  window.scrollTo({top:0, behavior:'instant' in document.documentElement.style ? 'instant' : 'auto'});
  document.querySelectorAll('nav.main-nav a[data-page]').forEach(function(a){
    a.classList.toggle('active', a.getAttribute('data-page') === name);
  });
  initPageBehaviors(name);
  setupLightSections();
  onScroll();
  requestAnimationFrame(function(){
    if(window._bgResize) window._bgResize(); else if(window.syncBgHeight) syncBgHeight();
    setTimeout(function(){ if(window._bgResize) window._bgResize(); }, 260);
  });
}

function navigate(){
  var name = routeFromHash();
  renderPage(name);
}

window.addEventListener('hashchange', navigate);
document.addEventListener('click', function(e){
  var a = e.target.closest('[data-link]');
  if(!a) return;
  var href = a.getAttribute('href') || '';
  if(href.indexOf('#/') === 0){
    e.preventDefault();
    if(location.hash === href){ navigate(); }
    else { location.hash = href; }
    closeMobileMenu();
  }
});

/* ============ HEADER SOLID + LIGHT SECTION DETECTION ============ */
var lightObserver = null;
function setupLightSections(){
  if(lightObserver) lightObserver.disconnect();
  var wrapperIsDark = !!app.querySelector(':scope > div.on-dark');
  var sections = Array.prototype.slice.call(app.querySelectorAll(':scope > div > section'));
  body.classList.toggle('on-dark-active', wrapperIsDark);
  if(!sections.length) return;
  lightObserver = new IntersectionObserver(function(entries){
    entries.forEach(function(entry){
      if(entry.isIntersecting){
        var isDark = wrapperIsDark || entry.target.classList.contains('on-dark');
        body.classList.toggle('on-dark-active', isDark);
      }
    });
  }, { rootMargin: '-73px 0px -80% 0px', threshold: 0 });
  sections.forEach(function(s){ lightObserver.observe(s); });
}

var scrollProgress = document.getElementById('scrollProgress');
function onScroll(){
  header.classList.toggle('solid', window.scrollY > 10);
  var doc = document.documentElement;
  var max = doc.scrollHeight - doc.clientHeight;
  var pct = max > 0 ? (window.scrollY / max) * 100 : 0;
  scrollProgress.style.width = pct + '%';
  updateParallax();
}
window.addEventListener('scroll', onScroll, {passive:true});

/* ============ HERO PARALLAX ============ */
function updateParallax(){
  if(reducedMotion) return;
  var hero = document.getElementById('heroSection');
  if(!hero) return;
  var rect = hero.getBoundingClientRect();
  if(rect.bottom < 0) return;
  var inner = hero.querySelector('.hero-inner');
  if(!inner) return;
  var progress = Math.max(0, Math.min(1, -rect.top / Math.max(rect.height,1)));
  inner.style.transform = 'translateY(' + (progress * 60) + 'px)';
  inner.style.opacity = String(1 - progress * 0.7);
}

/* ============ MOBILE MENU ============ */
var mobileMenu = document.getElementById('mobileMenu');
document.getElementById('hamburgerBtn').addEventListener('click', function(){ mobileMenu.classList.add('open'); });
document.getElementById('mobileClose').addEventListener('click', closeMobileMenu);
function closeMobileMenu(){ mobileMenu.classList.remove('open'); }

/* ============ CUSTOM CURSOR ============ */
var cursorDot = document.getElementById('cursorDot');
if(fineHover && !reducedMotion){
  document.addEventListener('mousemove', function(e){
    cursorDot.classList.add('show');
    cursorDot.style.left = e.clientX + 'px';
    cursorDot.style.top = e.clientY + 'px';
  });
  document.addEventListener('mouseover', function(e){
    var t = e.target.closest('a,button,.magnet,[data-link],.tilt,.bmc-tile,.eco-node,.faq-q,.case-head');
    cursorDot.classList.toggle('hovering', !!t);
    cursorDot.style.width = t ? '26px' : '9px';
    cursorDot.style.height = t ? '26px' : '9px';
  });
}

/* ============ MAGNETIC BUTTONS ============ */
if(fineHover && !reducedMotion){
  document.addEventListener('mousemove', function(e){
    var m = e.target.closest('.magnet');
    document.querySelectorAll('.magnet').forEach(function(el){
      if(el !== m){ el.style.transform=''; }
    });
    if(m){
      var r = m.getBoundingClientRect();
      var x = (e.clientX - (r.left + r.width/2)) * 0.25;
      var y = (e.clientY - (r.top + r.height/2)) * 0.35;
      m.style.transform = 'translate(' + x + 'px,' + y + 'px)';
      m.style.transition = 'transform .12s linear';
    }
  });
  document.addEventListener('mouseleave', function(){
    document.querySelectorAll('.magnet').forEach(function(el){ el.style.transform=''; });
  }, true);
}

/* ============ REVEAL ON SCROLL ============ */
var revealObserver = new IntersectionObserver(function(entries){
  entries.forEach(function(entry){
    if(entry.isIntersecting){
      entry.target.classList.add('in');
      revealObserver.unobserve(entry.target);
    }
  });
}, { threshold: 0.15 });

function initReveals(){
  document.querySelectorAll('.reveal:not(.in)').forEach(function(el){ revealObserver.observe(el); });
}

/* ============ SPLIT-TEXT KINETIC WORD REVEAL ============ */
var splitObserver = new IntersectionObserver(function(entries){
  entries.forEach(function(entry){
    if(entry.isIntersecting){
      entry.target.querySelectorAll('.split-line').forEach(function(line, i){
        setTimeout(function(){ line.classList.add('in'); }, i * 70);
      });
      splitObserver.unobserve(entry.target);
    }
  });
}, {threshold:.35});

function initSplitText(){
  document.querySelectorAll('.split').forEach(function(el){
    if(el.dataset.split === 'done') return;
    el.dataset.split = 'done';
    var nodes = Array.prototype.slice.call(el.childNodes);
    el.innerHTML = '';
    nodes.forEach(function(node){
      if(node.nodeType === 3){
        var words = node.textContent.split(/(\s+)/);
        words.forEach(function(w){
          if(w.trim() === ''){ el.appendChild(document.createTextNode(w)); return; }
          var line = document.createElement('span');
          line.className = 'split-line';
          var word = document.createElement('span');
          word.className = 'split-word';
          word.textContent = w;
          line.appendChild(word);
          el.appendChild(line);
          el.appendChild(document.createTextNode(' '));
        });
      } else {
        el.appendChild(node);
      }
    });
    splitObserver.observe(el);
  });
}

/* ============ HERO WORD REVEAL ============ */
function initHero(){
  var hero = document.getElementById('heroSection');
  if(!hero) return;
  requestAnimationFrame(function(){
    setTimeout(function(){ hero.classList.add('revealed'); }, 150);
  });
}

/* ============ WORD CLOUD ============ */
function initWordCloud(){
  var cloud = document.getElementById('wordCloud');
  if(!cloud) return;
  var words = cloud.querySelectorAll('span');
  var done = false;
  var obs = new IntersectionObserver(function(entries){
    entries.forEach(function(entry){
      if(entry.isIntersecting && !done){
        done = true;
        words.forEach(function(w, i){
          setTimeout(function(){ w.classList.add('on'); }, i * 130);
        });
        obs.disconnect();
      }
    });
  }, {threshold:.4});
  obs.observe(cloud);
}

/* ============ ANIMATED COUNTERS ============ */
function initCounters(){
  var counters = document.querySelectorAll('[data-count]');
  var obs = new IntersectionObserver(function(entries){
    entries.forEach(function(entry){
      if(entry.isIntersecting){
        animateCount(entry.target);
        obs.unobserve(entry.target);
      }
    });
  }, {threshold:.5});
  counters.forEach(function(c){ obs.observe(c); });
}
function animateCount(el){
  var target = parseInt(el.getAttribute('data-count'), 10);
  var suffix = el.getAttribute('data-suffix') || '';
  if(reducedMotion){ el.textContent = target.toLocaleString('en-US') + suffix; return; }
  var start = null, dur = 1400;
  function step(ts){
    if(!start) start = ts;
    var p = Math.min((ts - start) / dur, 1);
    var eased = 1 - Math.pow(1 - p, 3);
    var val = Math.floor(eased * target);
    el.textContent = val.toLocaleString('en-US') + suffix;
    if(p < 1) requestAnimationFrame(step);
    else el.textContent = target.toLocaleString('en-US') + suffix;
  }
  requestAnimationFrame(step);
}

function initBmc(){
  var grid = document.getElementById('bmcGrid');

      + '<div class="bmc-top"><span class="bmc-idx mono">'+b.idx+'</span><span class="bmc-eyebrow mono">'+b.label+'</span>'+(b.core?'<span class="tag">CORE</span>':'')+'</div>'

      + '</article>';
  }).join('');

  var tiles = Array.prototype.slice.call(grid.querySelectorAll('.bmc-tile'));
  var pinned = narrow() ? null : 'value', hovered = null;

  function fillDetail(k){
    if(!k){ detail.innerHTML = '<div><div class="bmc-d-eyebrow mono">BUSINESS MODEL</div><div class="bmc-d-title">Pilih satu blok</div><p class="bmc-d-desc">Klik atau arahkan kursor ke salah satu blok untuk melihat detail dan blok yang terhubung dengannya.</p></div>'; return; }
    var b = BMC_BLOCKS[k];
    detail.innerHTML = '<div><div class="bmc-d-eyebrow mono">'+b.idx+' &middot; '+b.label+'</div><div class="bmc-d-title">'+b.title+'</div><p class="bmc-d-desc">'+bmcFmt(b.desc)+'</p>'
      + (k==='value' ? '<a class="bmc-d-link" href="#/nori" data-link>Lihat '+NORI_MARK+' &rarr;</a>' : '') + '</div>'
      + '<div><div class="bmc-d-label mono">TERHUBUNG DENGAN</div><div class="bmc-chips">'+bmcChips(k)+'</div></div>';
  }
  function apply(){
    var k = hovered || pinned;
    tiles.forEach(function(t){
      var key = t.getAttribute('data-bmc');
      t.classList.toggle('active', key===k);
      t.classList.toggle('linked', !!k && key!==k && BMC_REL[k].indexOf(key)>-1);
      t.setAttribute('aria-pressed', key===pinned ? 'true' : 'false');
    });
    grid.classList.toggle('has-active', !!k);
    fillDetail(k);
    var p = BMC_ORDER.indexOf(k);
    if(posEl) posEl.textContent = (p>-1 ? (p+1) : '—') + ' / 9';
  }
  function pin(k, focusTile){
    pinned = k; hovered = null; apply();
    if(k && narrow()){
      var el = grid.querySelector('[data-bmc="'+k+'"]');
      if(el && el.scrollIntoView) el.scrollIntoView({behavior: reducedMotion ? 'auto' : 'smooth', block:'center'});
    }
    if(k && focusTile){ var f = grid.querySelector('[data-bmc="'+k+'"]'); if(f) f.focus({preventScroll:true}); }
  }
  function step(d){
    var p = BMC_ORDER.indexOf(pinned);
    var n = p<0 ? (d>0 ? 0 : BMC_ORDER.length-1) : (p + d + BMC_ORDER.length) % BMC_ORDER.length;
    pin(BMC_ORDER[n], false);
  }

  tiles.forEach(function(t){
    var key = t.getAttribute('data-bmc');
    t.addEventListener('click', function(e){
      if(e.target.closest('[data-go]')) return;
      pin(pinned===key ? null : key, false);
    });
    t.addEventListener('mouseenter', function(){ if(!fineHover) return; hovered = key; apply(); });
    t.addEventListener('keydown', function(e){
      if(e.key==='Enter' || e.key===' '){ e.preventDefault(); pin(pinned===key ? null : key, false); }
      else if(e.key==='ArrowRight' || e.key==='ArrowDown'){ e.preventDefault(); var p=BMC_ORDER.indexOf(key); pin(BMC_ORDER[(p+1)%9], true); }
      else if(e.key==='ArrowLeft' || e.key==='ArrowUp'){ e.preventDefault(); var q=BMC_ORDER.indexOf(key); pin(BMC_ORDER[(q+8)%9], true); }
      else if(e.key==='Escape'){ pin(null, false); }
    });
  });
  grid.addEventListener('mouseleave', function(){ if(hovered){ hovered = null; apply(); } });
  function goHandler(e){
    var c = e.target.closest('[data-go]');
    if(!c) return;
    e.stopPropagation();
    pin(c.getAttribute('data-go'), false);
  }
  grid.addEventListener('click', goHandler, true);
  detail.addEventListener('click', goHandler);
  var prev = document.getElementById('bmcPrev'), next = document.getElementById('bmcNext');
  if(prev) prev.addEventListener('click', function(){ step(-1); });
  if(next) next.addEventListener('click', function(){ step(1); });
  apply();
}

/* ============ COMPANY PROFILE UPLOAD + SLIDESHOW (products page) ============
   Fully client-side: a PDF picked here never leaves this device/session.
   State lives in comproState so it survives SPA page swaps; only an
   explicit "remove" click or a page reload clears it. */
var comproState = { academy:null, governance:null, transform:null };
var pdfjsReady = false, pdfjsLoading = false, pdfjsQueue = [];

function ensurePdfWorker(){
  if(window.pdfjsLib && !window._pdfjsWorkerSet){
    window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
    window._pdfjsWorkerSet = true;
  }
}
function loadPdfJs(cb){
  // pdf.js is already loaded by the <script> tag in the page; only fall back to loading it dynamically if that failed.
  if(window.pdfjsLib){ ensurePdfWorker(); cb(); return; }
  pdfjsQueue.push(cb);
  if(pdfjsLoading) return;
  pdfjsLoading = true;
  var sc = document.createElement('script');
  sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js';
  sc.onload = function(){
    ensurePdfWorker();
    pdfjsReady = true;
    pdfjsQueue.forEach(function(fn){ fn(); });
    pdfjsQueue = [];
  };
  sc.onerror = function(){
    pdfjsLoading = false;
    pdfjsQueue = [];
    alert('Could not load the PDF viewer (no internet connection?). Please try again.');
  };
  document.head.appendChild(sc);
}

/* ============ COMPANY PROFILE PDF VIEWER (single implementation shared by every entry point) ============
   Every page is rendered off-screen, then copied to the visible canvas in one step, and only one render runs at a
   time. Rapid next/prev clicks are coalesced to the latest page, so slides can no longer overlap, get cropped or
   render half-drawn. The canvas is sized exactly to the page aspect ratio, so it is never stretched or clipped. */
var cv = { pdf:null, page:1, total:1, busy:false, loadId:0 };

function cvOpen(title, source){
  var viewer = document.getElementById('comproViewer');
  document.getElementById('cvTitle').textContent = title;
  viewer.hidden = false;
  viewer.setAttribute('aria-hidden','false');
  document.body.style.overflow = 'hidden';
  if(cv.pdf){ try{ cv.pdf.destroy(); }catch(e){} cv.pdf = null; }
  var id = ++cv.loadId;
  cv.page = 1; cv.total = 1; cv.busy = false;
  window.pdfjsLib.getDocument(source).promise.then(function(pdf){
    if(id !== cv.loadId){ try{ pdf.destroy(); }catch(e){} return; }
    cv.pdf = pdf; cv.total = pdf.numPages; cv.page = 1;
    cvRender();
  }).catch(function(){
    if(id !== cv.loadId) return;
    alert('This PDF could not be opened. Please try a different file.');
    closeComproViewer();
  });
}

function cvRender(){
  var pdf = cv.pdf;
  if(!pdf) return;
  if(cv.busy) return;               // the running render re-checks cv.page when it finishes
  cv.busy = true;
  var pageNum = cv.page, id = cv.loadId;
  pdf.getPage(pageNum).then(function(page){
    var canvas = document.getElementById('cvCanvas');
    var stage = document.querySelector('#comproViewer .cv-stage');
    var narrow = window.innerWidth < 640;
    var availW = Math.max(stage.clientWidth - (narrow ? 16 : 150), 80);
    var availH = Math.max(stage.clientHeight - 16, 80);
    var natural = page.getViewport({ scale: 1 });           // honours the page's own rotation
    var fit = Math.min(availW / natural.width, availH / natural.height);
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    var viewport = page.getViewport({ scale: fit * dpr });
    var off = document.createElement('canvas');
    off.width = Math.max(1, Math.round(viewport.width));
    off.height = Math.max(1, Math.round(viewport.height));
    return page.render({ canvasContext: off.getContext('2d'), viewport: viewport }).promise.then(function(){
      if(id !== cv.loadId) return;                            // viewer was closed / another file opened
      canvas.width = off.width;
      canvas.height = off.height;
      canvas.style.width = (off.width / dpr) + 'px';
      canvas.style.height = (off.height / dpr) + 'px';
      canvas.getContext('2d').drawImage(off, 0, 0);
    });
  }).catch(function(){ /* keep the previous slide on screen if one page fails */ }).then(function(){
    cv.busy = false;
    if(id !== cv.loadId) return;
    document.getElementById('cvPageInfo').textContent = cv.page + ' / ' + cv.total;
    document.getElementById('cvPrev').disabled = cv.page <= 1;
    document.getElementById('cvNext').disabled = cv.page >= cv.total;
    if(cv.page !== pageNum) cvRender();                       // user moved on while rendering
  });
}

function cvGo(delta){
  if(!cv.pdf) return;
  var next = cv.page + delta;
  if(next < 1 || next > cv.total) return;
  cv.page = next;
  cvRender();
}

function presentCompro(key){
  var state = comproState[key];
  if(!state) return;
  loadPdfJs(function(){ cvOpen(state.name, { url: state.url }); });
}

function comproOpenViewer(rec){
  loadPdfJs(function(){
    rec.data.arrayBuffer().then(function(buf){
      cvOpen(rec.name, { data: buf });
    }).catch(function(){ alert('Gagal membuka file PDF ini.'); });
  });
}

function closeComproViewer(){
  var viewer = document.getElementById('comproViewer');
  viewer.hidden = true;
  viewer.setAttribute('aria-hidden','true');
  document.body.style.overflow = '';
  cv.loadId++;
  if(cv.pdf){ try{ cv.pdf.destroy(); }catch(e){} }
  cv.pdf = null; cv.page = 1; cv.total = 1; cv.busy = false;
}

(function bindComproViewerControls(){
  document.getElementById('cvClose').addEventListener('click', closeComproViewer);
  document.getElementById('cvPrev').addEventListener('click', function(){ cvGo(-1); });
  document.getElementById('cvNext').addEventListener('click', function(){ cvGo(1); });
  window.addEventListener('keydown', function(e){
    var viewer = document.getElementById('comproViewer');
    if(!viewer || viewer.hidden) return;
    if(e.key === 'Escape') closeComproViewer();
    else if(e.key === 'ArrowLeft') cvGo(-1);
    else if(e.key === 'ArrowRight') cvGo(1);
  });
  var resizeTimer;
  window.addEventListener('resize', function(){
    var viewer = document.getElementById('comproViewer');
    if(!viewer || viewer.hidden) return;
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(cvRender, 150);
  });
})();

/* ============ FACTORY HERO (products) loader; scene ada di script module di akhir halaman ============ */
function startFactory(host){
  if(!host) return function(){};
  var stopFn = function(){}, dead = false;
  function go(){ if(!dead && window.__factory) stopFn = window.__factory(host); }
  if(window.__factory) go(); else window.addEventListener('factory-ready', go, {once:true});
  var t = setTimeout(function(){ if(!window.__factory){ var n = host.querySelector('.fx-note'); if(n) n.textContent = 'Mesin 3D belum bisa dimuat. Periksa koneksi internet lalu muat ulang halaman.'; } }, 7000);
  return function(){ dead = true; clearTimeout(t); window.removeEventListener('factory-ready', go); stopFn(); };
}

/* ============ DIGITAL TRANSFORMATION GLOBE (shared) ============
   Vanilla-JS dot-matrix rotating globe (cobe-style), draggable, with
   marker pins over the cities Narasio Data actively works in. */
function startGlobeCanvas(canvas, getColor, opts){
  if(!canvas) return function(){};
  var ctx = canvas.getContext('2d');
  var raf;
  var w,h,dpr,R;
  var points = [], markers = [];
  var rotY = 0, tiltX = 0.34;
  var dragging = false, lastX = 0, velY = 0.0011;
  var label = document.createElement('div');
  label.className = 'globe-city-label';
  if(canvas.parentElement){ canvas.parentElement.style.position = 'relative'; canvas.parentElement.appendChild(label); }

  var markerDefs = (opts && opts.markers) || [
    {lat:-6.20,lng:106.85,name:'Jakarta'},{lat:-7.25,lng:112.75,name:'Surabaya'}
  ];
  var focusTo = null, holdUntil = 0, pinName = null;
  function fibonacciSphere(n){
    var pts = [];
    var offset = 2/n, increment = Math.PI * (3 - Math.sqrt(5));
    for(var i=0;i<n;i++){
      var y = ((i*offset) - 1) + (offset/2);
      var r = Math.sqrt(Math.max(0, 1 - y*y));
      var phi = i * increment;
      pts.push({ x: Math.cos(phi)*r, y: y, z: Math.sin(phi)*r });
    }
    return pts;
  }
  function latLngToXYZ(lat,lng){
    var phi = (90-lat) * Math.PI/180;
    var theta = (lng+180) * Math.PI/180;
    return { x: -Math.sin(phi)*Math.cos(theta), y: Math.cos(phi), z: Math.sin(phi)*Math.sin(theta) };
  }
  function rotate(p, ry, rx){
    var cosY=Math.cos(ry), sinY=Math.sin(ry);
    var x1 = p.x*cosY + p.z*sinY;
    var z1 = -p.x*sinY + p.z*cosY;

function startNodeCanvas(canvas, getColor, density){
  if(!canvas) return function(){};

    var rect = canvas.getBoundingClientRect();

    ctx.setTransform(dpr,0,0,dpr,0,0);
    var count = Math.max(24, Math.floor((w*h)/9000 * density));
    nodes = [];
    for(var i=0;i<count;i++){
      var ang = Math.random()*Math.PI*2;
      var rad = Math.pow(Math.random(),0.5) * (Math.min(w,h)*0.46);
      nodes.push({
        baseAng: ang, baseRad: rad,
        speed: 0.06 + Math.random()*0.10,
        z: Math.random()
      });
    }
  }
  var t = 0;
  function draw(){
    ctx.clearRect(0,0,w,h);
    var cx = w/2, cy = h/2;
    var col = getColor();
    t += reducedMotion ? 0 : 0.0032;
    var pts = nodes.map(function(n){
      var ang = n.baseAng + t*n.speed;
      var r = n.baseRad;
      var x = cx + Math.cos(ang)*r;
      var y = cy + Math.sin(ang)*r*0.92 + Math.sin(t*0.6 + n.baseRad)*4;
      return {x:x,y:y,z:n.z};

    ctx.lineWidth = 1;
    for(var i=0;i<pts.length;i++){
      for(var j=i+1;j<pts.length;j++){
        var dx = pts[i].x-pts[j].x, dy = pts[i].y-pts[j].y;
        var d = Math.sqrt(dx*dx+dy*dy);
        if(d < Math.min(w,h)*0.16){
          ctx.strokeStyle = hexToRgba(col, (1 - d/(Math.min(w,h)*0.16)) * 0.35);
          ctx.beginPath(); ctx.moveTo(pts[i].x,pts[i].y); ctx.lineTo(pts[j].x,pts[j].y); ctx.stroke();
        }
      }
    }
    pts.forEach(function(p){
      ctx.beginPath();
      ctx.fillStyle = hexToRgba(col, 0.35 + p.z*0.55);
      var rr = 1 + p.z*2.2;
      ctx.arc(p.x,p.y,rr,0,Math.PI*2);
      ctx.fill();

    ctx.beginPath();
    ctx.strokeStyle = hexToRgba(col, 0.5);
    ctx.lineWidth = 1;
    ctx.arc(cx,cy, Math.min(w,h)*0.46, 0, Math.PI*2);
    ctx.stroke();

    raf = requestAnimationFrame(draw);
  }
  function hexToRgba(hex, a){
    var v = hex.replace('#','');
    var r = parseInt(v.substring(0,2),16), g = parseInt(v.substring(2,4),16), b = parseInt(v.substring(4,6),16);
    return 'rgba('+r+','+g+','+b+','+a+')';
  }

  draw();
  var ro = new ResizeObserver(resize);
  ro.observe(canvas);
  return function stop(){ cancelAnimationFrame(raf); ro.disconnect(); };
}

/* ============ AMBIENT BACKGROUND NETWORK ============ */
var bgAccentsEl = document.getElementById('bgAccents');
function syncBgHeight(){
  var canvasEl = document.getElementById('netcanvas');
  /* Shrink both decorative layers first so their own old (possibly taller)
     height never inflates the scrollHeight measurement below -- otherwise
     navigating from a long page to a short one leaves a tall blank gap. */
  if(bgAccentsEl) bgAccentsEl.style.height = '1px';
  if(canvasEl) canvasEl.style.height = '1px';
  var h = Math.max(document.documentElement.scrollHeight, window.innerHeight);
  if(bgAccentsEl) bgAccentsEl.style.height = h + 'px';
  return h;
}

function startBgNetwork(){
  var canvas = document.getElementById('netcanvas');
  var ctx = canvas.getContext('2d');
  var w,h,dpr,particles=[];
  var mouse = {x:-9999,y:-9999};
  var colors = ['#3358e0','#8146e0','#e0489f','#c99a00'];

  function resize(){
    dpr = Math.min(window.devicePixelRatio||1, 1.75);
    w = window.innerWidth;
    h = syncBgHeight();
    canvas.style.height = h + 'px';
    canvas.width = Math.round(w*dpr); canvas.height = Math.round(h*dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0);
    var count = Math.max(50, Math.min(130, Math.floor((w*h)/16000)));
    particles = [];
    for(var i=0;i<count;i++){
      particles.push({
        x: Math.random()*w, y: Math.random()*h,
        vx: (Math.random()-0.5)*0.18, vy: (Math.random()-0.5)*0.18,
        c: colors[i % colors.length]

    }
  }

  window._bgResize = resize;
  window.addEventListener('mousemove', function(e){ mouse.x = e.clientX + window.scrollX; mouse.y = e.clientY + window.scrollY; });

  function hexToRgba(hex,a){
    var v=hex.replace('#','');
    var r=parseInt(v.substring(0,2),16),g=parseInt(v.substring(2,4),16),b=parseInt(v.substring(4,6),16);
    return 'rgba('+r+','+g+','+b+','+a+')';
  }

    ctx.clearRect(0,0,w,h);
    particles.forEach(function(p){
      if(!reducedMotion){
        p.x += p.vx; p.y += p.vy;
        var dx = mouse.x - p.x, dy = mouse.y - p.y;
        var dist = Math.sqrt(dx*dx+dy*dy);
        if(dist < 140){ p.x -= dx*0.0018; p.y -= dy*0.0018; }

        if(p.y < -20) p.y = h+20; if(p.y > h+20) p.y = -20;
      }

      for(var j=i+1;j<particles.length;j++){
        var dx=particles[i].x-particles[j].x, dy=particles[i].y-particles[j].y;

  }

}

/* ============ COMPANY PROFILE UPLOAD + SLIDESHOW (products page) ============
   The file is stored locally in the presenter's own browser (IndexedDB) --
   never uploaded anywhere -- so it can be swapped per client meeting and
   removed afterwards. Shared across the three product panels since it's
   the same file regardless of which "EXPLORE PRODUCT" the presenter is near. */
var COMPRO_DB = 'narasio_compro', COMPRO_STORE = 'files', COMPRO_KEY = 'active';

function comproOpenDB(){
  return new Promise(function(resolve, reject){
    var req = indexedDB.open(COMPRO_DB, 1);
    req.onupgradeneeded = function(){ req.result.createObjectStore(COMPRO_STORE); };
    req.onsuccess = function(){ resolve(req.result); };
    req.onerror = function(){ reject(req.error); };
  });
}
function comproSave(file){
  return comproOpenDB().then(function(db){
    return new Promise(function(resolve, reject){
      var tx = db.transaction(COMPRO_STORE, 'readwrite');
      tx.objectStore(COMPRO_STORE).put({ name: file.name, size: file.size, data: file, savedAt: Date.now() }, COMPRO_KEY);
      tx.oncomplete = function(){ resolve(); };
      tx.onerror = function(){ reject(tx.error); };
    });
  });
}
function comproLoad(){
  return comproOpenDB().then(function(db){
    return new Promise(function(resolve, reject){
      var tx = db.transaction(COMPRO_STORE, 'readonly');
      var req = tx.objectStore(COMPRO_STORE).get(COMPRO_KEY);
      req.onsuccess = function(){ resolve(req.result || null); };
      req.onerror = function(){ reject(req.error); };
    });
  });
}
function comproDelete(){
  return comproOpenDB().then(function(db){
    return new Promise(function(resolve, reject){
      var tx = db.transaction(COMPRO_STORE, 'readwrite');
      tx.objectStore(COMPRO_STORE).delete(COMPRO_KEY);
      tx.oncomplete = function(){ resolve(); };
      tx.onerror = function(){ reject(tx.error); };
    });
  });
}

var comproState = { record: null };

function comproRefreshWidgets(){
  var rec = comproState.record;
  document.querySelectorAll('[data-compro]').forEach(function(w){
    var emptyEl = w.querySelector('.compro-empty');
    var loadedEl = w.querySelector('.compro-loaded');
    if(rec){
      emptyEl.hidden = true; loadedEl.hidden = false;
      loadedEl.querySelector('.compro-name').textContent = rec.name;
      loadedEl.querySelector('.compro-name').title = rec.name;
    } else {
      emptyEl.hidden = false; loadedEl.hidden = true;
    }
  });
}

function comproWireWidget(widget){
  if(widget._comproWired) return;
  widget._comproWired = true;
  var input = widget.querySelector('.compro-input');
  widget.querySelector('.compro-upload-btn').addEventListener('click', function(){ input.click(); });
  input.addEventListener('change', function(){
    var file = input.files && input.files[0];
    input.value = '';
    if(!file) return;
    if(file.type !== 'application/pdf'){ alert('Mohon unggah file PDF.'); return; }
    if(file.size > 80*1024*1024){ alert('File terlalu besar (maks 80MB).'); return; }
    var btn = widget.querySelector('.compro-upload-btn');
    var original = btn.textContent;
    btn.textContent = 'Uploading…';
    comproSave(file).then(function(){
      return comproLoad();
    }).then(function(rec){
      comproState.record = rec;
      comproRefreshWidgets();
    }).catch(function(){
      btn.textContent = original;
      alert('Gagal menyimpan file di browser ini.');
    });
  });
  widget.querySelector('.compro-open-btn').addEventListener('click', function(){
    if(comproState.record) comproOpenViewer(comproState.record);
  });
  widget.querySelector('.compro-remove-btn').addEventListener('click', function(){
    if(!confirm('Hapus company profile yang tersimpan di browser ini?')) return;
    comproDelete().then(function(){
      comproState.record = null;
      comproRefreshWidgets();
    });
  });
}

function initCompro(){
  ensurePdfWorker();
  document.querySelectorAll('[data-compro]').forEach(comproWireWidget);
  comproLoad().then(function(rec){
    comproState.record = rec;
    comproRefreshWidgets();
  }).catch(function(){ /* IndexedDB unavailable -- widgets stay in empty state */ });
}

/* ============ PER-PAGE INIT ============ */
function initPageBehaviors(name){
  if(window._pageCleanups){ window._pageCleanups.forEach(function(fn){ try{fn();}catch(e){} }); }
  window._pageCleanups = [];

  initReveals();
  initSplitText();
  initCounters();
  initFaq();
  initCases();

  if(name === 'home'){ initHero(); initWordCloud(); initEcoFlow(); initBmc(); }
  if(name === 'nori'){ initNoriExtras(); }
  if(name === 'products'){ initProducts(); initCompro(); }
  if(name === 'portfolio'){ initSectorTabs(); initFootprint(); }
}

/* ============ BOOT ============ */
startBgNetwork();
navigate();

})();

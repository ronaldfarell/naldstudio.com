<script>
const D=["Agentic Architecture & Orchestration","Tool Design & MCP Integration","Claude Code Configuration & Workflows","Prompt Engineering & Structured Output","Context Management & Reliability"];
const REC=[["Agentic loop control: stop_reason tool_use vs end_turn","Hooks and programmatic gates vs prompt-only enforcement","Coordinator–subagent design: explicit context passing, Task tool, parallel calls","Escalation criteria, structured handoffs, session resume vs fork"],
["How tool descriptions drive selection; conflicts with system prompt keywords","Structured errors: isError, errorCategory, isRetryable","tool_choice auto / any / forced; scoping 4–5 tools per agent","MCP config: .mcp.json vs user scope, env expansion, resources"],
["CLAUDE.md hierarchy and .claude/rules path globs","Commands, skills, context: fork; plan mode vs direct execution","CI/CD: -p flag, --output-format json, --json-schema","Independent review instance and avoiding duplicate comments"],
["Explicit criteria and few-shot examples over vague instructions","Tool-use JSON schemas: nullable fields, enum + other, syntax vs semantic errors","Validation-retry loops and when retry cannot help","Message Batches API (50% savings, custom_id) and multi-pass review"],
["Persistent case-facts block and trimming tool output","Lost-in-the-middle mitigation, scratchpad files, /compact","Provenance: claim–source mapping, conflicting statistics, dates","Stratified accuracy checks, calibrated confidence, disambiguation"]];
// [domain, prompt, [options], correct]
const Q=[
[0,"A support agent runs an agentic loop on the Claude API. What decides whether the loop continues?",["Response text contains “task complete”","Continue on stop_reason tool_use; stop on end_turn","A fixed count of 5 iterations","Stop when any text block appears"],1],
[0,"After your code runs a tool Claude requested, what is the correct next step?",["Start a new chat and put the result in the system prompt","Discard it; the model already knows","Append a tool_result block to the history and call the model again","Store it in a database and just say the tool succeeded"],2],
[0,"The agent skips identity verification before process_refund in ~12% of cases despite a prompt saying “always verify”. Best fix?",["Rewrite the rule in capitals","Add 10 few-shot examples","Have a second model audit refunds daily","Programmatic gate blocking process_refund until get_customer verification succeeds"],3],
[0,"Policy: refunds over $500 must always go to a human. Most reliable approach?",["Hook that intercepts the call, blocks it, and routes to escalation","Emphatic system-prompt rule","3 few-shot examples","Periodic audit by another model"],0],
[0,"A customer writes “I want a human agent now.” The agent has every investigation tool. What should it do?",["Try one resolution attempt first","Escalate immediately without investigating","Escalate only if sentiment is very negative","Ask the customer why first"],1],
[0,"The team wants escalation when the agent is “unsure”. Best approach?",["Self-rated confidence 1–10, escalate below 7","Escalate all negative-sentiment cases","Explicit criteria (policy gap, human requested, no progress) plus few-shot examples","Escalate after 3+ tool calls"],2],
[0,"A synthesis subagent omits the web-search subagent’s findings. Most likely cause?",["Subagents don’t inherit coordinator history; findings must be passed explicitly in the prompt","Subagents share memory and overwrite each other","The synthesis model is too small","Coordinator should be a single agent"],0],
[0,"With the Agent SDK, what must a coordinator have to spawn subagents?",["Subagent prompts copied into its system prompt","Streaming mode on","Separate processes outside the SDK","“Task” included in allowedTools"],3],
[0,"How do you run web-search and document-analysis subagents in parallel?",["Call Task once per turn","Emit multiple Task calls in one coordinator response","Run the coordinator twice","Merge into one subagent"],1],
[0,"A report on “AI in creative industries” covers only visual arts, though each subagent did its task well. Root cause?",["Search subagent inaccurate","Synthesis deleted topics","Coordinator’s decomposition was too narrow","Token limit too low"],2],
[0,"An investigation is resumed a day later, but many analyzed files changed, so old tool results are stale. Most reliable approach?",["New session with a structured summary, then re-verify changed parts","Resume and trust earlier results","Resume without mentioning the changes","fork_session and ignore the changes"],0],
[0,"You need two refactoring approaches explored from the same analysis baseline without cross-contamination. Which feature?",["Two sessions from scratch","Copy chat history manually","Ask the model to “forget”","fork_session"],3],
[0,"A web-search subagent times out. Best report to the coordinator?",["Empty result as “success”","Terminate the whole workflow","Retry forever silently","Structured error: failure type, attempted query, partial results, alternatives"],3],
[0,"MCP tools return dates as Unix timestamps, ISO 8601, and free text; the agent misreads them. Best solution?",["System-prompt paragraph on formats","PostToolUse hook that normalizes formats","Ask users to use ISO","Use a larger model"],1],
[0,"Which requirement suits prompt guidance rather than a hook or gate?",["Empathetic, friendly tone in complaint replies","Block refunds above a threshold","Verify identity before account access","Prevent external data transfer"],0],

{e:"💻",n:"Technology Fundamentals",d:"Fondasi untuk membaca soal skenario. Hampir semua soal ujian berbentuk sistem nyata (aplikasi, server, API, database) yang dihubungkan ke Claude. Kamu tidak perlu jadi programmer, tapi harus paham aliran data: client → server → database → kembali sebagai response.",p:["Alur dasar: client mengirim request ke endpoint API; server memproses (kadang membaca/menulis database); response dikembalikan, biasanya berupa JSON.","JSON adalah ‘bahasa’ antar sistem dan antara model dengan tool. Soal sering membedakan JSON yang valid secara sintaks vs benar secara isi.","Parameter ada di definisi fungsi, argument ada saat pemanggilan. Di tool calling, skema tool = daftar parameter, dan model mengisi argument-nya.","API key adalah kredensial: jangan ditaruh di prompt, kode publik, atau repo. Simpan di environment variable atau secret manager.","Jebakan umum: menganggap model bisa langsung ‘mengakses’ database. Selalu ada aplikasi perantara yang menjalankan operasi."],k:[["Application","Perangkat lunak yang menjalankan fungsi tertentu."],["Server","Sistem yang menerima dan memproses permintaan dari client."],["Database","Sistem untuk menyimpan, mengelola, dan mengambil data."],["Code","Instruksi yang ditulis menggunakan bahasa pemrograman."],["Function","Blok kode yang menjalankan tugas tertentu."],["Parameter","Variabel yang didefinisikan dalam deklarasi fungsi."],["Argument","Nilai yang diberikan kepada parameter ketika fungsi dipanggil."],["Return Value","Nilai yang dikembalikan oleh fungsi setelah dijalankan."],["JSON (JavaScript Object Notation)","Format pertukaran data terstruktur menggunakan pasangan key-value, array, dan tipe data seperti string, number, boolean, serta null."],["Key","Nama properti dalam objek JSON."],["Value","Nilai yang disimpan pada suatu key."],["Boolean","Tipe data dengan dua nilai, yaitu “true” dan “false”."],["API (Application Programming Interface)","Antarmuka yang memungkinkan sistem perangkat lunak saling berkomunikasi."],["Endpoint","Alamat spesifik pada API untuk mengakses fungsi atau sumber daya."],["Request","Permintaan yang dikirim ke suatu layanan."],["Response","Respons yang dikirim oleh layanan setelah memproses request."],["API Key","Kredensial yang digunakan untuk mengidentifikasi atau mengautentikasi akses ke API."]]},
{e:"🌐",n:"HTTP and API Fundamentals",d:"Method dan status code adalah ‘bahasa diagnosa’. Soal reliability sering memberi sebuah kode dan meminta tindakan yang tepat, jadi kamu perlu tahu kapan retry masuk akal dan kapan sia-sia.",p:["2xx = sukses; 4xx = kesalahan di sisi pemanggil (perbaiki request/kredensial/izin; retry biasanya sia-sia); 5xx = kesalahan sisi server (sering layak retry terbatas).","401 = ‘siapa kamu?’ → periksa kredensial hilang, salah, atau kedaluwarsa. 403 = ‘aku tahu kamu, tapi tidak boleh’ → periksa izin, bukan retry.","429 = kena rate limit → tunggu lalu retry dengan exponential backoff + jitter; hormati header Retry-After bila ada.","400 = request cacat → perbaiki isi request. 404 = sumber daya tidak ada → periksa ID/URL.","GET aman diulang; POST belum tentu aman diulang → operasi seperti pembayaran butuh idempotency key.","Authentication ≠ Authorization: identitas dulu, baru izin."],k:[["HTTP Method","Metode yang menentukan jenis operasi dalam request HTTP."],["GET","Mengambil data."],["POST","Mengirim data atau meminta pemrosesan suatu operasi."],["PUT","Mengganti atau memperbarui representasi sumber daya."],["PATCH","Memperbarui sebagian sumber daya."],["DELETE","Meminta penghapusan sumber daya."],["HTTP Status Code","Kode yang menunjukkan hasil pemrosesan request."],["200 OK","Request berhasil."],["400 Bad Request","Request tidak valid atau tidak dapat diproses karena kesalahan pada permintaan."],["401 Unauthorized","Autentikasi tidak valid atau belum tersedia."],["403 Forbidden","Akses ditolak karena tidak memiliki izin yang diperlukan."],["404 Not Found","Sumber daya tidak ditemukan."],["429 Too Many Requests","Request terkena pembatasan jumlah permintaan."],["500 Internal Server Error","Terjadi kesalahan internal pada server."],["API Authentication","Proses memverifikasi identitas atau kredensial pemanggil API."],["API Authorization","Proses menentukan apakah pemanggil memiliki izin untuk melakukan operasi tertentu."]]},
{e:"💬",n:"Claude API and Messages API",d:"Messages API bersifat stateless: Claude tidak mengingat percakapan sebelumnya kecuali aplikasi mengirim ulang riwayat di setiap request. Semua yang ‘diketahui’ model saat menjawab adalah isi konteks pada saat itu.",p:["Struktur request: system prompt (peran/aturan) + daftar messages yang bergantian user/assistant. Aplikasi yang menyimpan dan mengirim ulang riwayat.","Token dihitung untuk input dan output; context window membatasi totalnya. Konteks makin panjang → makin mahal, lambat, dan rawan ‘lost in the middle’.","stop_reason menunjukkan kenapa model berhenti: end_turn (selesai), tool_use (minta tool), max_tokens (terpotong). Ini sinyal kontrol alur resmi, bukan tebakan dari teks.","Instruksi di system prompt bersifat probabilistik: biasanya dipatuhi, tapi bukan jaminan 100%. Aturan wajib harus dijaga oleh kode.","Suhu (temperature) rendah membantu konsistensi, tetapi bukan pengganti validasi."],k:[["Claude API","Antarmuka untuk mengirim permintaan ke model Claude melalui aplikasi."],["Messages API","API untuk mengirim pesan kepada Claude dan menerima respons model."],["User Message","Pesan atau input yang diberikan oleh pengguna atau aplikasi."],["Assistant Message","Pesan atau respons yang dihasilkan oleh Claude."],["System Prompt","Instruksi yang menetapkan perilaku, peran, atau batasan model."],["Conversation Context","Informasi percakapan yang tersedia dan relevan bagi model saat menghasilkan respons."],["Token","Unit teks yang digunakan model untuk memproses input dan menghasilkan output."],["Context Window","Batas jumlah token yang dapat diproses model dalam satu konteks."]]},
{e:"🔧",n:"Tool Calling",d:"Inti dari semua sistem agentic. Model hanya MEMINTA tool lewat blok tool_use; aplikasi yang memvalidasi, mengeksekusi, lalu mengembalikan tool_result. Kontrol dan keamanan ada di sisi aplikasi.",p:["Deskripsi tool adalah faktor utama pemilihan tool. Dua tool dengan deskripsi mirip → sering salah pilih. Perbaiki dengan: fungsi, input yang diterima, contoh kueri, dan batas ‘kapan dipakai / kapan tidak’.","Terlalu banyak tool (belasan) menurunkan akurasi pemilihan; batasi sekitar 4–5 tool relevan per agent/peran.","tool_choice: auto (model bebas), any (wajib memanggil salah satu tool), atau tool tertentu (dipaksa). Pakai pemaksaan untuk menjamin langkah pertama tertentu.","Error tool yang baik terstruktur: isError, kategori (transient/validation/permission/business), isRetryable, pesan terbaca. Bedakan GAGAL AKSES dari HASIL KOSONG yang valid.","Hasil tool yang panjang dipangkas ke field relevan sebelum masuk konteks.","Argument dari model tidak otomatis dipercaya: validasi terhadap skema dan tolak yang melanggar.","Hasil tool ditambahkan ke riwayat sebagai tool_result agar model bisa bernalar di putaran berikutnya."],k:[["Tool","Fungsi yang dapat digunakan model melalui aplikasi untuk menjalankan operasi atau memperoleh informasi."],["Tool Calling","Proses ketika model meminta aplikasi menjalankan suatu tool."],["“tool_use”","Jenis blok konten yang menunjukkan permintaan penggunaan tool oleh model."],["“tool_result”","Hasil eksekusi tool yang dikirim kembali ke model melalui aplikasi."],["Tool Execution","Proses menjalankan fungsi tool oleh aplikasi atau sistem yang bertanggung jawab."],["Tool Schema","Definisi struktur input, parameter, tipe data, dan persyaratan suatu tool."],["Input Validation","Pemeriksaan input untuk memastikan data memenuhi format dan ketentuan yang ditetapkan."],["Tool Description","Penjelasan fungsi dan kondisi penggunaan tool yang membantu model memilih tool secara tepat."],["Alur umum tool calling","1) Model menentukan tool diperlukan. 2) Model menghasilkan permintaan “tool_use”. 3) Aplikasi memvalidasi dan menjalankan tool. 4) Aplikasi mengirim hasil melalui “tool_result”. 5) Model memproses hasil dan melanjutkan respons atau proses berikutnya."],["Catatan","Model tidak otomatis menjalankan fungsi eksternal hanya dengan menghasilkan permintaan tool; eksekusi ditangani oleh aplikasi atau sistem yang terintegrasi."]]},
{e:"🔌",n:"MCP (Model Context Protocol)",d:"MCP ibarat ‘USB-C’ untuk AI: satu protokol standar agar host bisa memakai tools, resources, dan prompts dari server mana pun tanpa integrasi khusus untuk setiap layanan.",p:["Tiga primitif: Tools (aksi), Resources (data untuk dibaca; bagus untuk katalog/skema agar agent tidak perlu eksplorasi berulang), Prompts (template).","Lokasi konfigurasi: .mcp.json di root proyek = dibagikan ke tim lewat version control; konfigurasi level user (~/.claude.json) = pribadi/eksperimen.","Rahasia tidak ditulis di .mcp.json; gunakan ekspansi variabel lingkungan seperti ${GITHUB_TOKEN}.","Alur: tools/list untuk menemukan tool, tools/call untuk mengeksekusi; semuanya lewat JSON-RPC.","Tool destruktif di MCP server tetap butuh pemeriksaan izin dan pengaman; skema saja tidak cukup.","Tool bawaan Claude Code: Grep = cari ISI file, Glob = cari NAMA/pola jalur file, Read/Edit/Write untuk membaca dan mengubah."],k:[["MCP","Protokol untuk menghubungkan aplikasi AI dengan tools, resources, dan kemampuan eksternal melalui pola komunikasi yang terstandarisasi."],["MCP Host","Aplikasi AI yang mengelola interaksi dengan MCP."],["MCP Client","Komponen dalam host yang berkomunikasi dengan MCP server."],["MCP Server","Komponen yang menyediakan tools, resources, atau prompts melalui MCP."],["Tools","Kemampuan yang dapat dipanggil untuk melakukan operasi."],["Resources","Data atau konten yang dapat diakses oleh aplikasi melalui MCP."],["Prompts","Template prompt yang disediakan server untuk penggunaan tertentu."],["JSON-RPC","Protokol pesan untuk melakukan pemanggilan metode dan menerima hasil atau error."],["“tools/list”","Metode untuk menemukan tools yang tersedia pada MCP server."],["“tools/call”","Metode untuk meminta eksekusi tool tertentu."],["MCP Integration","Konfigurasi koneksi antara aplikasi AI dan MCP server beserta izin yang diperlukan."]]},
{e:"⏳",n:"Programming and Asynchronous Operations",d:"Panggilan tool ke jaringan atau API itu lambat dan bisa gagal. Operasi asynchronous memungkinkan banyak pekerjaan berjalan bersamaan tanpa saling memblokir, dan itu dasar dari eksekusi paralel dalam agent.",p:["async/await membuat kode asynchronous terbaca seperti berurutan; Promise adalah ‘janji’ hasil (berhasil/gagal), dan error ditangani dengan try/catch.","Tugas independen → jalankan paralel; tugas yang bergantung hasil sebelumnya → berurutan.","Dalam sistem agentic, beberapa pemanggilan Task/tool dalam SATU respons dieksekusi paralel.","Selalu beri timeout dan batas retry pada operasi asynchronous eksternal."],k:[["Node.js","Runtime yang memungkinkan JavaScript dijalankan di luar browser."],["Synchronous Operation","Operasi yang dijalankan secara berurutan dan menunggu penyelesaian langkah terkait sebelum melanjutkan."],["Asynchronous Operation","Operasi yang memungkinkan proses lain berlanjut ketika suatu pekerjaan masih menunggu penyelesaian."],["“async”","Kata kunci untuk mendefinisikan fungsi asynchronous dalam JavaScript."],["“await”","Kata kunci untuk menunggu penyelesaian suatu operasi asynchronous di dalam konteks yang mendukungnya."],["Promise","Objek yang merepresentasikan hasil operasi asynchronous yang dapat berhasil atau gagal."]]},
{e:"🤖",n:"Agentic Architecture and Orchestration",d:"Agent = model + tools + loop. Bobot terbesar ujian ada di sini: kapan memakai agent tunggal vs multi-agent, bagaimana subagen berbagi konteks, dan bagaimana menjaga kontrol lewat hook, gerbang, dan eskalasi.",p:["Agentic loop: kirim → baca stop_reason → jika tool_use, eksekusi lalu kirim tool_result → ulangi; berhenti saat end_turn. Batas iterasi hanya pengaman tambahan.","Hub-and-spoke: koordinator mendekomposisi tugas, mendelegasikan ke subagen, lalu menggabungkan hasil. Subagen punya konteks TERISOLASI: semua info yang dibutuhkan harus dikirim eksplisit di prompt-nya.","Cakupan laporan hilang padahal tiap subagen berhasil → akar masalah ada di dekomposisi koordinator (terlalu sempit).","Aturan wajib (verifikasi sebelum refund, batas nominal) → enforcement terprogram (hook / gerbang prasyarat). Gaya/nada → cukup prompt.","Eskalasi ke manusia: permintaan eksplisit pelanggan → segera; celah kebijakan; tidak ada progres. Jangan andalkan sentimen atau skor kepercayaan diri model.","Handoff ke manusia: ringkasan terstruktur (ID, akar masalah, nominal, tindakan, rekomendasi).","Sesi: resume untuk melanjutkan; fork_session untuk cabang alternatif; bila hasil tool lama basi, mulai sesi baru dengan ringkasan terstruktur.","Info penting hilang → tanya pengguna, jangan menebak. Konflik antar-agent → bandingkan bukti dan verifikasi.","Subagen gagal → laporkan konteks error terstruktur (jenis, kueri, hasil parsial, alternatif), bukan hasil kosong ‘sukses’."],k:[["AI Agent","Sistem yang menggunakan model untuk menentukan langkah, memanfaatkan tools, dan menjalankan proses menuju tujuan."],["Agentic Loop","Siklus ketika agent menilai keadaan, menentukan tindakan, menggunakan tool bila diperlukan, memproses hasil, lalu menentukan langkah selanjutnya."],["Orchestration","Pengaturan urutan kerja, pembagian tugas, koordinasi agent atau tools, dan penggabungan hasil."],["Coordinator Agent","Agent yang mengatur tugas, mendelegasikan pekerjaan, dan menggabungkan hasil dari agent lain."],["Specialist Agent","Agent yang menangani tugas atau bidang tertentu."],["Multi-Agent System","Sistem yang menggunakan beberapa agent untuk membagi dan menyelesaikan pekerjaan."],["Parallel Execution","Pelaksanaan beberapa tugas secara bersamaan ketika tugas-tugas tersebut tidak saling bergantung."],["Sequential Execution","Pelaksanaan tugas secara berurutan ketika suatu langkah bergantung pada hasil langkah sebelumnya."],["Delegation","Penyerahan tugas kepada agent atau komponen lain."],["Stopping Condition","Kondisi yang menentukan kapan proses agent harus berhenti."],["Iteration Limit","Batas jumlah pengulangan dalam suatu proses."],["Completion Criteria","Kriteria yang menentukan apakah tujuan tugas telah tercapai."],["Human-in-the-Loop","Keterlibatan manusia untuk memberikan keputusan, persetujuan, atau pemeriksaan pada tahapan tertentu."]]},
{e:"✍️",n:"Prompt Engineering and Structured Output",d:"Prompt yang baik = instruksi jelas + konteks + kriteria sukses + (bila perlu) contoh. Untuk output terstruktur, ingat tiga lapis validasi: sintaks, skema, dan semantik/aturan bisnis; schema saja tidak menjamin isi benar.",p:["Instruksi samar seperti ‘be conservative’ tidak efektif; ganti dengan kriteria eksplisit per kategori plus contoh few-shot untuk kasus ambigu.","Tool use dengan JSON schema menjamin SINTAKS valid, tetapi tidak menjamin isi benar (total negatif, jumlah tidak cocok).","Field yang mungkin tidak ada di dokumen → jadikan opsional/nullable agar model tidak mengarang. Enum → tambah ‘other’ + detail (dan ‘unclear’).","Validation-retry: kirim ulang dokumen asli + hasil gagal + pesan error spesifik. Retry sia-sia bila informasinya memang tidak ada di input.","Ekstrak stated_total dan calculated_total untuk mendeteksi inkonsistensi.","Review besar (banyak file) → multi-pass: analisis per-file lalu pass integrasi lintas-file. Review sendiri dalam sesi yang sama cenderung bias → gunakan instance independen.","Message Batches API: hemat ±50%, hingga 24 jam, tanpa jaminan latensi, cocok untuk pekerjaan tak mendesak; gunakan custom_id untuk mencocokkan hasil. Pemeriksaan yang memblokir developer → API real-time.","Evaluation dataset + regression testing: ukur dengan hasil terukur, bukan sekadar ‘terlihat lancar’."],k:[["Prompt Engineering","Proses menyusun instruksi dan konteks agar model menghasilkan keluaran sesuai kebutuhan."],["Instruction","Arahan tentang tugas yang harus dilakukan model."],["Constraint","Batasan yang harus dipatuhi model."],["Few-Shot Prompting","Pemberian beberapa contoh input-output untuk menunjukkan pola respons yang diharapkan."],["Zero-Shot Prompting","Pemberian instruksi tanpa contoh khusus."],["Structured Output","Keluaran model yang mengikuti struktur dan format tertentu."],["JSON Schema","Definisi struktur, properti, tipe data, dan aturan validasi untuk data JSON."],["Syntax Validation","Pemeriksaan apakah data mengikuti aturan sintaks suatu format."],["Schema Validation","Pemeriksaan apakah struktur data sesuai dengan skema yang ditentukan."],["Semantic Validation","Pemeriksaan apakah makna atau isi data sesuai dengan persyaratan."],["Business-Rule Validation","Pemeriksaan apakah data memenuhi aturan operasional atau bisnis aplikasi."],["Evaluation Dataset","Kumpulan contoh yang digunakan untuk mengukur kualitas dan konsistensi hasil model."],["Regression Testing","Pengujian untuk memastikan perubahan tidak merusak fungsi yang sebelumnya berjalan dengan benar."]]},
{e:"⌨️",n:"Claude Code Configuration and Workflows",d:"Claude Code adalah agent coding. Ujian menguji cara mengonfigurasinya agar konsisten, aman, dan bisa dipakai tim maupun pipeline CI.",p:["Hierarki CLAUDE.md: level user (~/.claude/CLAUDE.md, pribadi), proyek (dibagikan lewat repo), dan direktori. Standar tim → level proyek.",".claude/rules/ dengan frontmatter paths (glob, mis. **/*.test.tsx) → aturan hanya dimuat untuk file yang cocok.","Slash command tim di .claude/commands/ (di repo); pribadi di ~/.claude/commands. Skills untuk prosedur yang sesekali dipakai; context: fork menjaga output panjang tidak mencemari percakapan utama.","Plan mode untuk perubahan besar, multi-file, atau banyak pilihan arsitektur; direct execution untuk perubahan kecil yang jelas.","CI/CD: flag -p (non-interaktif); --output-format json + --json-schema untuk output yang bisa di-parse mesin.","Review ulang tiap commit: sertakan temuan sebelumnya, minta hanya yang baru atau belum ditangani.","/memory untuk melihat file memori yang termuat saat perilaku tidak konsisten antar anggota tim.","Contoh input/output konkret lebih efektif daripada deskripsi samar. Sebelum mengedit repo asing: baca dan pahami dulu."],k:[["Claude Code","Alat coding berbasis Claude yang membantu memahami, membuat, dan mengubah kode melalui lingkungan pengembangan."],["“CLAUDE.md”","File instruksi proyek yang dapat digunakan untuk memberikan konteks, konvensi, dan panduan kerja kepada Claude Code."],["Hooks","Mekanisme yang menjalankan tindakan atau perintah ketika event tertentu terjadi, sesuai konfigurasi."],["Skills","Kumpulan instruksi dan sumber pendukung yang dapat digunakan kembali untuk tugas atau workflow tertentu."],["Permissions","Aturan yang menentukan tindakan atau sumber daya yang boleh diakses Claude Code."],["Code Review","Pemeriksaan perubahan kode untuk menilai ketepatan, kualitas, keamanan, dan kesesuaiannya dengan kebutuhan."],["Unit Testing","Pengujian komponen atau fungsi secara terpisah."],["Integration Testing","Pengujian interaksi antar-komponen."],["Security Testing","Pengujian untuk menemukan kelemahan keamanan."],["Least Privilege","Prinsip pemberian izin minimum yang diperlukan untuk menyelesaikan tugas."],["MCP Configuration","Pengaturan koneksi dan izin untuk mengakses layanan eksternal melalui MCP."]]},
{e:"🧠",n:"Context Management, Memory, and Caching",d:"Konteks adalah sumber daya terbatas. Menjaga informasi relevan tetap tersedia, sambil membuang noise, menentukan kualitas jawaban di sesi panjang.",p:["‘Case facts’ block: fakta transaksional (ID, nominal, tanggal) disimpan di blok persisten di setiap prompt, di luar riwayat yang diringkas.","Lost in the middle: informasi di tengah input panjang kurang diperhatikan → taruh ringkasan temuan kunci di awal dan beri header bagian.","Pangkas output tool; gunakan scratchpad file untuk temuan, subagen untuk pendalaman, dan /compact untuk memadatkan konteks.","Ringkasan setelah compaction harus memuat tujuan, batasan, keputusan, pekerjaan selesai, dan langkah tertunda.","Prompt caching: instruksi besar yang berulang dapat dipakai ulang sehingga latensi/biaya turun (bila didukung dan dikonfigurasi)."],k:[["Context Management","Pengelolaan informasi yang dimasukkan ke konteks model agar tetap relevan dan sesuai batas token."],["Context Compaction","Pengurangan atau pemadatan konteks dengan mempertahankan informasi penting."],["Summarization","Penyusunan ringkasan informasi untuk mempertahankan poin-poin utama."],["Memory","Mekanisme penyimpanan atau pengambilan informasi yang dapat digunakan kembali sesuai sistem dan konfigurasi."],["Prompt Caching","Mekanisme penggunaan kembali pemrosesan bagian prompt yang sama ketika didukung dan dikonfigurasi, untuk mengurangi latensi atau biaya."],["Context Overflow","Kondisi ketika kebutuhan konteks melampaui batas yang tersedia."],["Relevant Context","Informasi yang diperlukan untuk menjalankan tugas atau menghasilkan jawaban dengan tepat."]]},
{e:"🛡️",n:"Reliability and Error Handling",d:"Sistem nyata pasti gagal sesekali. Desain yang baik memulihkan diri secara terkendali dan tidak menggandakan efek samping.",p:["Retry hanya untuk kegagalan sementara (timeout, 429, 5xx), dengan batas, exponential backoff, dan jitter agar tidak terjadi lonjakan serentak.","Operasi dengan efek nyata (pembayaran) butuh idempotency key. Saat timeout dan status tidak jelas: cek status transaksi atau retry aman dengan key yang sama, jangan kirim ulang dengan ID baru.","Klasifikasi error dulu: ubah request, pulihkan, atau berhenti. Mengulang panggilan gagal yang sama tanpa perubahan tidak ada gunanya.","Gagal terkendali: laporkan hasil parsial + alasan; jangan sembunyikan atau anggap sukses. Audit log mendukung penelusuran.","Akurasi agregat 97% bisa menutupi performa buruk pada tipe dokumen/field tertentu → ukur per segmen dengan sampling terstratifikasi sebelum mengurangi tinjauan manusia; routing ke manusia dengan confidence per field yang dikalibrasi."],k:[["Reliability","Kemampuan sistem menjalankan tugas secara konsisten sesuai kebutuhan."],["Error Handling","Proses mendeteksi, menangani, dan memulihkan diri dari kesalahan."],["Retry","Pengulangan permintaan setelah suatu percobaan gagal atau hasilnya belum diketahui."],["Exponential Backoff","Strategi retry yang meningkatkan jeda waktu secara bertahap pada percobaan berikutnya."],["Jitter","Variasi acak pada jeda retry untuk mengurangi permintaan serentak."],["Bounded Retry","Strategi retry dengan batas jumlah percobaan atau waktu."],["Rate Limit","Batas jumlah permintaan yang diperbolehkan dalam periode tertentu."],["Idempotency","Sifat operasi yang membuat pengulangan permintaan yang sama tidak menimbulkan efek tambahan yang tidak diinginkan."],["Idempotency Key","Kunci unik yang digunakan untuk mengenali percobaan ulang sebagai operasi yang sama."],["Timeout","Batas waktu untuk menunggu suatu operasi sebelum dianggap tidak selesai dalam waktu yang ditentukan."],["Graceful Failure","Penanganan kegagalan secara terkendali tanpa menyebabkan dampak lanjutan yang tidak perlu."],["Audit Log","Catatan aktivitas yang mendukung penelusuran tindakan dan pemeriksaan sistem."]]},
{e:"🔐",n:"Security and Safe Tool Execution",d:"Prinsip utamanya: jangan menganggap output model sebagai otorisasi. Penegakan ada di server, berlapis, dan dengan izin seminimal mungkin.",p:["Urutan pertahanan: autentikasi → otorisasi → validasi input → aturan bisnis → persetujuan untuk tindakan berisiko → audit.","Least privilege: beri tool dan izin sekecil yang diperlukan; operasi destruktif butuh approval gate.","Validasi di sisi server meski input berasal dari model; penjelasan model bukan bukti izin.","Kredensial di secret manager atau environment variable; tidak di prompt dan tidak diekspos ke semua tool.","Aksi atas nama pengguna (kirim email, refund): validasi penerima dan isi, batasi, dan minta konfirmasi bila perlu.","Perintah shell yang menghapus file: periksa dampaknya dulu, setujui hanya bila memang sesuai."],k:[["Authentication","Verifikasi identitas atau kredensial suatu pihak."],["Authorization","Penentuan izin atas tindakan atau sumber daya."],["Input Validation","Pemeriksaan input sebelum diproses."],["Access Control","Mekanisme pembatasan akses berdasarkan aturan izin."],["Destructive Operation","Operasi yang dapat menghapus, mengubah, atau menimbulkan dampak yang sulit dipulihkan."],["Approval Gate","Tahapan persetujuan sebelum tindakan tertentu dijalankan."],["Credential","Informasi yang digunakan untuk membuktikan identitas atau memberikan akses."],["Secret Management","Praktik penyimpanan dan penggunaan kredensial sensitif secara aman."],["Server-Side Validation","Validasi yang dilakukan di sisi server untuk menegakkan aturan meskipun input berasal dari client atau model."],["Defense in Depth","Penggunaan beberapa lapisan pengamanan untuk mengurangi risiko kegagalan satu kontrol."]]},

<div class="card" style="margin-top:20px"><h2 class="fr">What to study next</h2>${recs(st.map(s=>[s.c,s.t]))}</div>
<div class="card" style="margin-top:20px"><h2 class="fr">Answer key and review</h2><div class="fl" id="fl"></div><div id="rv"></div></div>
<div class="nav" style="margin-top:20px"><button class="btn p" onclick="again()">New random exam</button><button class="btn" onclick="again(1)">Retry missed only</button><button class="btn" onclick="home('course')">Back to course</button></div></div>`;window.flt="all";review()}
function again(w){let ids;if(w){ids=S.order.filter(i=>S.ans[i]!==Q[i][3]);if(!ids.length){alert("No missed questions. Great work.");return}}else ids=pickQ(60);begin(ids)}
function review(){const f=window.flt,F=[["all","All"],["w","Wrong"],["u","Unanswered"],["fl","Flagged"],["r","Correct"]];
$("fl").innerHTML=F.map(x=>`<button class="btn ${f==x[0]?"on":""}" onclick="flt='${x[0]}';review()">${x[1]}</button>`).join("");
$("rv").innerHTML=S.order.map((i,n)=>{const q=Q[i],a=S.ans[i],st=a===undefined?"u":a===q[3]?"r":"w";
if(f=="w"&&st!="w"||f=="r"&&st!="r"||f=="u"&&st!="u"||f=="fl"&&!S.flag[i])return"";
return`<div class="rv ${st}"><div class="mute" style="font-size:13px">Q${n+1} · ${D[q[0]]}${S.flag[i]?" · flagged":""}</div><p style="margin:6px 0 10px"><b>${esc(q[1])}</b></p>${q[2].map((o,k)=>`<div class="ro ${k==q[3]?"k":k==a?"y":""}">${k==q[3]?"✓ ":k==a?"✗ ":""}${esc(o)}${k==q[3]?" (correct)":k==a?" (your answer)":""}</div>`).join("")}${st=="u"?`<div class="mute">Not answered</div>`:""}</div>`}).join("")||`<p class="mute">Nothing in this filter.</p>`}
document.addEventListener("keydown",e=>{if(!S||S.done||$("md")||e.target.tagName=="INPUT")return;const k=e.key.toLowerCase(),qi=S.order[S.cur],p=S.perm[qi];
if("abcd".includes(k)&&k.length==1){pick(p["abcd".indexOf(k)])}else if("1234".includes(k)&&k.length==1){pick(p[+k-1])}else if(k=="arrowright")go(1);else if(k=="arrowleft")go(-1);else if(k=="f")flg()});
window.addEventListener("beforeunload",()=>{if(S&&!S.done)sv()});
home();
</script></body></html>

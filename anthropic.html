<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CCA-F Exam Simulator</title>
<style>
:root{--bg:#eef1f5;--card:#fff;--ink:#16202e;--mute:#5b6778;--line:#d6dce5;--acc:#1f5eff;--accs:#e6edff;--ok:#0f8a5f;--oks:#dff5ec;--bad:#c9372c;--bads:#fbe6e3;--flag:#b7791f;--flags:#fdf1d8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e141c;--card:#171f2b;--ink:#e8edf4;--mute:#97a3b5;--line:#2a3547;--acc:#6b95ff;--accs:#1c2a4a;--ok:#3ecf9a;--oks:#12342a;--bad:#ff7b6e;--bads:#3a1c19;--flag:#f0b85a;--flags:#3a2d12;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e141c;--card:#171f2b;--ink:#e8edf4;--mute:#97a3b5;--line:#2a3547;--acc:#6b95ff;--accs:#1c2a4a;--ok:#3ecf9a;--oks:#12342a;--bad:#ff7b6e;--bads:#3a1c19;--flag:#f0b85a;--flags:#3a2d12;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}button:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:10px 16px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--card);z-index:10}
.brand{font-weight:700;letter-spacing:.2px}.brand small{display:block;font-weight:400;color:var(--mute);font-size:12px}
.sp{flex:1}.tm{font-variant-numeric:tabular-nums;font-weight:700;font-size:18px;padding:4px 12px;border:1px solid var(--line);border-radius:6px}.tm.low{color:var(--bad);border-color:var(--bad)}
.btn{border:1px solid var(--line);background:var(--card);padding:9px 16px;border-radius:6px;font-weight:600}.btn:hover{border-color:var(--acc)}
.btn.p{background:var(--acc);border-color:var(--acc);color:#fff}.btn.p:hover{filter:brightness(1.08)}.btn[disabled]{opacity:.4;cursor:default}
.wrap{max-width:1080px;margin:0 auto;padding:20px 16px 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:24px}
h1{font-size:30px;line-height:1.2;margin:0 0 8px}h2{font-size:20px;margin:0 0 12px}
.mute{color:var(--mute)}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.dom{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);font-size:15px}.dom:last-child{border:0}
.opt{display:flex;gap:10px;align-items:center;margin:10px 0;padding:12px;border:1px solid var(--line);border-radius:6px;cursor:pointer}
.opt input{width:18px;height:18px;accent-color:var(--acc)}
.exam{display:grid;grid-template-columns:1fr 270px;gap:16px;align-items:start}
.q{font-size:18px;margin:6px 0 16px}.tag{display:inline-block;font-size:13px;color:var(--mute);border:1px solid var(--line);border-radius:4px;padding:2px 8px}
.ch{display:flex;gap:12px;align-items:flex-start;padding:14px;margin:10px 0;border:1.5px solid var(--line);border-radius:8px;cursor:pointer;background:var(--card);width:100%;text-align:left}
.ch:hover{border-color:var(--acc)}.ch.sel{border-color:var(--acc);background:var(--accs)}
.ch b{flex:none;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:14px}.ch.sel b{background:var(--acc);border-color:var(--acc);color:#fff}
.nav{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}
.pal{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.pb{aspect-ratio:1;border:1px solid var(--line);border-radius:5px;background:var(--card);font-size:13px;font-weight:600;position:relative}
.pb.a{background:var(--acc);color:#fff;border-color:var(--acc)}.pb.f::after{content:"";position:absolute;top:2px;right:2px;border:5px solid transparent;border-top-color:var(--flag);border-right-color:var(--flag)}
.pb.c{outline:3px solid var(--ink);outline-offset:1px}
.leg{font-size:12.5px;color:var(--mute);margin-top:12px;line-height:1.7}
.bar{height:10px;background:var(--line);border-radius:5px;overflow:hidden}.bar i{display:block;height:100%;border-radius:5px}
.sc{display:flex;gap:24px;align-items:center;flex-wrap:wrap}
.ring{width:150px;height:150px;flex:none}.big{font-size:40px;font-weight:800;line-height:1}
.pill{display:inline-block;padding:3px 10px;border-radius:99px;font-weight:700;font-size:14px}
.rec{border-left:4px solid var(--bad);background:var(--bads);padding:12px 16px;border-radius:0 6px 6px 0;margin:12px 0}.rec ul{margin:6px 0 0;padding-left:20px}
.rv{border:1px solid var(--line);border-radius:8px;padding:16px;margin:12px 0;background:var(--card)}.rv.w{border-left:5px solid var(--bad)}.rv.r{border-left:5px solid var(--ok)}.rv.u{border-left:5px solid var(--flag)}
.ro{padding:6px 10px;border-radius:5px;margin:4px 0;font-size:15px}.ro.k{background:var(--oks)}.ro.y{background:var(--bads)}
.fl{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.fl .btn.on{background:var(--accs);border-color:var(--acc)}
.md{position:fixed;inset:0;background:rgba(0,0,0,.5);display:grid;place-items:center;z-index:20;padding:16px}.md .card{max-width:440px}
@media(max-width:820px){.exam{grid-template-columns:1fr}.grid2{grid-template-columns:1fr}.pal{grid-template-columns:repeat(10,1fr)}h1{font-size:24px}}
@media(prefers-reduced-motion:no-preference){.card{animation:in .25s ease-out}@keyframes in{from{opacity:.4}to{opacity:1}}}
</style></head><body>
<div id="app"></div>
<script>
const D=["Agentic Architecture & Orchestration","Tool Design & MCP Integration","Claude Code Configuration & Workflows","Prompt Engineering & Structured Output","Context Management & Reliability"];
const REC=[["Agentic loop control: stop_reason tool_use vs end_turn","Hooks and programmatic gates vs prompt-only enforcement","Coordinator–subagent design: explicit context passing, Task tool, parallel calls","Escalation criteria, structured handoffs, session resume vs fork"],
["How tool descriptions drive selection; conflicts with system prompt keywords","Structured errors: isError, errorCategory, isRetryable","tool_choice auto / any / forced; scoping 4–5 tools per agent","MCP config: .mcp.json vs user scope, env expansion, resources"],
["CLAUDE.md hierarchy and .claude/rules path globs","Commands, skills, context: fork; plan mode vs direct execution","CI/CD: -p flag, --output-format json, --json-schema","Independent review instance and avoiding duplicate comments"],
["Explicit criteria and few-shot examples over vague instructions","Tool-use JSON schemas: nullable fields, enum + other, syntax vs semantic errors","Validation-retry loops and when retry cannot help","Message Batches API (50% savings, custom_id) and multi-pass review"],
["Persistent case-facts block and trimming tool output","Lost-in-the-middle mitigation, scratchpad files, /compact","Provenance: claim–source mapping, conflicting statistics, dates","Stratified accuracy checks, calibrated confidence, disambiguation"]];
// [domain, prompt, [options], correct]
const Q=[
[0,"A support agent runs an agentic loop on the Claude API. What decides whether the loop continues?",["Response text contains “task complete”","Continue on stop_reason tool_use; stop on end_turn","A fixed count of 5 iterations","Stop when any text block appears"],1],
[0,"After your code runs a tool Claude requested, what is the correct next step?",["Start a new chat and put the result in the system prompt","Discard it; the model already knows","Append a tool_result block to the history and call the model again","Store it in a database and just say the tool succeeded"],2],
[0,"The agent skips identity verification before process_refund in ~12% of cases despite a prompt saying “always verify”. Best fix?",["Rewrite the rule in capitals","Add 10 few-shot examples","Have a second model audit refunds daily","Programmatic gate blocking process_refund until get_customer verification succeeds"],3],
[0,"Policy: refunds over $500 must always go to a human. Most reliable approach?",["Hook that intercepts the call, blocks it, and routes to escalation","Emphatic system-prompt rule","3 few-shot examples","Periodic audit by another model"],0],
[0,"A customer writes “I want a human agent now.” The agent has every investigation tool. What should it do?",["Try one resolution attempt first","Escalate immediately without investigating","Escalate only if sentiment is very negative","Ask the customer why first"],1],
[0,"The team wants escalation when the agent is “unsure”. Best approach?",["Self-rated confidence 1–10, escalate below 7","Escalate all negative-sentiment cases","Explicit criteria (policy gap, human requested, no progress) plus few-shot examples","Escalate after 3+ tool calls"],2],
[0,"A synthesis subagent omits the web-search subagent’s findings. Most likely cause?",["Subagents don’t inherit coordinator history; findings must be passed explicitly in the prompt","Subagents share memory and overwrite each other","The synthesis model is too small","Coordinator should be a single agent"],0],
[0,"With the Agent SDK, what must a coordinator have to spawn subagents?",["Subagent prompts copied into its system prompt","Streaming mode on","Separate processes outside the SDK","“Task” included in allowedTools"],3],
[0,"How do you run web-search and document-analysis subagents in parallel?",["Call Task once per turn","Emit multiple Task calls in one coordinator response","Run the coordinator twice","Merge into one subagent"],1],
[0,"A report on “AI in creative industries” covers only visual arts, though each subagent did its task well. Root cause?",["Search subagent inaccurate","Synthesis deleted topics","Coordinator’s decomposition was too narrow","Token limit too low"],2],
[0,"An investigation is resumed a day later, but many analyzed files changed, so old tool results are stale. Most reliable approach?",["New session with a structured summary, then re-verify changed parts","Resume and trust earlier results","Resume without mentioning the changes","fork_session and ignore the changes"],0],
[0,"You need two refactoring approaches explored from the same analysis baseline without cross-contamination. Which feature?",["Two sessions from scratch","Copy chat history manually","Ask the model to “forget”","fork_session"],3],
[0,"A web-search subagent times out. Best report to the coordinator?",["Empty result as “success”","Terminate the whole workflow","Retry forever silently","Structured error: failure type, attempted query, partial results, alternatives"],3],
[0,"MCP tools return dates as Unix timestamps, ISO 8601, and free text; the agent misreads them. Best solution?",["System-prompt paragraph on formats","PostToolUse hook that normalizes formats","Ask users to use ISO","Use a larger model"],1],
[0,"Which requirement suits prompt guidance rather than a hook or gate?",["Empathetic, friendly tone in complaint replies","Block refunds above a threshold","Verify identity before account access","Prevent external data transfer"],0],
[0,"A human receiving an escalation cannot see the transcript. Best handoff?",["Entire raw transcript","“Customer is angry, please help”","Human re-asks the customer","Structured summary: customer ID, root cause, amounts, actions tried, recommendation"],3],
[1,"get_customer and lookup_order both say “Retrieves information” and are often confused. Most effective first fix?",["Longer tool names","Reorder the list","Expand descriptions: inputs, example queries, when to use or not use","Merge into one tool"],2],
[1,"Tool descriptions are clear but some queries are still misrouted. Check next:",["Keyword-driven system-prompt instructions that conflict with tool descriptions","Terminal output color","Number of optional parameters","Server language version"],0],
[1,"An MCP tool fails. Which error response helps the agent most?",["“Operation failed”","Full server stack trace","Empty response flagged as success","Structured error: isError, errorCategory, isRetryable, readable message"],3],
[1,"A DB query times out but the tool returns an empty list as success; the agent says “no orders”. Fix?",["Add “double-check empty results”","Separate access failures (isError) from valid empty results","Treat all empty results as errors","Remove the tool"],1],
[1,"A synthesis subagent has 18 tools and picks irrelevant ones. Solution?",["Very long descriptions","Larger model","Limit it to ~4–5 tools relevant to its role","Hide tool names"],2],
[1,"Guarantee extract_metadata is called first on turn one. Which tool_choice?",["Force the specific tool by name","auto","Provide no other tools","Put it first in the list"],0],
[1,"Document type is unknown with several extraction schemas; output must always come through a schema. Which setting?",["auto","any","Force one schema for all","Disable tools, ask for JSON text"],1],
[1,"A team needs a shared GitHub MCP server without tokens in the repo. Best config?",["Token in project config","Each dev edits ~/.claude.json","Token in CLAUDE.md",".mcp.json at project root with env expansion like ${GITHUB_TOKEN}"],3],
[1,"You want a personal experimental MCP server that must not affect teammates. Where?",[".mcp.json in the project root",".claude/CLAUDE.md","User-scope config (~/.claude.json)","Project skill file"],2],
[1,"The agent makes many exploratory calls just to learn which issues or schemas exist. How to reduce?",["Expose the catalog as MCP resources","Raise iteration limit","Add more search tools","Disable tools"],0],
[1,"Find every call site of processRefund in the codebase. Which built-in tool?",["Glob","Grep","Edit","Write"],1],
[2,"A new developer misses team coding standards; they were written in ~/.claude/CLAUDE.md. Fix?",["Copy the file by hand","Put standards in every prompt","Put them in code comments","Move them to the project-level CLAUDE.md under version control"],3],
[2,"Test conventions must apply to *.test.tsx files spread across many directories. Most efficient?",["CLAUDE.md in each subdirectory","One always-loaded root CLAUDE.md",".claude/rules/ with a paths glob such as **/*.test.tsx","Let the model guess"],2],
[2,"Split a monolith into microservices, touching dozens of files with several architecture options. Which mode?",["Plan mode: explore and design first","Direct execution for speed","Execute, fix if it fails","50 small prompts, no plan"],0],
[2,"A CI job runs claude “Review this PR” and hangs waiting for input. Fix?",["1-hour timeout","Run with -p (non-interactive)","Pipe yes into stdin","CLAUDE_HEADLESS=true"],1],
[2,"Review findings must become inline PR comments automatically. Best option?",["Markdown plus regex","Read terminal logs","Text output, convert manually","--output-format json with --json-schema"],3],
[2,"Reviewing Claude-generated code in the same session misses issues. More effective?",["Independent Claude instance without generation-time reasoning","“Review again more critically” in the same session","Extended thinking, same session","More iterations, same session"],0],
[2,"A /review slash command must reach every teammate who clones the repo. Where?",["~/.claude/commands/","Team Slack channel",".claude/commands/ in the repo","README only"],2],
[2,"A skill’s long exploratory output pollutes the main conversation. Which setting helps?",["Move it into CLAUDE.md","context: fork in SKILL.md frontmatter","/clear each time","Disable the skill"],1],
[2,"Coding standards that always apply vs. an occasional DB-migration procedure. Best placement?",["All in CLAUDE.md","All in skills","Both in API system prompt","Standards in CLAUDE.md; migration procedure in an on-demand skill"],3],
[2,"A natural-language transformation instruction gives inconsistent output. Most effective fix?",["2–3 concrete input/output examples","Stronger wording","Keep switching models","Longer description, no examples"],0],
[2,"Two developers see different Claude Code behavior in one repo. Quickest diagnosis of loaded instructions?",["Delete all CLAUDE.md","Ask the model if it remembers","Run /memory","Restart until it works"],2],
[2,"Each new commit re-runs review and posts duplicate comments. Solution?",["Delete old comments manually","Include prior findings and ask for only new or unaddressed issues","Review once per PR","Raise temperature"],1],
[3,"A review agent’s false positives make developers ignore it; the prompt says “be conservative”. Best next step?",["Add more “be conservative”","Report only “confident” findings","More findings so devs adapt","Explicit per-category criteria; disable high-false-positive categories"],3],
[3,"Model handles ambiguous cases (informal vs formal documents) inconsistently. Most effective technique?",["Longer rule list","Lower max_tokens","Few-shot examples of ambiguous cases with reasoning","Ask it to guess faster"],2],
[3,"What does tool_use with a JSON schema guarantee for extraction?",["No JSON syntax errors, but not semantic errors like wrong totals","Every value is factually correct","No need for validation","No field is ever missing"],0],
[3,"Some documents lack a PO number but the model invents one. Schema change?",["Make all fields required","Make the field optional/nullable","Add “don’t fabricate” to the prompt","Remove the field"],1],
[3,"Document category is an enum but new categories sometimes appear. Best design?",["Force the closest category","Free string only","Reject non-matching docs","Add an “other” value with a detail text field (and “unclear”)"],3],
[3,"Extracted total ≠ sum of line items. Best validation-retry?",["Resend document, failed extraction, and the specific validation error","Resend the same prompt","Say “try again”","Accept it"],0],
[3,"When will a retry almost certainly fail?",["Document too short","Different date format","Needed info exists only in an external document not provided","Malformed JSON"],2],
[3,"Overnight tech-debt report vs. a pre-merge check that blocks developers. API split?",["Batch both","Batch for overnight report; real-time for pre-merge","Real-time both","Batch pre-merge; real-time overnight"],1],
[3,"You submit 10,000 documents to the Message Batches API. How do you match results to requests?",["Same order as requests","Timestamp","custom_id on each request","Response length"],2],
[3,"A 14-file PR review has inconsistent depth and contradictory findings. Best fix?",["One giant prompt","Review first 3 files","Raise max_tokens","Per-file passes plus a separate cross-file integration pass"],3],
[3,"You want to learn which finding patterns developers dismiss most. Schema change?",["Add a detected_pattern field to each finding","Delete rejected findings","Hide reasoning","Randomly cut findings"],0],
[3,"Detect invoices with inconsistent totals. Most useful schema?",["Only stated total","stated_total and calculated_total, then compare","Only calculated total","No totals"],1],
[4,"In a long session, order numbers and amounts are lost after summarization. Best solution?",["Summarize harder","Delete old history","Persistent “case facts” block in every prompt, outside summarized history","Ask the customer to repeat"],2],
[4,"Aggregated subagent results are a long input and the model misses findings in the middle. Mitigation?",["Key-findings summary first plus clear section headers","Random order","Hide findings mid-input","Make input longer"],0],
[4,"An order tool returns 40+ fields, only 5 relevant; context fills fast. Solution?",["Keep all fields","Remove the tool","Bigger context window only","Trim results to relevant fields before appending"],3],
[4,"In a long codebase exploration Claude gets generic and forgets earlier findings. Best strategy?",["Keep going","Scratchpad file for findings, subagents for specific questions, /compact","Turn off tools","Paste whole codebase"],1],
[4,"Two credible sources report different statistics for one metric. Correct handling?",["Pick the higher","Average them","Keep both with source attribution and flag the conflict","Delete both"],2],
[4,"The report must be traceable, and some “conflicts” come from different years. Best practice?",["Claim→source mappings with URL, excerpt, and publication date","Drop dates","Merge without attribution","Bibliography at the end only"],0],
[4,"Extraction hits 97% aggregate accuracy; management wants to end human review. Right step?",["Automate now","Raise threshold, stop testing","Sample 10 documents","Measure accuracy per document type and field with stratified sampling first"],3],
[4,"You want to route only risky extractions to human review. Strongest approach?",["Review everything forever","Field-level confidence calibrated on a labeled validation set","Route 50% at random","Route by document length"],1],
[4,"A customer says “check my latest order” and the name search returns 3 matches. Best action?",["Pick most recent activity","Pick randomly","Ask for extra identifiers (email, phone, order number)","Refuse"],2]
];
const L="ABCD",K="cca-sim-v1",$=id=>document.getElementById(id),app=$("app");
let S=null,tmr=null,cfg={time:true,shuf:true,opt:true,min:120};
const sv=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const ld=()=>{try{return JSON.parse(localStorage.getItem(K))}catch(e){return null}};
const clr=()=>{try{localStorage.removeItem(K)}catch(e){}};
const sh=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const fmt=s=>{s=Math.max(0,s);const h=s/3600|0,m=(s%3600)/60|0;return(h?h+":":"")+String(m).padStart(2,"0")+":"+String(s%60).padStart(2,"0")};
const esc=t=>String(t).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
function theme(){const r=document.documentElement,d=r.dataset.theme==="dark"||(!r.dataset.theme&&matchMedia("(prefers-color-scheme:dark)").matches);r.dataset.theme=d?"light":"dark"}
function top(extra){return`<div class="top"><div class="brand">CCA-F Exam Simulator<small>Claude Certified Architect – Foundations · practice</small></div><div class="sp"></div>${extra||""}<button class="btn" onclick="theme()" aria-label="Toggle theme">◐</button></div>`}
function home(){clearInterval(tmr);S=null;const sv_=ld(),del=sv_&&!sv_.done;
app.innerHTML=top()+`<div class="wrap"><div class="card"><h1>Practice exam: 60 scenario-based questions</h1><p class="mute">Answers and scores stay hidden until you finish. Your progress is saved on this device, so you can leave and resume. Retake as many times as you like.</p>
${del?`<div class="rec" style="border-color:var(--acc);background:var(--accs)"><b>Unfinished attempt found.</b> ${Object.keys(sv_.ans).length}/${sv_.order.length} answered.<div class="nav"><button class="btn p" onclick="resume()">Resume exam</button><button class="btn" onclick="clr();home()">Discard</button></div></div>`:""}
<div class="grid2"><div><h2>Domains covered</h2>${D.map((d,i)=>`<div class="dom"><span>${d}</span><span class="mute">${Q.filter(q=>q[0]==i).length} Qs</span></div>`).join("")}</div>
<div><h2>Settings</h2>
<label class="opt"><input type="checkbox" id="c1" ${cfg.time?"checked":""}> Timed exam</label>
<label class="opt">Minutes <input type="number" id="cm" min="10" max="300" value="${cfg.min}" style="width:80px;margin-left:auto;padding:6px"></label>
<label class="opt"><input type="checkbox" id="c2" ${cfg.shuf?"checked":""}> Shuffle question order</label>
<label class="opt"><input type="checkbox" id="c3" ${cfg.opt?"checked":""}> Shuffle answer options</label>
<p class="mute" style="font-size:14px">Tips: keys A–D select, ←/→ move, F flags a question.</p>
<button class="btn p" style="width:100%;padding:14px" onclick="start()">Start exam</button></div></div></div></div>`}
function start(wrongOnly){if($("c1")){cfg={time:$("c1").checked,min:+$("cm").value||120,shuf:$("c2").checked,opt:$("c3").checked}}
let ids=wrongOnly||Q.map((_,i)=>i);if(cfg.shuf)ids=sh(ids);const perm={};ids.forEach(i=>perm[i]=cfg.opt?sh([0,1,2,3]):[0,1,2,3]);
S={order:ids,perm,ans:{},flag:{},cur:0,timed:cfg.time,left:cfg.min*60,done:false};sv();run()}
function resume(){S=ld();cfg.time=S.timed;run()}
function run(){clearInterval(tmr);draw();if(S.timed)tmr=setInterval(()=>{S.left--;const t=$("tm");if(t){t.textContent=fmt(S.left);t.classList.toggle("low",S.left<300)}if(S.left%10==0)sv();if(S.left<=0){clearInterval(tmr);finish(true)}},1000)}
function draw(){const qi=S.order[S.cur],q=Q[qi],p=S.perm[qi],n=S.order.length,done=Object.keys(S.ans).length;
app.innerHTML=top(`${S.timed?`<div class="tm ${S.left<300?"low":""}" id="tm">${fmt(S.left)}</div>`:""}<button class="btn p" onclick="ask()">Finish exam</button>`)+
`<div class="wrap"><div class="exam"><div class="card"><div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap"><b>Question ${S.cur+1} of ${n}</b><span class="mute">${done} answered</span></div>
<div class="bar" style="margin:10px 0 16px"><i style="width:${done/n*100}%;background:var(--acc)"></i></div>
<div class="q">${esc(q[1])}</div><div role="radiogroup">${p.map((o,k)=>`<button class="ch ${S.ans[qi]===o?"sel":""}" role="radio" aria-checked="${S.ans[qi]===o}" onclick="pick(${o})"><b>${L[k]}</b><span>${esc(q[2][o])}</span></button>`).join("")}</div>
<div class="nav"><button class="btn" onclick="go(-1)" ${S.cur?"":"disabled"}>Previous</button><button class="btn" onclick="go(1)" ${S.cur<n-1?"":"disabled"}>Next</button><button class="btn ${S.flag[qi]?"on":""}" style="${S.flag[qi]?"background:var(--flags);border-color:var(--flag)":""}" onclick="flg()">${S.flag[qi]?"Unflag":"Flag for review"}</button>${S.ans[qi]!==undefined?`<button class="btn" onclick="clrA()">Clear answer</button>`:""}</div></div>
<div class="card"><h2 style="font-size:16px">Question navigator</h2><div class="pal">${S.order.map((x,i)=>`<button class="pb ${S.ans[x]!==undefined?"a":""} ${S.flag[x]?"f":""} ${i==S.cur?"c":""}" onclick="jump(${i})" aria-label="Question ${i+1}">${i+1}</button>`).join("")}</div>
<div class="leg">Filled = answered · Corner mark = flagged · Outlined = current</div></div></div></div>`}
function pick(o){S.ans[S.order[S.cur]]=o;sv();draw()}
function clrA(){delete S.ans[S.order[S.cur]];sv();draw()}
function flg(){const x=S.order[S.cur];S.flag[x]?delete S.flag[x]:S.flag[x]=1;sv();draw()}
function go(d){S.cur=Math.min(S.order.length-1,Math.max(0,S.cur+d));sv();draw()}
function jump(i){S.cur=i;sv();draw()}
function ask(){const n=S.order.length,u=n-Object.keys(S.ans).length,f=Object.keys(S.flag).length,m=document.createElement("div");m.className="md";m.id="md";
m.innerHTML=`<div class="card"><h2>Finish the exam?</h2><p>${u?`<b>${u}</b> unanswered. `:"All questions answered. "}${f?`<b>${f}</b> flagged for review.`:""}</p><p class="mute">You can’t change answers after submitting.</p><div class="nav"><button class="btn p" onclick="finish()">Submit and see score</button><button class="btn" onclick="$('md').remove()">Keep working</button></div></div>`;document.body.appendChild(m)}
function finish(auto){clearInterval(tmr);S.done=true;sv();const m=$("md");if(m)m.remove();results(auto)}
const TARGET=72;
function results(auto){const n=S.order.length,st=D.map(()=>({c:0,t:0}));let c=0;
S.order.forEach(i=>{const d=Q[i][0];st[d].t++;if(S.ans[i]===Q[i][3]){c++;st[d].c++}});
const pct=Math.round(c/n*100),pass=pct>=TARGET,col=pass?"var(--ok)":"var(--bad)",R=62,C=2*Math.PI*R;
const weak=st.map((s,i)=>({i,p:s.t?Math.round(s.c/s.t*100):100,s})).filter(x=>x.s.t&&x.p<70).sort((a,b)=>a.p-b.p);
app.innerHTML=top(`<button class="btn" onclick="home()">Home</button>`)+`<div class="wrap"><div class="card"><div class="sc"><svg class="ring" viewBox="0 0 150 150"><circle cx="75" cy="75" r="${R}" fill="none" stroke="var(--line)" stroke-width="13"/><circle cx="75" cy="75" r="${R}" fill="none" stroke="${col}" stroke-width="13" stroke-linecap="round" stroke-dasharray="${C*pct/100} ${C}" transform="rotate(-90 75 75)"/><text x="75" y="85" text-anchor="middle" font-size="32" font-weight="800" fill="var(--ink)">${pct}%</text></svg>
<div><h1 style="margin-bottom:6px">${c} / ${n} correct</h1><span class="pill" style="background:${pass?"var(--oks)":"var(--bads)"};color:${col}">${pass?"At or above target":"Below target"} (${TARGET}%)</span>
<p class="mute" style="margin:8px 0 0;max-width:46ch">${auto?"Time ran out, so the exam was submitted automatically. ":""}The ${TARGET}% target is an estimate for practice. The real exam uses scaled scoring, so treat this as a guide.</p></div></div></div>
<div class="card" style="margin-top:16px"><h2>Score by domain</h2>${st.map((s,i)=>{if(!s.t)return"";const p=Math.round(s.c/s.t*100),k=p>=80?"var(--ok)":p>=70?"var(--flag)":"var(--bad)";return`<div style="margin:12px 0"><div style="display:flex;justify-content:space-between;gap:8px"><span>${D[i]}</span><b>${s.c}/${s.t} · ${p}%</b></div><div class="bar"><i style="width:${p}%;background:${k}"></i></div></div>`}).join("")}</div>
<div class="card" style="margin-top:16px"><h2>What to study next</h2>${weak.length?weak.map(w=>`<div class="rec"><b>${D[w.i]}</b> (${w.p}%)<ul>${REC[w.i].map(t=>`<li>${t}</li>`).join("")}</ul></div>`).join("")+`<p class="mute">Focus on the lowest domain first, then retake only the questions you missed.</p>`:`<p>Every domain is at 70% or higher. Do one more full run, and re-read the explanations for any questions you flagged.</p>`}</div>
<div class="card" style="margin-top:16px"><h2>Answer key and review</h2><div class="fl" id="fl"></div><div id="rv"></div></div>
<div class="nav" style="margin-top:16px"><button class="btn p" onclick="again()">Retake full exam</button><button class="btn" onclick="again(1)">Retake missed and unanswered only</button><button class="btn" onclick="home()">Back to home</button></div></div>`;
window.flt="all";review()}
function review(){const f=window.flt,F=[["all","All"],["w","Wrong"],["u","Unanswered"],["fl","Flagged"],["r","Correct"]];
$("fl").innerHTML=F.map(x=>`<button class="btn ${f==x[0]?"on":""}" onclick="flt='${x[0]}';review()">${x[1]}</button>`).join("");
$("rv").innerHTML=S.order.map((i,n)=>{const q=Q[i],a=S.ans[i],st=a===undefined?"u":a===q[3]?"r":"w";
if(f=="w"&&st!="w"||f=="r"&&st!="r"||f=="u"&&st!="u"||f=="fl"&&!S.flag[i])return"";
return`<div class="rv ${st}"><div class="mute" style="font-size:13px">Q${n+1} · ${D[q[0]]}${S.flag[i]?" · flagged":""}</div><p style="margin:6px 0 10px"><b>${esc(q[1])}</b></p>${q[2].map((o,k)=>`<div class="ro ${k==q[3]?"k":k==a?"y":""}">${k==q[3]?"✓ ":k==a?"✗ ":""}${esc(o)}${k==q[3]?" (correct)":k==a?" (your answer)":""}</div>`).join("")}${st=="u"?`<div class="mute">Not answered</div>`:""}</div>`}).join("")||`<p class="mute">Nothing in this filter.</p>`}
function again(w){let ids=null;if(w){ids=S.order.filter(i=>S.ans[i]!==Q[i][3]);if(!ids.length){alert("No missed questions. Great work.");return}}else{cfg={...cfg}}start(ids||undefined)}
document.addEventListener("keydown",e=>{if(!S||S.done||$("md")||e.target.tagName=="INPUT")return;const k=e.key.toLowerCase(),qi=S.order[S.cur],p=S.perm[qi];
if("abcd".includes(k)&&k.length==1){pick(p["abcd".indexOf(k)])}else if("1234".includes(k)&&k.length==1){pick(p[+k-1])}else if(k=="arrowright")go(1);else if(k=="arrowleft")go(-1);else if(k=="f")flg()});
window.addEventListener("beforeunload",()=>{if(S&&!S.done)sv()});
home();
</script></body></html>

<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--y:#FFB800;--bk:#1A1A1A;--bg:#FFFEF0;--card:#fff;--ink:#1A1A1A;--bd:#1A1A1A;--mute:rgba(26,26,26,.62);--or:#FF6B35;--pk:#FF4D8D;--gr:#3DDC68;--ok:#0f9a4d;--oks:#d8f6e3;--bad:#e5334b;--bads:#ffe1e6;--sh:5px 6px 0 var(--bd);--sh2:8px 10px 0 var(--bd);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
:root[data-theme="dark"]{--bg:#15140d;--card:#23211a;--ink:#FFFEF0;--bd:#FFFEF0;--mute:rgba(255,254,240,.65);--oks:#12341f;--bads:#3b1820;color-scheme:dark}
html{scroll-behavior:smooth;scroll-padding-top:calc(84px + env(safe-area-inset-top,0px))}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:700 16px/1.55 Nunito,system-ui,sans-serif;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:#1A1A1A;z-index:900}
h1,h2,h3,.fr{font-family:Fredoka,system-ui,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--or);outline-offset:3px}
.site{position:sticky;top:env(safe-area-inset-top,0px);z-index:500;background:#1A1A1A;border-bottom:3px solid var(--y);height:68px;padding:0 32px;display:flex;align-items:center;gap:6px}
.logo{font-family:Fredoka,sans-serif;font-size:1.25rem;color:#FFFEF0;cursor:pointer;display:flex;gap:8px;align-items:center;text-decoration:none}.logo b{color:var(--y)}
.sp{flex:1}.sl{color:rgba(255,255,255,.75);text-decoration:none;font-family:Fredoka,sans-serif;font-weight:600;padding:8px 16px;border-radius:50px}.sl:hover{background:var(--y);color:#1A1A1A}
.ib{width:40px;height:40px;border:2.5px solid var(--y);background:transparent;color:var(--y);border-radius:12px;font-size:1.1rem}.ib:hover{background:var(--y);color:#1A1A1A}
.tm{font-family:Fredoka,sans-serif;font-weight:700;font-size:1.15rem;color:var(--y);border:2.5px solid var(--y);border-radius:50px;padding:4px 16px;font-variant-numeric:tabular-nums;margin-right:6px}.tm.low{color:#fff;background:var(--bad);border-color:var(--bad)}
.hero{background:#1A1A1A;padding:56px 32px 60px;position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;inset:0;background-image:radial-gradient(circle,rgba(255,184,0,.14) 1.5px,transparent 1.5px);background-size:28px 28px}
.hi{position:relative;max-width:720px}.hb{display:inline-block;background:var(--y);color:#1A1A1A;font-family:Fredoka,sans-serif;font-weight:700;font-size:.9rem;letter-spacing:1px;text-transform:uppercase;padding:8px 20px;border-radius:50px;margin-bottom:20px}
.hero h1{font-size:clamp(2.2rem,5vw,3.8rem);line-height:1.08;color:#FFFEF0;margin:0 0 14px}.hero h1 span{color:var(--y)}
.hero p{color:rgba(255,255,255,.62);max-width:520px;margin:0}
.bl{position:absolute;border-radius:50%;border:3px solid rgba(255,184,0,.3)}
.fb{background:var(--y);border-block:3px solid #1A1A1A;padding:16px 32px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;color:#1A1A1A}
.fbtn{font-family:Fredoka,sans-serif;font-weight:600;padding:8px 20px;border:2.5px solid #1A1A1A;border-radius:50px;background:transparent;color:#1A1A1A;box-shadow:3px 3px 0 #1A1A1A;transition:.15s}
.fbtn:hover,.fbtn.on{background:#1A1A1A;color:var(--y);transform:translate(-2px,-2px)}
.sec{padding:48px 32px 70px;max-width:1240px;margin:0 auto}
.sh{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap;margin-bottom:28px}
.tag{display:inline-block;background:#1A1A1A;color:var(--y);font-family:Fredoka,sans-serif;font-size:.8rem;letter-spacing:1.2px;text-transform:uppercase;padding:5px 16px;border-radius:50px}
.sh h2{font-size:1.7rem;margin:8px 0 0}.mute{color:var(--mute)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}
.pc{background:var(--card);border:3px solid var(--bd);border-radius:20px;overflow:hidden;box-shadow:var(--sh);display:flex;flex-direction:column;transition:.18s}
.pc:hover{transform:translate(-4px,-4px);box-shadow:var(--sh2)}
.pi{aspect-ratio:16/9;display:grid;place-items:center;font-size:3.4rem;border-bottom:3px solid var(--bd);position:relative}
.bg{position:absolute;top:12px;left:12px;font-family:Fredoka,sans-serif;font-size:.75rem;padding:4px 12px;border:2px solid #1A1A1A;border-radius:50px;background:var(--y);color:#1A1A1A}.bg.hot{background:var(--or);color:#fff}.bg.new{background:var(--gr)}
.pb2{padding:20px;display:flex;flex-direction:column;gap:6px;flex:1}.pcat{font-size:.74rem;letter-spacing:1.2px;text-transform:uppercase;color:var(--mute)}
.pn{font-family:Fredoka,sans-serif;font-size:1.2rem;font-weight:700;line-height:1.25}.pd{font-size:.88rem;color:var(--mute);flex:1}
.pf{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:12px;padding-top:12px;border-top:2px dashed rgba(128,128,128,.35)}
.pm{font-family:Fredoka,sans-serif;font-size:1.25rem;font-weight:700;line-height:1.1}.pm small{display:block;font-size:.75rem;font-weight:500;color:var(--mute)}
.pbt{display:flex;gap:8px}
.bc{width:42px;height:42px;border:2.5px solid #1A1A1A;border-radius:12px;background:var(--y);color:#1A1A1A;font-size:1.1rem;box-shadow:3px 3px 0 #1A1A1A;transition:.15s}.bc:hover{transform:translate(-2px,-2px);box-shadow:5px 5px 0 #1A1A1A}.bc.in{background:var(--gr)}
.bb{font-family:Fredoka,sans-serif;font-weight:700;padding:10px 18px;border:2.5px solid #1A1A1A;border-radius:12px;background:#1A1A1A;color:var(--y);box-shadow:3px 3px 0 rgba(0,0,0,.3);transition:.15s}.bb:hover{background:var(--or);border-color:var(--or);color:#fff;transform:translate(-2px,-2px)}
.cf{position:fixed;right:24px;bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:600;background:var(--gr);border:3px solid #1A1A1A;border-radius:50px;padding:13px 22px;display:flex;gap:10px;align-items:center;font-family:Fredoka,sans-serif;font-weight:700;color:#1A1A1A;box-shadow:var(--sh2);transition:.15s}.cf:hover{transform:translate(-3px,-3px)}
.cc{background:var(--pk);color:#fff;width:26px;height:26px;border-radius:50%;border:2px solid #1A1A1A;display:grid;place-items:center;font-size:.8rem}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:700;opacity:0;pointer-events:none;transition:.3s;backdrop-filter:blur(3px)}.ov.on{opacity:1;pointer-events:all}
.dr{position:fixed;right:0;top:0;bottom:0;width:min(430px,100vw);background:var(--bg);border-left:3px solid var(--bd);z-index:800;transform:translateX(105%);transition:transform .35s cubic-bezier(.34,1.3,.64,1);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}.dr.on{transform:none}
.ch2{padding:20px 24px;background:var(--y);border-bottom:3px solid #1A1A1A;display:flex;justify-content:space-between;align-items:center;color:#1A1A1A}.ch2 h3{margin:0;font-size:1.4rem}
.cx{width:40px;height:40px;border:2.5px solid #1A1A1A;background:#1A1A1A;color:var(--y);border-radius:10px}.cx:hover{background:var(--or);border-color:var(--or)}
.ci{flex:1;overflow:auto;padding:16px 20px}.ce{text-align:center;padding:50px 10px;font-family:Fredoka,sans-serif;font-size:1.15rem;color:var(--mute)}.ce span{display:block;font-size:3rem}
.it{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:2px dashed rgba(128,128,128,.35)}
.ii{width:52px;height:52px;flex:none;background:var(--y);border:2.5px solid #1A1A1A;border-radius:12px;display:grid;place-items:center;font-size:1.5rem}.in2{flex:1;min-width:0}.in2 b{font-family:Fredoka,sans-serif;display:block;line-height:1.2}.in2 small{color:var(--mute)}
.rm{background:none;border:0;color:var(--pk);font-size:1.1rem;padding:6px}
.cfo{padding:18px 22px;border-top:3px solid var(--bd);background:var(--card)}.tot{display:flex;justify-content:space-between;font-family:Fredoka,sans-serif;font-size:1.15rem;margin-bottom:10px}
.st label{display:flex;align-items:center;gap:10px;font-size:.92rem;padding:4px 0}.st input{width:18px;height:18px;accent-color:#1A1A1A}
.ck{width:100%;margin-top:12px;font-family:Fredoka,sans-serif;font-size:1.1rem;font-weight:700;padding:15px;border:3px solid #1A1A1A;border-radius:50px;background:#1A1A1A;color:var(--y);box-shadow:var(--sh);transition:.15s}.ck:hover:not(:disabled){background:var(--or);color:#fff;transform:translate(-3px,-3px)}.ck:disabled{opacity:.4;box-shadow:none;cursor:not-allowed}
.info{background:#1A1A1A;border-top:4px solid var(--y);padding:56px 32px;color:#FFFEF0}.info>div{max-width:1240px;margin:0 auto}.info h2{font-size:2rem;margin:10px 0 0}
.ig{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:28px}.ic{border:2px solid rgba(255,184,0,.25);border-radius:20px;padding:24px;background:rgba(255,255,255,.05)}.ic:hover{border-color:var(--y)}.ic h3{color:var(--y);margin:6px 0}.ic p{margin:0;color:rgba(255,255,255,.55);font-size:.9rem}
.ft{background:#1A1A1A;border-top:3px solid var(--y);padding:28px 32px;color:rgba(255,255,255,.4);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:.88rem}
/* exam + results */
.wrap{max-width:1100px;margin:0 auto;padding:28px 20px 70px}
.card{background:var(--card);border:3px solid var(--bd);border-radius:20px;padding:24px;box-shadow:var(--sh)}
.btn{font-family:Fredoka,sans-serif;font-weight:600;border:2.5px solid var(--bd);background:var(--card);color:var(--ink);padding:9px 18px;border-radius:50px;box-shadow:3px 3px 0 var(--bd);transition:.15s}.btn:hover:not([disabled]){transform:translate(-2px,-2px);box-shadow:5px 5px 0 var(--bd)}
.btn.p{background:var(--y);color:#1A1A1A;border-color:#1A1A1A;box-shadow:3px 3px 0 #1A1A1A}.btn.on{background:var(--y);color:#1A1A1A}.btn[disabled]{opacity:.4;cursor:default;box-shadow:none}
h1{font-size:2rem;line-height:1.15;margin:0 0 8px}h2{font-size:1.3rem;margin:0 0 12px}
.exam{display:grid;grid-template-columns:1fr 280px;gap:20px;align-items:start}
.q{font-size:1.15rem;margin:6px 0 16px;line-height:1.5}

{e:"💻",n:"Technology Fundamentals",k:[["Application","Perangkat lunak yang menjalankan fungsi tertentu."],["Server","Sistem yang menerima dan memproses permintaan dari client."],["Database","Sistem untuk menyimpan, mengelola, dan mengambil data."],["Code","Instruksi yang ditulis menggunakan bahasa pemrograman."],["Function","Blok kode yang menjalankan tugas tertentu."],["Parameter","Variabel yang didefinisikan dalam deklarasi fungsi."],["Argument","Nilai yang diberikan kepada parameter ketika fungsi dipanggil."],["Return Value","Nilai yang dikembalikan oleh fungsi setelah dijalankan."],["JSON (JavaScript Object Notation)","Format pertukaran data terstruktur menggunakan pasangan key-value, array, dan tipe data seperti string, number, boolean, serta null."],["Key","Nama properti dalam objek JSON."],["Value","Nilai yang disimpan pada suatu key."],["Boolean","Tipe data dengan dua nilai, yaitu “true” dan “false”."],["API (Application Programming Interface)","Antarmuka yang memungkinkan sistem perangkat lunak saling berkomunikasi."],["Endpoint","Alamat spesifik pada API untuk mengakses fungsi atau sumber daya."],["Request","Permintaan yang dikirim ke suatu layanan."],["Response","Respons yang dikirim oleh layanan setelah memproses request."],["API Key","Kredensial yang digunakan untuk mengidentifikasi atau mengautentikasi akses ke API."]]},
{e:"🌐",n:"HTTP and API Fundamentals",k:[["HTTP Method","Metode yang menentukan jenis operasi dalam request HTTP."],["GET","Mengambil data."],["POST","Mengirim data atau meminta pemrosesan suatu operasi."],["PUT","Mengganti atau memperbarui representasi sumber daya."],["PATCH","Memperbarui sebagian sumber daya."],["DELETE","Meminta penghapusan sumber daya."],["HTTP Status Code","Kode yang menunjukkan hasil pemrosesan request."],["200 OK","Request berhasil."],["400 Bad Request","Request tidak valid atau tidak dapat diproses karena kesalahan pada permintaan."],["401 Unauthorized","Autentikasi tidak valid atau belum tersedia."],["403 Forbidden","Akses ditolak karena tidak memiliki izin yang diperlukan."],["404 Not Found","Sumber daya tidak ditemukan."],["429 Too Many Requests","Request terkena pembatasan jumlah permintaan."],["500 Internal Server Error","Terjadi kesalahan internal pada server."],["API Authentication","Proses memverifikasi identitas atau kredensial pemanggil API."],["API Authorization","Proses menentukan apakah pemanggil memiliki izin untuk melakukan operasi tertentu."]]},
{e:"💬",n:"Claude API and Messages API",k:[["Claude API","Antarmuka untuk mengirim permintaan ke model Claude melalui aplikasi."],["Messages API","API untuk mengirim pesan kepada Claude dan menerima respons model."],["User Message","Pesan atau input yang diberikan oleh pengguna atau aplikasi."],["Assistant Message","Pesan atau respons yang dihasilkan oleh Claude."],["System Prompt","Instruksi yang menetapkan perilaku, peran, atau batasan model."],["Conversation Context","Informasi percakapan yang tersedia dan relevan bagi model saat menghasilkan respons."],["Token","Unit teks yang digunakan model untuk memproses input dan menghasilkan output."],["Context Window","Batas jumlah token yang dapat diproses model dalam satu konteks."]]},
{e:"🔧",n:"Tool Calling",k:[["Tool","Fungsi yang dapat digunakan model melalui aplikasi untuk menjalankan operasi atau memperoleh informasi."],["Tool Calling","Proses ketika model meminta aplikasi menjalankan suatu tool."],["“tool_use”","Jenis blok konten yang menunjukkan permintaan penggunaan tool oleh model."],["“tool_result”","Hasil eksekusi tool yang dikirim kembali ke model melalui aplikasi."],["Tool Execution","Proses menjalankan fungsi tool oleh aplikasi atau sistem yang bertanggung jawab."],["Tool Schema","Definisi struktur input, parameter, tipe data, dan persyaratan suatu tool."],["Input Validation","Pemeriksaan input untuk memastikan data memenuhi format dan ketentuan yang ditetapkan."],["Tool Description","Penjelasan fungsi dan kondisi penggunaan tool yang membantu model memilih tool secara tepat."],["Alur umum tool calling","1) Model menentukan tool diperlukan. 2) Model menghasilkan permintaan “tool_use”. 3) Aplikasi memvalidasi dan menjalankan tool. 4) Aplikasi mengirim hasil melalui “tool_result”. 5) Model memproses hasil dan melanjutkan respons atau proses berikutnya."],["Catatan","Model tidak otomatis menjalankan fungsi eksternal hanya dengan menghasilkan permintaan tool; eksekusi ditangani oleh aplikasi atau sistem yang terintegrasi."]]},
{e:"🔌",n:"MCP (Model Context Protocol)",k:[["MCP","Protokol untuk menghubungkan aplikasi AI dengan tools, resources, dan kemampuan eksternal melalui pola komunikasi yang terstandarisasi."],["MCP Host","Aplikasi AI yang mengelola interaksi dengan MCP."],["MCP Client","Komponen dalam host yang berkomunikasi dengan MCP server."],["MCP Server","Komponen yang menyediakan tools, resources, atau prompts melalui MCP."],["Tools","Kemampuan yang dapat dipanggil untuk melakukan operasi."],["Resources","Data atau konten yang dapat diakses oleh aplikasi melalui MCP."],["Prompts","Template prompt yang disediakan server untuk penggunaan tertentu."],["JSON-RPC","Protokol pesan untuk melakukan pemanggilan metode dan menerima hasil atau error."],["“tools/list”","Metode untuk menemukan tools yang tersedia pada MCP server."],["“tools/call”","Metode untuk meminta eksekusi tool tertentu."],["MCP Integration","Konfigurasi koneksi antara aplikasi AI dan MCP server beserta izin yang diperlukan."]]},
{e:"⏳",n:"Programming and Asynchronous Operations",k:[["Node.js","Runtime yang memungkinkan JavaScript dijalankan di luar browser."],["Synchronous Operation","Operasi yang dijalankan secara berurutan dan menunggu penyelesaian langkah terkait sebelum melanjutkan."],["Asynchronous Operation","Operasi yang memungkinkan proses lain berlanjut ketika suatu pekerjaan masih menunggu penyelesaian."],["“async”","Kata kunci untuk mendefinisikan fungsi asynchronous dalam JavaScript."],["“await”","Kata kunci untuk menunggu penyelesaian suatu operasi asynchronous di dalam konteks yang mendukungnya."],["Promise","Objek yang merepresentasikan hasil operasi asynchronous yang dapat berhasil atau gagal."]]},
{e:"🤖",n:"Agentic Architecture and Orchestration",k:[["AI Agent","Sistem yang menggunakan model untuk menentukan langkah, memanfaatkan tools, dan menjalankan proses menuju tujuan."],["Agentic Loop","Siklus ketika agent menilai keadaan, menentukan tindakan, menggunakan tool bila diperlukan, memproses hasil, lalu menentukan langkah selanjutnya."],["Orchestration","Pengaturan urutan kerja, pembagian tugas, koordinasi agent atau tools, dan penggabungan hasil."],["Coordinator Agent","Agent yang mengatur tugas, mendelegasikan pekerjaan, dan menggabungkan hasil dari agent lain."],["Specialist Agent","Agent yang menangani tugas atau bidang tertentu."],["Multi-Agent System","Sistem yang menggunakan beberapa agent untuk membagi dan menyelesaikan pekerjaan."],["Parallel Execution","Pelaksanaan beberapa tugas secara bersamaan ketika tugas-tugas tersebut tidak saling bergantung."],["Sequential Execution","Pelaksanaan tugas secara berurutan ketika suatu langkah bergantung pada hasil langkah sebelumnya."],["Delegation","Penyerahan tugas kepada agent atau komponen lain."],["Stopping Condition","Kondisi yang menentukan kapan proses agent harus berhenti."],["Iteration Limit","Batas jumlah pengulangan dalam suatu proses."],["Completion Criteria","Kriteria yang menentukan apakah tujuan tugas telah tercapai."],["Human-in-the-Loop","Keterlibatan manusia untuk memberikan keputusan, persetujuan, atau pemeriksaan pada tahapan tertentu."]]},
{e:"✍️",n:"Prompt Engineering and Structured Output",k:[["Prompt Engineering","Proses menyusun instruksi dan konteks agar model menghasilkan keluaran sesuai kebutuhan."],["Instruction","Arahan tentang tugas yang harus dilakukan model."],["Constraint","Batasan yang harus dipatuhi model."],["Few-Shot Prompting","Pemberian beberapa contoh input-output untuk menunjukkan pola respons yang diharapkan."],["Zero-Shot Prompting","Pemberian instruksi tanpa contoh khusus."],["Structured Output","Keluaran model yang mengikuti struktur dan format tertentu."],["JSON Schema","Definisi struktur, properti, tipe data, dan aturan validasi untuk data JSON."],["Syntax Validation","Pemeriksaan apakah data mengikuti aturan sintaks suatu format."],["Schema Validation","Pemeriksaan apakah struktur data sesuai dengan skema yang ditentukan."],["Semantic Validation","Pemeriksaan apakah makna atau isi data sesuai dengan persyaratan."],["Business-Rule Validation","Pemeriksaan apakah data memenuhi aturan operasional atau bisnis aplikasi."],["Evaluation Dataset","Kumpulan contoh yang digunakan untuk mengukur kualitas dan konsistensi hasil model."],["Regression Testing","Pengujian untuk memastikan perubahan tidak merusak fungsi yang sebelumnya berjalan dengan benar."]]},
{e:"⌨️",n:"Claude Code Configuration and Workflows",k:[["Claude Code","Alat coding berbasis Claude yang membantu memahami, membuat, dan mengubah kode melalui lingkungan pengembangan."],["“CLAUDE.md”","File instruksi proyek yang dapat digunakan untuk memberikan konteks, konvensi, dan panduan kerja kepada Claude Code."],["Hooks","Mekanisme yang menjalankan tindakan atau perintah ketika event tertentu terjadi, sesuai konfigurasi."],["Skills","Kumpulan instruksi dan sumber pendukung yang dapat digunakan kembali untuk tugas atau workflow tertentu."],["Permissions","Aturan yang menentukan tindakan atau sumber daya yang boleh diakses Claude Code."],["Code Review","Pemeriksaan perubahan kode untuk menilai ketepatan, kualitas, keamanan, dan kesesuaiannya dengan kebutuhan."],["Unit Testing","Pengujian komponen atau fungsi secara terpisah."],["Integration Testing","Pengujian interaksi antar-komponen."],["Security Testing","Pengujian untuk menemukan kelemahan keamanan."],["Least Privilege","Prinsip pemberian izin minimum yang diperlukan untuk menyelesaikan tugas."],["MCP Configuration","Pengaturan koneksi dan izin untuk mengakses layanan eksternal melalui MCP."]]},
{e:"🧠",n:"Context Management, Memory, and Caching",k:[["Context Management","Pengelolaan informasi yang dimasukkan ke konteks model agar tetap relevan dan sesuai batas token."],["Context Compaction","Pengurangan atau pemadatan konteks dengan mempertahankan informasi penting."],["Summarization","Penyusunan ringkasan informasi untuk mempertahankan poin-poin utama."],["Memory","Mekanisme penyimpanan atau pengambilan informasi yang dapat digunakan kembali sesuai sistem dan konfigurasi."],["Prompt Caching","Mekanisme penggunaan kembali pemrosesan bagian prompt yang sama ketika didukung dan dikonfigurasi, untuk mengurangi latensi atau biaya."],["Context Overflow","Kondisi ketika kebutuhan konteks melampaui batas yang tersedia."],["Relevant Context","Informasi yang diperlukan untuk menjalankan tugas atau menghasilkan jawaban dengan tepat."]]},
{e:"🛡️",n:"Reliability and Error Handling",k:[["Reliability","Kemampuan sistem menjalankan tugas secara konsisten sesuai kebutuhan."],["Error Handling","Proses mendeteksi, menangani, dan memulihkan diri dari kesalahan."],["Retry","Pengulangan permintaan setelah suatu percobaan gagal atau hasilnya belum diketahui."],["Exponential Backoff","Strategi retry yang meningkatkan jeda waktu secara bertahap pada percobaan berikutnya."],["Jitter","Variasi acak pada jeda retry untuk mengurangi permintaan serentak."],["Bounded Retry","Strategi retry dengan batas jumlah percobaan atau waktu."],["Rate Limit","Batas jumlah permintaan yang diperbolehkan dalam periode tertentu."],["Idempotency","Sifat operasi yang membuat pengulangan permintaan yang sama tidak menimbulkan efek tambahan yang tidak diinginkan."],["Idempotency Key","Kunci unik yang digunakan untuk mengenali percobaan ulang sebagai operasi yang sama."],["Timeout","Batas waktu untuk menunggu suatu operasi sebelum dianggap tidak selesai dalam waktu yang ditentukan."],["Graceful Failure","Penanganan kegagalan secara terkendali tanpa menyebabkan dampak lanjutan yang tidak perlu."],["Audit Log","Catatan aktivitas yang mendukung penelusuran tindakan dan pemeriksaan sistem."]]},
{e:"🔐",n:"Security and Safe Tool Execution",k:[["Authentication","Verifikasi identitas atau kredensial suatu pihak."],["Authorization","Penentuan izin atas tindakan atau sumber daya."],["Input Validation","Pemeriksaan input sebelum diproses."],["Access Control","Mekanisme pembatasan akses berdasarkan aturan izin."],["Destructive Operation","Operasi yang dapat menghapus, mengubah, atau menimbulkan dampak yang sulit dipulihkan."],["Approval Gate","Tahapan persetujuan sebelum tindakan tertentu dijalankan."],["Credential","Informasi yang digunakan untuk membuktikan identitas atau memberikan akses."],["Secret Management","Praktik penyimpanan dan penggunaan kredensial sensitif secara aman."],["Server-Side Validation","Validasi yang dilakukan di sisi server untuk menegakkan aturan meskipun input berasal dari client atau model."],["Defense in Depth","Penggunaan beberapa lapisan pengamanan untuk mengurangi risiko kegagalan satu kontrol."]]},
{e:"📐",n:"Prinsip Desain Sistem AI",k:[["Correctness","Ketepatan hasil terhadap kebutuhan dan fakta."],["Observability","Kemampuan memahami kondisi internal sistem melalui log, metrik, dan jejak eksekusi."],["Scalability","Kemampuan sistem menangani peningkatan beban kerja."],["Latency","Waktu yang dibutuhkan untuk menghasilkan respons atau menyelesaikan operasi."],["Throughput","Jumlah pekerjaan atau permintaan yang dapat diproses dalam periode tertentu."],["Cost Optimization","Upaya mengurangi biaya tanpa mengorbankan kualitas dan kebutuhan sistem."],["Trade-off","Pertukaran antara beberapa tujuan desain, seperti kecepatan, biaya, akurasi, keamanan, dan kompleksitas."],["End-to-End Testing","Pengujian keseluruhan alur sistem dari awal hingga akhir."],["Evidence-Based Synthesis","Penggabungan informasi berdasarkan bukti yang diperiksa dan dibandingkan."],["Fail-Safe Design","Perancangan sistem agar kegagalan tidak dengan mudah menyebabkan tindakan berbahaya atau dampak yang tidak diinginkan."]]},
{e:"⭐",n:"Prinsip Utama dan Strategi Ujian",k:[["Prinsip 1","Gunakan agent atau multi-agent berdasarkan kebutuhan dan manfaatnya."],["Prinsip 2","Jalankan tugas secara paralel jika tidak memiliki ketergantungan; gunakan urutan jika hasil langkah sebelumnya dibutuhkan."],["Prinsip 3","Validasi input dan output sebelum menjalankan operasi penting."],["Prinsip 4","Terapkan autentikasi, otorisasi, least privilege, dan persetujuan untuk tindakan berisiko."],["Prinsip 5","Gunakan retry dengan batas yang sesuai dan idempotency untuk mengurangi efek duplikasi."],["Prinsip 6","Kelola konteks dengan mempertahankan informasi yang relevan."],["Prinsip 7","Uji dan evaluasi sistem berdasarkan hasil yang terukur, bukan hanya kelancaran respons model."],["Prinsip 8","Gunakan tools dan MCP sesuai fungsi, skema, izin, serta batasan masing-masing."],["Prinsip 9","Pastikan perubahan kode ditinjau dan diuji sebelum diterapkan."],["Prinsip 10","Pilih solusi berdasarkan kebutuhan tugas, keandalan, keamanan, latensi, biaya, dan kompleksitas."]]}];
const TD=[1,4,1,1,1,1,0,3,2,4,4,4,0,0],DE=["🤖","🔧","⌨️","✍️","🛡️"];COURSE.forEach((c,i)=>c.g=TD[i]);
const M=[
["Hampir semua soal berupa skenario nyata: aplikasi menerima permintaan pengguna, server memprosesnya, database menyimpan data, dan Claude di antaranya memahami bahasa alami lalu memutuskan langkah berikutnya. Client mengirim request ke endpoint API, server menjalankan fungsi yang sesuai, lalu mengirim response berformat JSON, bahasa bersama yang terbaca manusia dan mesin. Argumen yang dihasilkan Claude saat meminta tool juga JSON yang harus cocok dengan skema tool.","Parameter adalah slot di deklarasi fungsi; argument adalah nilai yang mengisinya saat dipanggil. API key adalah kredensial yang dirahasiakan: tidak di prompt atau repositori, melainkan di environment variable atau secret manager. Kesalahan konsep paling umum adalah mengira model langsung menyentuh database; model hanya menghasilkan teks, dan aplikasi yang memvalidasi serta menjalankan operasinya."],
["Method menyatakan niat request: GET mengambil data, POST mengirim data atau meminta pemrosesan, PUT dan PATCH memperbarui penuh atau sebagian, DELETE menghapus. GET aman diulang; POST belum tentu karena bisa menciptakan efek baru, misalnya pembayaran kedua. Status 2xx berarti berhasil, 4xx kesalahan permintaan (mengulang tanpa perubahan tidak menolong), 5xx masalah server (retry terbatas masuk akal).","Kode yang sering muncul: 400 permintaan tidak valid; 401 autentikasi hilang, salah, atau kedaluwarsa; 403 identitas dikenali tetapi izin kurang; 404 sumber daya tidak ada; 429 batas laju terlampaui, tunggu lalu coba lagi dengan jeda bertambah; 500 kegagalan internal. Autentikasi menjawab ‘siapa Anda?’, otorisasi ‘apa yang boleh Anda lakukan?’, dan identitas diperiksa lebih dulu."],
["Messages API stateless: model tidak mengingat antar-request. Tiap panggilan mengirim seluruh konteks relevan, yaitu system prompt (peran dan batasan) dan pesan yang bergantian antara pengguna dan asisten. Aplikasi menyimpan riwayat dan memutuskan apa yang dikirim ulang; konteks diukur dalam token dan dibatasi context window, dan terlalu banyak membuatnya lambat, mahal, serta menurunkan perhatian pada bagian tengah.","Setiap respons membawa stop_reason: end_turn berarti selesai, tool_use berarti meminta tool, max_tokens berarti terpotong; sinyal ini mengendalikan alur agent, bukan tebakan dari teks. Instruksi system prompt kuat tetapi probabilistik, jadi aturan yang tidak boleh dilanggar ditegakkan kode, sedangkan prompt cukup untuk gaya dan nada."],
["Model menghasilkan blok tool_use berisi nama dan argumen; aplikasi memvalidasinya terhadap skema, menjalankan tool, lalu mengirim tool_result agar model melanjutkan. Model hanya meminta, tidak menjalankan; validasi, izin, dan penanganan error ada di aplikasi. Pemilihan tool bergantung pada deskripsinya: tool yang mirip akan tertukar, jadi jelaskan fungsi, input, contoh kueri, dan batas pemakaian. Belasan tool menurunkan ketepatan, beri tiap agent empat atau lima saja. tool_choice mengarahkan: auto memberi kebebasan, any mewajibkan salah satu tool, tool tertentu menjamin tool itu dipanggil.","Error yang baik terstruktur: penanda error, jenis (sementara, validasi, izin, aturan bisnis), apakah layak dicoba ulang, dan pesan terbaca. Bedakan kegagalan akses dari hasil kosong yang valid; bila query timeout tetapi tool mengembalikan daftar kosong sebagai sukses, agent keliru menyimpulkan datanya tidak ada."],
["MCP adalah protokol bersama agar aplikasi AI tidak butuh integrasi khusus per layanan. Host mengelola interaksi, client di dalam host berbicara dengan server, dan server mengekspos tools (aksi; tools/list dan tools/call), resources (data yang dapat dibaca, mis. katalog atau skema agar agent tak banyak eksplorasi), serta prompts (template), semuanya lewat JSON-RPC.","Berkas .mcp.json di akar proyek bersifat bersama lewat version control; konfigurasi tingkat user bersifat pribadi. Rahasia memakai ekspansi variabel lingkungan, bukan ditulis di berkas bersama. Tool destruktif tetap butuh pemeriksaan izin karena skema tidak cukup. Di Claude Code, Grep mencari isi berkas, Glob mencari pola nama atau jalur, dan Read, Edit, Write membaca serta mengubah."],
["Pemanggilan tool menyentuh jaringan yang lambat dan bisa gagal, jadi operasi asynchronous dipakai: program melanjutkan pekerjaan lain selagi menunggu, berbeda dengan synchronous yang menunggu tiap langkah. Di JavaScript, Promise mewakili hasil yang berakhir berhasil atau gagal, async menandai fungsi asynchronous, await menunggu Promise, dan Node.js menjalankannya di luar browser.","Tugas independen dijalankan bersamaan (total waktu sebanding tugas terlama); tugas yang bergantung berurutan. Beberapa pemanggilan tool atau subagen dalam satu respons dapat paralel. Beri tiap operasi eksternal timeout dan batas retry agar satu panggilan lambat tidak menahan seluruh alur."],
["Agentic loop: kirim permintaan, baca stop_reason, jika tool_use jalankan dan kirim hasilnya lalu ulangi, berhenti saat end_turn. Batas iterasi hanya pengaman; kriteria selesai yang jelas lebih penting. Pada hub-and-spoke, koordinator menguraikan tugas, mendelegasikan ke spesialis, dan menggabungkan hasil. Subagen tidak mewarisi riwayat koordinator, jadi semua informasi dikirim eksplisit; temuan yang hilang dari laporan biasanya tak pernah diteruskan, dan cakupan bolong padahal subagen berhasil berarti dekomposisi koordinator terlalu sempit. Multi-agent bukan default: tugas sederhana lebih baik dengan satu agent, dan langkah yang saling bergantung harus berurutan.","Aturan wajib (verifikasi sebelum refund, persetujuan di atas batas nominal) ditegakkan terprogram lewat hook atau gerbang prasyarat; nada cukup lewat prompt. Eskalasi memakai kriteria eksplisit (permintaan pelanggan, celah kebijakan, buntu), bukan sentimen atau skor keyakinan. Sesi lama yang datanya usang diganti sesi baru dengan ringkasan terstruktur, handoff manusia berupa ringkasan mandiri, info yang hilang ditanyakan, dan kegagalan subagen dilaporkan terstruktur dengan hasil parsial, bukan hasil kosong yang tampak sukses."],
["Prompt yang baik memuat instruksi jelas, konteks, batasan, dan kriteria sukses. Instruksi samar seperti ‘bersikap konservatif’ tidak efektif; gunakan kriteria konkret per kategori. Few-shot memberi contoh input-output (dengan alasan) untuk kasus ambigu; prompt panjang hanya bila tugas memang membutuhkannya, dan instruksi bertentangan harus dijernihkan lebih dulu. Keluaran terstruktur punya tiga lapis validasi: sintaks, skema, dan semantik atau aturan bisnis. JSON schema pada tool use menghapus kesalahan sintaks, bukan kesalahan isi.","Skema yang baik: field yang mungkin tidak ada dibuat opsional agar model tidak mengarang, enum diberi ‘other’ plus keterangan, dan total tertera serta total hasil hitung diekstrak terpisah. Retry efektif dengan dokumen asli, hasil gagal, dan error spesifik, tetapi sia-sia bila informasinya tak ada di dokumen. Message Batches API hemat sekitar separuh biaya dengan waktu hingga sekitar sehari (hasil dicocokkan lewat custom_id), cocok untuk pekerjaan tak mendesak; pemeriksaan yang memblokir tetap real-time. Tinjauan besar dipisah per berkas plus satu putaran lintas berkas oleh instance independen, dan perbaikan prompt dinilai dengan evaluation dataset dan regression testing."],
["Pada repositori asing, pahami dulu, rencanakan, ubah, uji, lalu tinjau. CLAUDE.md berlapis: tingkat user pribadi, tingkat proyek ikut repositori dan berlaku bagi tim; standar tim yang tak sampai ke developer baru biasanya tertulis di berkas pribadi. Aturan untuk sebagian berkas (mis. *.test.tsx) memakai .claude/rules/ dengan pola glob, /memory menunjukkan memori yang termuat, slash command tim disimpan di .claude/commands/ pada repositori, dan skills dengan context: fork menjaga keluaran panjang dari percakapan utama. Perubahan besar multi-berkas dimulai dengan plan mode; perubahan kecil langsung dieksekusi; contoh input-output konkret memperbaiki keluaran yang tak konsisten.","Pada CI/CD, flag -p menjalankan non-interaktif dan format JSON dengan skema menghasilkan keluaran yang dapat diproses mesin, mis. komentar inline di pull request. Tinjauan berulang per commit menyertakan temuan sebelumnya dan meminta hanya yang baru. Lolos uji unit tidak otomatis aman: perubahan autentikasi tetap butuh tinjauan serta pemeriksaan keamanan dan integrasi, dan perintah shell penghapus disetujui setelah dampaknya dipahami."],
["Konteks terbatas, jadi pertahankan yang relevan dan buang noise; bila melampaui batas, agent kehilangan syarat dan keputusan. Peringkasan yang baik memuat tujuan, batasan, keputusan, pekerjaan selesai, dan langkah tertunda, tetapi fakta transaksional (nomor pesanan, nominal, tanggal) disimpan di blok ‘fakta kasus’ persisten di setiap prompt. Pangkas keluaran tool, catat temuan di scratchpad, serahkan pendalaman ke subagen, dan gunakan /compact.","Pada masukan panjang, bagian tengah kurang diperhatikan (lost in the middle), jadi taruh ringkasan temuan kunci di awal dan beri header. Prompt caching memakai ulang bagian prompt yang sama sehingga latensi dan biaya turun, selama didukung dan dikonfigurasi benar."],
["Klasifikasikan error dulu: sementara layak dicoba ulang, kesalahan permintaan diperbaiki, kegagalan izin atau aturan bisnis berhenti atau dieskalasi; mengulang panggilan yang sama persis tidak berguna. Retry dibatasi, dengan exponential backoff (jeda bertambah) dan jitter (variasi acak) agar client tidak retry serentak, seperti pada 429. Untuk operasi bereffek nyata seperti pembayaran yang timeout, jangan kirim ulang dengan ID baru; gunakan idempotency key atau cek status transaksi.","Gagal secara terkendali: laporkan apa yang berhasil, gagal, dan mengapa, tanpa menyembunyikan error; audit log menjaga penelusuran. Waspadai akurasi agregat (97 persen bisa menutupi buruknya satu tipe dokumen): ukur per segmen dengan sampling terstratifikasi sebelum mengurangi tinjauan manusia, dan rutekan ke manusia dengan skor keyakinan per field yang dikalibrasi."],
["Keluaran model bukan otorisasi; aturan ditegakkan di server. Pertahanan berlapis: autentikasi, otorisasi, validasi input, aturan bisnis, persetujuan manusia untuk tindakan berisiko, dan audit, dengan least privilege agar tiap tool dan agent hanya memegang izin minimum. Operasi destruktif (penghapusan berkas lewat MCP atau perintah shell) butuh approval gate: periksa perintah dan efeknya dulu.","Aksi atas nama pengguna, seperti mengirim email, memvalidasi penerima dan isi, dibatasi, dan dikonfirmasi bila perlu. Kredensial dikelola lewat secret manager atau variabel lingkungan, tidak di prompt dan tidak diekspos ke semua tool. Validasi di server tetap dilakukan meski masukan berasal dari model."],

<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Ruang BD Narasio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap">
<style>
/* Konsep: lembar kerja yang tenang. Bilah atas tipis berisi tab modul, garis warna tipis di paling atas menandai modul aktif, judul kecil dengan denyut pipeline mini di sebelahnya, lalu panel putih bergaris halus. Warna dipakai sebagai penanda kecil, bukan blok besar. */
:root{
  --bg:#f5f6fa; --panel:#ffffff; --ink:#1c2233; --muted:#667086; --line:#e2e5ee;
  /* warna persis dari logo Narasio Data; varian -d dipakai untuk teks/tombol agar kontras terbaca */
  --blue:#498eed; --pink:#ff88e6; --violet:#a65bf6; --yellow:#ffe442; --orange:#ffe442; --green:#498eed;
  --blue-d:#2467d1; --pink-d:#b82e98; --violet-d:#7b30d6; --yellow-d:#8a6a00;
  --blue-s:#e9f1fd; --pink-s:#ffeafa; --violet-s:#f3eafe; --yellow-s:#fff8cc; --orange-s:#fff8cc; --green-s:#e9f1fd;
  --good:#17785a; --good-soft:#e1f4ed; --warn:#8a5a00; --warn-soft:#fff3c4; --bad:#b8264f; --bad-soft:#ffe6ef;
  --f-display:"Montserrat","Helvetica Neue",Arial,sans-serif;
  --f-body:"Montserrat","Helvetica Neue",Arial,sans-serif;
  --f-mono:"Montserrat","Helvetica Neue",Arial,sans-serif;
  --r:12px;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:14px/1.55 var(--f-body);margin:0;padding:0;--pc:var(--blue);--pcd:var(--blue-d);--pcs:var(--blue-s);--pt:#fff}
body[data-v="pipeline"]{--pc:var(--pink);--pcd:var(--pink-d);--pcs:var(--pink-s);--pt:#fff}
body[data-v="surat"]{--pc:var(--violet);--pcd:var(--violet-d);--pcs:var(--violet-s);--pt:#fff}
body[data-v="kalkulator"]{--pc:var(--blue);--pcd:var(--blue-d);--pcs:var(--blue-s);--pt:#fff}
body[data-v="followup"]{--pc:var(--yellow);--pcd:var(--yellow);--pcs:var(--yellow-s);--pt:var(--ink)}
h1,h2,h3{font-family:var(--f-display);margin:0;line-height:1.2}
.in{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{background:var(--panel);border-bottom:1px solid var(--line);background-image:repeating-linear-gradient(90deg,var(--yellow) 0 16px,var(--blue) 16px 32px,var(--violet) 32px 48px,var(--pink) 48px 64px);background-size:100% 8px;background-repeat:no-repeat}
header .in{background:var(--panel);position:relative;top:0}
header{padding-top:8px}
.top{display:flex;align-items:center;gap:16px;padding-block:12px;flex-wrap:wrap}
.wm{display:flex;align-items:center;gap:10px}
.wm img{height:30px;width:auto;display:block}
.wm .sep{width:1px;height:24px;background:var(--line)}
.wm b{font:700 15px var(--f-display);display:block;line-height:1.1}
.wm em{font:500 10.5px var(--f-mono);font-style:normal;color:var(--muted);letter-spacing:.04em}
nav{display:flex;gap:4px;overflow-x:auto;margin-left:auto;max-width:100%}
nav a{--nc:var(--blue);white-space:nowrap;display:flex;align-items:center;gap:7px;padding:6px 12px;border-radius:8px;color:var(--muted);text-decoration:none;font-weight:600;font-size:13.5px}
nav a::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--nc)}
nav a[data-v="pipeline"]{--nc:var(--pink)}nav a[data-v="surat"]{--nc:var(--violet)}nav a[data-v="kalkulator"]{--nc:var(--green)}nav a[data-v="followup"]{--nc:var(--yellow)}
nav a:hover{background:var(--bg);color:var(--ink)}
nav a[aria-current="page"]{background:var(--pcs);color:var(--ink);box-shadow:inset 0 -2px 0 var(--pc)}
nav a small{font:600 11px var(--f-mono);background:var(--ink);color:#fff;border-radius:99px;padding:0 7px}
nav a small:empty{display:none}
.hero{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;padding-block:18px 20px;border-top:1px solid var(--line);flex-wrap:wrap}
.eyebrow{font:500 11.5px var(--f-mono);color:var(--muted);margin:0 0 4px;letter-spacing:.02em}
.hero h1{font-size:25px;font-weight:700}
.hero p#sub{margin:4px 0 0;max-width:56ch;color:var(--muted)}
.pulse{display:flex;gap:8px;align-items:flex-end;height:78px}
.pulse .col{width:58px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:3px;height:100%}
.pulse .b{width:100%;border-radius:5px 5px 2px 2px;min-height:6px;opacity:.9}
.pulse .c{font:600 11.5px var(--f-mono)}
.pulse .t{font:500 9px var(--f-mono);max-width:100%;overflow:hidden;text-overflow:ellipsis;text-transform:uppercase;color:var(--muted);text-align:center;line-height:1;white-space:nowrap}
main{padding-block:22px 56px;display:flex;flex-direction:column;gap:18px;min-width:0}
.head{display:flex;gap:12px;justify-content:flex-end}
.head:empty{display:none}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0}
.panel>h2,.panel>.head h2{font-size:15px;font-weight:700;margin:0 0 12px;display:flex;align-items:center;gap:8px}
.panel>h2::before,.panel>.head h2::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--pc)}
.panel>.head{justify-content:space-between;align-items:center}
.panel p{margin:0 0 8px}
.grid{display:grid;gap:18px}
.g3{grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(310px,1fr))}
.stat{display:flex;flex-direction:column;gap:2px}
.stat.s1{background:var(--blue-s)}.stat.s2{background:var(--pink-s)}.stat.s3{background:var(--yellow-s)}
.stat .n{font:700 24px var(--f-display);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.stat.s1 .n{color:var(--blue-d)}.stat.s2 .n{color:var(--pink-d)}.stat.s3 .n{color:var(--yellow-d)}
.stat .l{font-size:13px;color:var(--muted)}
label{display:flex;flex-direction:column;gap:5px;font-size:12.5px;color:var(--muted);font-weight:600;min-width:0}
input,select,textarea{font:400 14.5px var(--f-body);color:var(--ink);background:#fff;border:1px solid #cfd4e1;border-radius:8px;padding:8px 10px;width:100%;min-width:0}
textarea{resize:vertical;min-height:84px}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,a:focus-visible,.out:focus-visible{outline:2px solid var(--pc);outline-offset:1px}
.row{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
button{font:600 13.5px var(--f-body);border-radius:8px;border:1px solid #cfd4e1;background:#fff;color:var(--ink);padding:7px 14px;cursor:pointer}
button:hover{background:var(--pcs);border-color:var(--pc)}
button.primary{background:var(--pcd);border-color:var(--pcd);color:var(--pt)}
button.primary:hover{filter:brightness(.94)}
button.ghost{border-color:transparent;color:var(--muted);padding:3px 6px;background:transparent}
button.ghost:hover{color:var(--bad);background:transparent}
button:disabled{opacity:.6;cursor:progress}
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.pill{display:inline-block;font:600 11.5px var(--f-mono);padding:1px 9px;border-radius:99px;background:var(--blue-s);color:var(--blue-d)}
.pill.good{background:var(--good-soft);color:var(--good)}.pill.warn{background:var(--warn-soft);color:var(--warn)}.pill.bad{background:var(--bad-soft);color:var(--bad)}
.stages{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
.stage{--sc:var(--blue);--ss:var(--blue-s)}
.stage.st1{--sc:var(--pink);--ss:var(--pink-s)}.stage.st2{--sc:var(--violet);--ss:var(--violet-s)}.stage.st3{--sc:var(--yellow);--ss:var(--yellow-s)}.stage.st4{--sc:var(--blue);--ss:var(--blue-s)}.stage.st5{--sc:var(--pink);--ss:var(--pink-s)}
.stage h3{font:600 11px var(--f-mono);text-transform:uppercase;letter-spacing:.04em;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:6px;background:var(--ss);border-radius:8px;padding:6px 10px}
.stage h3 span:first-child{display:flex;align-items:center;gap:6px}
.stage h3 span:first-child::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--sc)}
.card{border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px;background:#fff;display:flex;flex-direction:column;gap:5px;min-width:0}
.card b{overflow-wrap:anywhere}
.card small{color:var(--muted)}
.card select{padding:4px 6px;font-size:12.5px}
.list{display:flex;flex-direction:column}
.item{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-top:1px solid var(--line);align-items:center;flex-wrap:wrap}
.item:first-child{border-top:0}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.empty{padding:20px;border:1px dashed #cfd4e1;border-radius:10px;color:var(--muted);text-align:center}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:660px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font:600 11px var(--f-mono);text-transform:uppercase;letter-spacing:.04em;color:var(--muted);background:var(--bg)}
td input{padding:6px 8px}
.out{white-space:pre-wrap;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px;min-height:140px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:#fff;padding:9px 16px;border-radius:8px;font-weight:500;z-index:20}
.bar{display:flex;height:8px;border-radius:99px;overflow:hidden;background:var(--line);margin-bottom:2px}
.bar i{display:block;background:var(--pink)}
.doc{display:flex;flex-direction:column;gap:8px}
.doc ul{margin:0;padding-left:18px;font-size:13.5px;color:var(--muted)}
.doc a{font-weight:600;color:var(--pcd);font-size:13.5px}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.sgrid{display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.15fr);gap:18px;align-items:start}
.form{display:flex;flex-direction:column;gap:14px;margin-top:14px}
.letter{white-space:pre-wrap;background:#fff;border:1px solid var(--line);border-radius:10px;padding:22px;font:14px/1.7 var(--f-body);max-height:78vh;overflow:auto}
.letter mark{background:#ffe45c;color:var(--ink);padding:0 3px;border-radius:3px}
@media (max-width:900px){.sgrid{grid-template-columns:minmax(0,1fr)}}
@media (max-width:760px){
  nav{margin-left:0;width:100%}
  .stages{grid-template-columns:repeat(2,minmax(0,1fr))}
  .pulse{min-width:0;width:100%}.pulse .col{flex:1;width:auto}
}
@media (max-width:480px){.stages{grid-template-columns:minmax(0,1fr)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

let clients=[], dbCol=null, dbOn=false, sampleFn=null, DL=null, MCP=null;

const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const rp=n=>"Rp "+Math.round(n||0).toLocaleString("id-ID");
const today=()=>new Date().toISOString().slice(0,10);
const fmtD=d=>d?new Date(d+"T00:00:00").toLocaleDateString("id-ID",{day:"numeric",month:"short",year:"numeric"}):"-";
function toast(t){const e=$("#toast");e.textContent=t;e.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>e.hidden=true,2200)}
async function copy(t){try{await navigator.clipboard.writeText(t);toast("Tersalin")}catch(e){toast("Salin manual: pilih teks lalu Ctrl+C")}}
function lsGet(){try{return JSON.parse(localStorage.getItem("bd_clients")||"[]")}catch(e){return[]}}
function lsSet(){try{localStorage.setItem("bd_clients",JSON.stringify(clients))}catch(e){}}

/* ---------- data ---------- */
async function saveClient(c){
  const {id,...data}=c;
  if(dbOn){try{await (id?dbCol.doc(id):dbCol.doc()).set(data);return}catch(e){toast("Gagal menyimpan ke database");return}}
  if(!id){c.id="l"+Date.now();clients.push(c)}else clients=clients.map(x=>x.id===id?c:x);
  lsSet();render();
}
async function delClient(id){
  if(dbOn){try{await dbCol.doc(id).delete()}catch(e){toast("Gagal menghapus")}return}
  clients=clients.filter(x=>x.id!==id);lsSet();render();
}
function demo(){
  const d=n=>{const x=new Date();x.setDate(x.getDate()+n);return x.toISOString().slice(0,10)};
  [{nama:"Contoh: Fakultas Bisnis Univ. A",pic:"Dekan",kontak:"",tahap:"Proposal",nilai:150000000,follow:d(2),kebutuhan:"Pelatihan business analytics untuk 40 dosen dan mahasiswa",contoh:true},
   {nama:"Contoh: PT Retail B",pic:"HR Manager",kontak:"",tahap:"Audiensi",nilai:80000000,follow:d(-1),kebutuhan:"Upskilling tim marketing berbasis data",contoh:true},
   {nama:"Contoh: Dinas C",pic:"Kepala Bidang",kontak:"",tahap:"Lead",nilai:60000000,follow:d(7),kebutuhan:"Literasi data aparatur",contoh:true}].forEach(saveClient);
}

/* ---------- views ---------- */
function curV(){let h=location.hash.slice(1);if(h==="proposal"||h==="dokumen")h="surat";return V[h]?h:"ringkasan"}
const V={};
V.ringkasan=()=>{
  const act=clients.filter(c=>c.tahap!=="Closing");
  const val=act.reduce((a,c)=>a+(+c.nilai||0),0);
  const due=clients.filter(c=>c.follow&&c.follow<=today()&&c.tahap!=="Closing").sort((a,b)=>a.follow.localeCompare(b.follow));
  const soon=clients.filter(c=>c.follow&&c.follow>today()&&c.tahap!=="Closing").sort((a,b)=>a.follow.localeCompare(b.follow)).slice(0,5);
  const tot=clients.length||1;
  return `<div class="head"><div><h1>Ringkasan</h1><p>Apa yang perlu kamu kerjakan hari ini, dari klien yang sedang berjalan.</p></div></div>
  <div class="grid g3">
   <div class="panel stat s1"><span class="n">${act.length}</span><span class="l">Klien aktif</span></div>
   <div class="panel stat s2"><span class="n">${rp(val)}</span><span class="l">Nilai pipeline berjalan</span></div>
   <div class="panel stat s3"><span class="n" style="color:${due.length?"var(--bad)":"inherit"}">${due.length}</span><span class="l">Follow-up jatuh tempo</span></div>
  </div>
  <div class="grid g2">
   <div class="panel"><h2>Perlu ditindaklanjuti</h2>${due.length?`<div class="list">${due.map(c=>`<div class="item"><div><b>${esc(c.nama)}</b><br><small class="muted">${esc(c.tahap)} · ${esc(c.pic||"")}</small></div><span class="pill bad">${fmtD(c.follow)}</span></div>`).join("")}</div>`:`<div class="empty">Tidak ada follow-up yang terlambat.</div>`}
   ${soon.length?`<h2 style="margin-top:18px">Segera</h2><div class="list">${soon.map(c=>`<div class="item"><b>${esc(c.nama)}</b><span class="pill">${fmtD(c.follow)}</span></div>`).join("")}</div>`:""}</div>
   <div class="panel"><h2>Sebaran tahap</h2>${clients.length?STAGES.map(s=>{const k=clients.filter(c=>c.tahap===s).length;return `<div class="item"><span>${s}</span><span class="mono">${k}</span></div><div class="bar"><i style="width:${k/tot*100}%"></i></div>`}).join(""):`<div class="empty">Belum ada klien. Tambahkan di Pipeline.</div>`}</div>
  </div>`;
};
V.pipeline=()=>{
  return `<div class="head"><div><h1>Pipeline Klien</h1><p>Pindahkan tahap lewat menu di tiap kartu.</p></div>${clients.length?"":`<button id="demoBtn">Muat 3 contoh klien</button>`}</div>

   <label>Nama institusi<input id="f_nama" required></label>
   <label>PIC dan jabatan<input id="f_pic"></label>
   <label>Kontak (email / WA)<input id="f_kontak"></label>
   <label>Tahap<select id="f_tahap">${STAGES.map(s=>`<option>${s}</option>`).join("")}</select></label>
   <label>Perkiraan nilai (Rp)<input id="f_nilai" type="number" min="0" step="1000000"></label>
   <label>Follow-up berikutnya<input id="f_follow" type="date"></label></div>
   <label style="margin-top:12px">Kebutuhan klien<textarea id="f_keb" placeholder="Apa masalah atau tujuan klien?"></textarea></label>
   <div class="actions" style="margin-top:12px"><button class="primary">Simpan klien</button></div></form>
  <div class="stages">${STAGES.map(s=>{const l=clients.filter(c=>c.tahap===s);return `<div class="stage st${STAGES.indexOf(s)}"><h3><span>${s}</span><span>${l.length}</span></h3>${l.map(c=>`<div class="card"><b>${esc(c.nama)}</b><small>${esc(c.pic||"")}</small>${c.nilai?`<span class="mono">${rp(c.nilai)}</span>`:""}${c.follow?`<span class="pill ${c.follow<=today()?"bad":""}">${fmtD(c.follow)}</span>`:""}
   <select data-mv="${c.id}" aria-label="Tahap ${esc(c.nama)}">${STAGES.map(t=>`<option ${t===c.tahap?"selected":""}>${t}</option>`).join("")}</select>
   <button class="ghost" data-del="${c.id}">Hapus</button></div>`).join("")}</div>`}).join("")}</div>`;
};
function clientOpts(){return `<option value="">— isi manual —</option>`+clients.map(c=>`<option value="${c.id}">${esc(c.nama)}</option>`).join("")}
V.kalkulator=()=>{
  const sub=rows.reduce((a,r)=>a+r.h*r.p,0);
  return `<div class="head"><div><h1>Kalkulator Penawaran</h1><p>Harga satuan per peserta, sudah termasuk PPh 23 (2%), belum termasuk PPN 11% (Non-PKP).</p></div></div>
  <div class="panel"><div class="scroll"><table><thead><tr><th>Item</th><th>Durasi (jam)</th><th>Harga satuan</th><th>Peserta</th><th>Subtotal</th><th></th></tr></thead><tbody>

      const k=b.dataset.ai,v=vals(),c=clients.find(x=>x.id===SV.cl);
      const ctx={...v,kebutuhan:(c&&c.kebutuhan)||"belum disebutkan"};
      const pr=meta(k).ai.replace(/\{(\w+)\}/g,(m,x)=>ctx[x]||`[${x} belum diisi]`)+"\nKeluarkan hanya teksnya, tanpa pengantar dan tanpa markdown.";
      const ta=f.querySelector(`[data-k="${k}"]`);b.disabled=true;b.textContent="Claude menulis...";
      try{const r=await sampleFn(pr,{onText:({text})=>{ta.value=text;v[k]=text;updatePV()},cache:false});ta.value=r.text;v[k]=r.text;updatePV()}
      catch(e){toast("Gagal menghubungi Claude")}finally{b.disabled=false;b.textContent="Bantu tulis dengan Claude"}
    });
    const sv=$("#s_tplsave");if(sv)sv.onclick=async()=>{const t=$("#s_tpl").value.trim();if(!t){toast("Tempelkan teks dulu");return}TPL[SV.tid]=t;SV.edit=false;if(tplCol){try{await tplCol.doc(SV.tid).set({text:t})}catch(e){toast("Tersimpan di sesi ini saja")}}toast("Template tersimpan");rerender()};
    const cn=$("#s_tplcancel");if(cn)cn.onclick=()=>{SV.edit=false;rerender()};
  }
  if(!vals().kota_tanggal&&bodyOf().includes("{{kota_tanggal}}"))vals().kota_tanggal=KT();
  bindForm();updatePV();
  if(!bodyOf())$("#s_form").innerHTML=fieldsHTML(),bindForm();
}

/* ---------- behaviour ---------- */
const FALLBACK_ESAI=(n,j,prog,pes,keb)=>`Kepada Yth. ${n},

Latar belakang
${n} sebagai ${j.toLowerCase()} menghadapi kebutuhan yang terus berkembang${keb?": "+keb:""}. Kami memahami bahwa keputusan yang baik semakin bergantung pada data dan kompetensi tim yang mengelolanya.

Solusi yang kami tawarkan
PT Berpikir Revolusioner Indonesia (Narasio Data) menawarkan ${prog} untuk sekitar ${pes} peserta. Program dilengkapi pendampingan trainer dan mentor berpengalaman serta studi kasus praktis.

Manfaat
Peserta memperoleh kemampuan menerjemahkan masalah menjadi analisis, membaca hasilnya, dan mengambil keputusan.

Langkah berikutnya
Kami siap berdiskusi untuk menyesuaikan topik, jadwal, dan format pelaksanaan. Terima kasih atas perhatian Bapak/Ibu.

(Draf dasar tanpa Claude. Isi detail dan sunting sesuai klien.)`;

async function ask(prompt,out,st,btn){
  btn.disabled=true;st.textContent="Claude sedang menulis...";
  try{
    const r=await sampleFn(prompt,{onText:({text})=>{out.textContent=text},cache:false});
    out.textContent=r.text;st.textContent="";
  }catch(e){st.textContent=e&&e.code==="not_granted"?"Izin ditolak, memakai draf dasar.":"Gagal menghubungi Claude, memakai draf dasar.";return false}
  finally{btn.disabled=false}
  return true;
}
function bind(){
  const v=curV();
  if(v==="pipeline"){
    $("#addForm").onsubmit=e=>{e.preventDefault();saveClient({nama:$("#f_nama").value.trim(),pic:$("#f_pic").value.trim(),kontak:$("#f_kontak").value.trim(),tahap:$("#f_tahap").value,nilai:+$("#f_nilai").value||0,follow:$("#f_follow").value,kebutuhan:$("#f_keb").value.trim()});toast("Klien tersimpan")};
    document.querySelectorAll("[data-mv]").forEach(s=>s.onchange=()=>{const c=clients.find(x=>x.id===s.dataset.mv);if(c)saveClient({...c,tahap:s.value})});
    document.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{if(b.dataset.arm){delClient(b.dataset.del)}else{b.dataset.arm=1;b.textContent="Klik lagi untuk hapus";setTimeout(()=>{b.dataset.arm="";b.textContent="Hapus"},3000)}});
    const d=$("#demoBtn");if(d)d.onclick=demo;
  }
  if(v==="surat")suratBind();
  if(v==="kalkulator"){
    document.querySelectorAll("[data-r]").forEach(i=>i.onchange=()=>{const r=rows[+i.dataset.r],k=i.dataset.k;r[k]=k==="n"?i.value:(+i.value||0);render()});
    document.querySelectorAll("[data-rd]").forEach(b=>b.onclick=()=>{rows.splice(+b.dataset.rd,1);render()});
    $("#r_add").onclick=()=>{rows.push({n:"Item baru",j:0,h:0,p:1});render()};
    $("#r_cp").onclick=()=>{const t=rows.reduce((a,r)=>a+r.h*r.p,0);copy(rows.map((r,i)=>`${i+1}. ${r.n}: ${rp(r.h)} x ${r.p} peserta = ${rp(r.h*r.p)}`).join("\n")+`\nTotal: ${rp(t)} (termasuk PPh 23 2%, belum termasuk PPN 11%)`)};
  }
  if(v==="followup"){
    $("#m_cl").onchange=e=>{const c=clients.find(x=>x.id===e.target.value);if(c)$("#m_to").value=c.pic||""};
    $("#m_cp").onclick=()=>copy($("#m_out").innerText);
    $("#m_go").onclick=async()=>{
      const c=clients.find(x=>x.id===$("#m_cl").value),to=$("#m_to").value.trim()||"Bapak/Ibu",sit=$("#m_sit").value,ch=$("#m_ch").value,out=$("#m_out"),st=$("#m_st");
      const nama=c?c.nama.replace(/^Contoh:\s*/,""):"institusi Bapak/Ibu";
      if(sampleFn){
        const pr=`Tulis pesan ${ch} dalam bahasa Indonesia, sopan, singkat (${ch==="WhatsApp"?"maksimal 90 kata":"maksimal 140 kata, sertakan baris Subjek"}), dari tim Business Development PT Berpikir Revolusioner Indonesia (Narasio Data) kepada ${to} di ${nama}. Situasi: ${SITUASI[sit]}. ${c&&c.kebutuhan?"Konteks kebutuhan klien: "+c.kebutuhan+".":""} Akhiri dengan satu ajakan tindakan yang jelas. Jangan mengarang fakta. Keluarkan hanya pesannya.`;
        const ok=await ask(pr,out,st,$("#m_go"));if(ok)return;
      }
      out.textContent=`Selamat siang ${to},\n\nTerima kasih atas waktu dan perhatian dari pihak ${nama}. ${SITUASI[sit]}. Kami siap menjawab pertanyaan atau menyesuaikan usulan kami.\n\nApakah minggu ini ada waktu untuk berdiskusi singkat?\n\nSalam,\nTim BD Narasio Data`;
    };
  }
}
function render(){
  const v=curV();
  const keep=document.activeElement&&document.activeElement.id;
  document.body.dataset.v=v;$("#view").innerHTML=V[v]();
  const h=document.querySelector("#view>.head");
  if(h){const t=h.querySelector("h1");if(t){$("#ttl").textContent=t.textContent;const pp=t.parentElement.querySelector("p");$("#sub").textContent=pp?pp.textContent:"";t.parentElement.remove()}}
  $("#eyebrow").textContent=new Date().toLocaleDateString("id-ID",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
  const cnt=STAGES.map(x=>clients.filter(c=>c.tahap===x).length),mx=Math.max(1,...cnt),SC=["var(--blue)","var(--pink)","var(--violet)","var(--yellow)","var(--blue)","var(--pink)"];
  $("#pulse").innerHTML=STAGES.map((x,i)=>`<div class="col"><span class="c">${cnt[i]}</span><div class="b" style="height:${8+cnt[i]/mx*34}px;background:${SC[i]}"></div><span class="t">${x}</span></div>`).join("");
  document.querySelectorAll("nav a").forEach(a=>{if(a.dataset.v===v)a.setAttribute("aria-current","page");else a.removeAttribute("aria-current")});
  $("#navCount").textContent=clients.length||"";
  bind();
}
window.addEventListener("hashchange",render);

})();

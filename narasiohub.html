const BL=['Training Certiport','Training IABAC','Consulting','Asesmen NORI','Lainnya'],BS=['Draft','Dikirim ke Klien','Ditandatangani'];
function bAdd(){const k=gid('bk').value.trim();if(!k)return toast('Nama klien wajib diisi');BAST.unshift({id:Date.now().toString(36),k:eh(k),l:gid('bl').value,tg:gid('bt').value,pic:eh(gid('bp').value.trim()),st:'Draft'});toast('BAST dibuat sebagai draft');render()}
function bSt(id,st){const b=BAST.find(x=>x.id==id);b.st=st;if(st=='Ditandatangani'&&CXR.bast)cxBot('tc','📑 BAST '+b.k+' ('+b.l+') sudah ditandatangani, siap ditindaklanjuti untuk penagihan.');render()}
function bastV(){return `<button class="back" onclick="go('home')">← Kembali</button><h2 style="font-size:19px;margin:4px 0">BAST</h2><p style="color:var(--mute);font-size:12.5px;margin-bottom:10px">Berita Acara Serah Terima pekerjaan ke klien. Alur: Draft, Dikirim ke Klien, Ditandatangani.</p><div class="card" style="display:block"><b style="font-size:14px">BAST baru</b><input id="bk" class="in" type="text" placeholder="Nama klien" style="margin-top:8px"><select id="bl" class="in">${BL.map(x=>`<option>${x}</option>`).join('')}</select><input id="bt" class="in" type="date" value="${new Date().toISOString().slice(0,10)}"><input id="bp" class="in" type="text" placeholder="PIC klien (opsional)"><button class="btn" style="background:var(--th)" onclick="bAdd()">Buat BAST</button></div><h2>Daftar BAST</h2>`+BAST.map(b=>{const i=BS.indexOf(b.st);return `<div class="card" style="display:block"><div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px"><div><b style="font-size:14px">${b.k}</b>${b.seed?' <span class="cxrl" style="background:var(--mute)">contoh</span>':''}<p>${b.l} · serah terima ${b.tg||'-'}${b.pic?' · PIC '+b.pic:''}</p></div><span class="badge" style="background:${i==2?'var(--ok)':i==1?'var(--acc)':'var(--mute)'}">${b.st}</span></div><div class="chips" style="padding:8px 0 0"><a class="badge" target="_blank" rel="noopener" href="https://docs.google.com" style="text-decoration:none">Buka di Docs</a>${i==0?`<button class="badge" style="border:0;cursor:pointer" onclick="bSt('${b.id}','Dikirim ke Klien')">Kirim ke klien</button>`:''}${i==1?`<button class="badge" style="border:0;cursor:pointer;background:var(--ok)" onclick="bSt('${b.id}','Ditandatangani')">Tandai ditandatangani</button>`:''}</div></div>`}).join('')}
/* ===== Panel produk personal ===== */
const NQ=[['Seberapa siap organisasi memakai data untuk keputusan?',['Belum siap','Sebagian','Siap']],['Apakah kompetensi SDM sudah terukur?',['Belum','Sebagian','Sudah']],['Seberapa jelas strategi dan proses data?',['Belum jelas','Sebagian','Jelas']],['Kebutuhan utama yang ingin dicapai?',['Sertifikasi kompetensi','Standar profesi data','Pendampingan strategi']]];
let NA=[];
const NRC={0:['Training Certiport','Sertifikasi kompetensi digital dan data'],1:['Training IABAC','Standar profesi dan sertifikasi data'],2:['Consulting','Pendampingan strategi dan kesiapan organisasi']};
function nPick(i){NA.push(i);render()}
function norP(){const s=NA.length,q=NQ[s];let b;
 if(q)b=`<div class="chips" style="padding:0 0 8px">${NQ.map((_,i)=>`<button class="${i<s?'on':''}" style="padding:4px 12px">${i+1}</button>`).join('')}</div><b style="font-size:14px">${q[0]}</b>${q[1].map((o,i)=>`<button class="cxo" style="margin-top:8px;padding:12px" onclick="nPick(${i})"><em>${o}</em></button>`).join('')}`;
 else{const sc=Math.round((NA[0]+NA[1]+NA[2])/6*100),r=NRC[NA[3]];b=`<div style="display:flex;gap:14px;align-items:center"><div style="width:84px;height:84px;border-radius:50%;background:conic-gradient(var(--th) ${sc*3.6}deg,var(--line) 0);display:grid;place-items:center;flex:none"><div style="width:64px;height:64px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-weight:800;font-size:18px">${sc}</div></div><div><small style="color:var(--mute)">Skor kesiapan organisasi</small><br><b style="font-size:15px">${sc<40?'Perlu penguatan':sc<75?'Berkembang':'Siap'}</b></div></div><div class="card" style="margin:12px 0 0;border-left:4px solid var(--th)"><div class="g"><small style="color:var(--mute)">Rekomendasi layanan</small><b style="display:block;font-size:15px">${r[0]}</b><p>${r[1]}</p></div></div><button class="btn" style="background:var(--th);margin-top:10px" onclick="NA=[];render()">Ulangi asesmen</button>`}
 return `<div class="card" style="display:block"><div style="display:flex;justify-content:space-between;margin-bottom:10px"><b>Asesmen kesiapan</b><span class="cxrl" style="background:var(--mute)">SIMULASI</span></div>${b}<p style="font-size:11px;color:var(--mute);margin-top:10px">Pertanyaan dan skor hanya contoh tampilan. Isi asesmen resmi mengikuti NORI.</p></div>`}
let KS={img:null,file:null,res:null,busy:0,list:[]};
function ktFile(f){if(!f)return;KS.file=f;KS.res=null;const r=new FileReader();r.onload=()=>{KS.img=r.result;render()};r.readAsDataURL(f)}
async function ktRead(){if(!KS.file)return toast('Pilih foto kartu nama dulu');KS.busy=1;render();const e={nama:'',jabatan:'',perusahaan:'',telepon:'',email:''};
 try{const sp=window.claude&&claude.use?await claude.use('sample'):null;const lim=sp?await sp.limits():null;if(!lim||!lim.images)throw{code:'na'};
  const r=await sp.json('Gambar ini foto kartu nama. Baca teksnya dan balas HANYA JSON dengan kunci: nama, jabatan, perusahaan, telepon, email. Gunakan string kosong jika tidak terbaca.',{images:[KS.file],modelTier:'quick'});KS.res=Object.assign(e,r&&typeof r=='object'?r:{})}
 catch(x){KS.res=e;toast(x&&x.code=='na'?'Pembacaan otomatis tidak tersedia di sini, isi manual':'Gagal membaca, isi atau periksa manual')}KS.busy=0;render()}
function ktSave(){const g=i=>eh(gid(i).value.trim());const c={nama:g('kn'),jabatan:g('kj'),perusahaan:g('kp'),telepon:g('kt'),email:g('ke')};if(!c.nama&&!c.perusahaan)return toast('Isi minimal nama atau perusahaan');KS.list.unshift(c);KS.img=null;KS.file=null;KS.res=null;toast('Kontak tersimpan');render()}
function kartP(){const r=KS.res,f=(i,l,k)=>`<input id="${i}" class="in" type="text" placeholder="${l}" value="${eh(r?r[k]:'')}">`;
 return `<div class="card" style="display:block"><div style="display:flex;justify-content:space-between;margin-bottom:10px"><b>Pindai kartu nama</b><span class="cxrl" style="background:var(--th)">KARTU NAMA → DATA</span></div><div class="vf">${KS.img?`<img src="${KS.img}" alt="kartu nama" style="max-width:100%;max-height:100%;border-radius:8px">`:'<span style="color:var(--mute);font-size:13px">Arahkan atau pilih foto kartu nama</span>'}<i class="c1"></i><i class="c2"></i><i class="c3"></i><i class="c4"></i></div><input id="ktf" type="file" accept="image/*" style="display:none" onchange="ktFile(this.files[0])"><div style="display:flex;gap:8px;margin-top:10px"><button class="btn" style="background:var(--mute)" onclick="gid('ktf').click()">📷 Foto / pilih</button><button class="btn" style="background:var(--th)" onclick="ktRead()">${KS.busy?'Membaca...':'Baca kartu'}</button></div>${r?`<div style="margin-top:12px">${f('kn','Nama','nama')}${f('kj','Jabatan','jabatan')}${f('kp','Perusahaan','perusahaan')}${f('kt','Telepon','telepon')}${f('ke','Email','email')}<button class="btn" style="background:var(--ok)" onclick="ktSave()">Simpan ke kontak</button></div>`:''}<p style="font-size:11px;color:var(--mute);margin-top:8px">Foto dikirim ke Claude untuk dibaca, dengan izinmu. Periksa hasilnya sebelum disimpan.</p></div>${KS.list.length?`<h2>Kontak tersimpan (sesi ini)</h2>`+KS.list.map(c=>`<div class="card"><div class="av">${(c.nama||c.perusahaan||'?')[0]}</div><div class="g"><b style="font-size:14px">${c.nama||'-'}</b><p>${c.jabatan} · ${c.perusahaan}<br>${c.telepon} ${c.email}</p></div></div>`).join(''):''}`}
let SS={txt:'Budi Santoso, NIK 3578012345670001, HP 0812-3456-7890, email budi@contoh.co.id, NPWP 12.345.678.9-012.000',mode:'Parsial'};
const SR=[['NIK',/\b\d{16}\b/g],['NPWP',/\b\d{2}\.\d{3}\.\d{3}\.\d-\d{3}\.\d{3}\b/g],['Email',/[\w.+-]+@[\w-]+(?:\.[\w-]+)+/g],['Telepon',/(?:\+62|0)8[\d\s-]{8,13}\d/g]];
function sdMask(t,mode){const c={};let o=t;SR.forEach(([n,r])=>{o=o.replace(r,m=>{c[n]=(c[n]||0)+1;if(mode=='Penuh')return '█'.repeat(Math.min(m.length,10));if(mode=='Token')return '['+n+'_'+c[n]+']';const k=Math.max(2,Math.floor(m.length/4));return m.slice(0,k)+'•'.repeat(Math.max(1,m.length-2*k))+m.slice(-k)})});return {o,c}}
function sdUp(){const r=sdMask(SS.txt,SS.mode),n=Object.values(r.c).reduce((a,b)=>a+b,0);gid('sdo').textContent=r.o;gid('sdc').innerHTML=n?Object.keys(r.c).map(k=>`<span class="badge" style="background:var(--th)">${k} ${r.c[k]}</span>`).join(' '):'<small style="color:var(--mute)">Tidak ada data sensitif terdeteksi</small>'}
function sdCopy(){const t=gid('sdo').textContent;if(navigator.clipboard)navigator.clipboard.writeText(t).then(()=>toast('Hasil disalin'),()=>toast('Salin manual dari kotak hasil'));else toast('Salin manual dari kotak hasil')}
function sanP(){const r=sdMask(SS.txt,SS.mode),n=Object.values(r.c).reduce((a,b)=>a+b,0);
 return `<div class="card" style="display:block"><div style="display:flex;justify-content:space-between;margin-bottom:10px"><b>Penyensor data privasi</b><span class="cxrl" style="background:#6D28D9">PRIVASI</span></div><textarea class="in" rows="4" oninput="SS.txt=this.value;sdUp()">${eh(SS.txt)}</textarea><div class="chips">${['Parsial','Penuh','Token'].map(m=>`<button class="${m==SS.mode?'on':''}" onclick="SS.mode='${m}';render()">${m}</button>`).join('')}</div><small style="color:var(--mute)">Hasil sensor</small><div id="sdo" style="font-family:ui-monospace,monospace;font-size:13px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px;margin:6px 0;word-break:break-word">${eh(r.o)}</div><div id="sdc" style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px">${n?Object.keys(r.c).map(k=>`<span class="badge" style="background:var(--th)">${k} ${r.c[k]}</span>`).join(' '):'<small style="color:var(--mute)">Tidak ada data sensitif terdeteksi</small>'}</div><button class="btn" style="background:var(--th)" onclick="sdCopy()">Salin hasil</button><p style="font-size:11px;color:var(--mute);margin-top:8px">Diproses di perangkat ini, teks tidak dikirim ke server. Mendeteksi NIK, NPWP, email, dan telepon.</p></div>`}
const PNL={nori:norP,kartio:kartP,sandio:sanP};
/* ===== Verdio (accounting) & Genio (speech to script) ===== */
let VD={jenis:'PPN',dpp:'',rate:'11',saldo:'',items:[]};
const VRT={'PPN':11,'PPh 23 (jasa)':2,'Lainnya':0};
const rup=n=>'Rp '+Math.round(n).toLocaleString('id-ID');
function vdTax(){const d=parseFloat(VD.dpp)||0,r=parseFloat(VD.rate)||0,p=d*r/100;return `<div class="row"><b>Pajak (${r}%)</b><span>${rup(p)}</span></div><div class="row"><b>Nilai + pajak</b><span>${rup(d+p)}</span></div><div class="row"><b>Nilai - pajak</b><span>${rup(d-p)}</span></div>`}
function vdCash(){let b=parseFloat(VD.saldo)||0,fl=null,ti=0,to=0;const rows=VD.items.map((x,i)=>{if(x.t=='masuk'){b+=x.a;ti+=x.a}else{b-=x.a;to+=x.a}if(b<0&&!fl)fl=x.l;return {x,i,b}});return {rows,b,ti,to,fl}}
function vdCashH(){const c=vdCash();return `<div class="card" style="margin:8px 0;border-left:4px solid ${c.fl?'#E5484D':'var(--ok)'}"><div class="g"><b style="font-size:14px">${c.fl?'Peringatan: kas defisit / overflow pada "'+c.fl+'"':(VD.items.length?'Kas aman sampai akhir periode':'Belum ada transaksi')}</b><p>Masuk ${rup(c.ti)} · Keluar ${rup(c.to)} · Saldo akhir ${rup(c.b)}</p></div></div>`+c.rows.map(r=>`<div class="row"><b>${r.x.t=='masuk'?'⬆':'⬇'} ${r.x.l}<p>${rup(r.x.a)}</p></b><span style="color:${r.b<0?'#E5484D':'var(--ink)'}">${rup(r.b)}</span><button class="badge" style="border:0;cursor:pointer;background:var(--mute)" onclick="VD.items.splice(${r.i},1);render()">✕</button></div>`).join('')}
function vdUp(){const t=gid('vdo');if(t)t.innerHTML=vdTax()}
function vcUp(){const t=gid('vco');if(t)t.innerHTML=vdCashH()}
function vdAdd(){const l=gid('vl').value.trim(),a=parseFloat(gid('vj').value);if(!l||!(a>0))return toast('Isi keterangan dan jumlah');VD.items.push({l:eh(l),a,t:gid('vt').value});render()}
function verdP(){return `<div class="card" style="display:block"><div style="display:flex;justify-content:space-between;margin-bottom:10px"><b>Hitung pajak</b><span class="cxrl" style="background:#0F766E">ACCOUNTING</span></div><select class="in" onchange="VD.jenis=this.value;VD.rate=String(VRT[this.value]);render()">${Object.keys(VRT).map(k=>`<option ${k==VD.jenis?'selected':''}>${k}</option>`).join('')}</select><input class="in" type="number" inputmode="decimal" placeholder="Nilai transaksi (DPP)" value="${eh(VD.dpp)}" oninput="VD.dpp=this.value;vdUp()"><input class="in" type="number" inputmode="decimal" placeholder="Tarif (%)" value="${eh(VD.rate)}" oninput="VD.rate=this.value;vdUp()"><div class="menu" id="vdo" style="margin:0">${vdTax()}</div><p style="font-size:11px;color:var(--mute);margin-top:8px">Tarif bisa diubah. Sesuaikan dengan ketentuan perpajakan yang berlaku.</p></div>
 <div class="card" style="display:block"><b>Arus kas dan peringatan overflow</b><input class="in" type="number" inputmode="decimal" placeholder="Saldo awal" value="${eh(VD.saldo)}" oninput="VD.saldo=this.value;vcUp()" style="margin-top:8px"><div style="display:flex;gap:6px"><input id="vl" class="in" type="text" placeholder="Keterangan" style="flex:2"><input id="vj" class="in" type="number" inputmode="decimal" placeholder="Jumlah" style="flex:1"></div><select id="vt" class="in"><option value="masuk">Kas masuk</option><option value="keluar">Kas keluar</option></select><button class="btn" style="background:var(--th)" onclick="vdAdd()">Tambah transaksi</button><div id="vco" class="menu" style="margin:10px 0 0;padding:0 0 4px;background:transparent;border:0;box-shadow:none">${vdCashH()}</div></div>`}
let GN={txt:'',lang:'id-ID',tgt:'Inggris',on:0},GR=null;
const GSR=window.SpeechRecognition||window.webkitSpeechRecognition;
function gnRec(){if(!GSR)return toast('Perekaman suara tidak didukung browser ini. Ketik atau tempel teks.');if(GN.on){if(GR)GR.stop();return}
 GR=new GSR();GR.lang=GN.lang;GR.continuous=true;GR.interimResults=true;const base=gid('gnt').value;let fin=base?base+' ':'';
 GR.onresult=e=>{let it='';for(let i=e.resultIndex;i<e.results.length;i++){const r=e.results[i];if(r.isFinal)fin+=r[0].transcript+' ';else it+=r[0].transcript}gid('gnt').value=fin+it;GN.txt=gid('gnt').value};
 GR.onerror=e=>{GN.on=0;const b=gid('gnb');if(b)b.textContent='🎙 Mulai rekam';toast(e.error=='not-allowed'?'Izin mikrofon ditolak atau diblokir di sini':'Gagal merekam: '+e.error)};
 GR.onend=()=>{GN.on=0;const b=gid('gnb');if(b)b.textContent='🎙 Mulai rekam'};
 try{GR.start();GN.on=1;gid('gnb').textContent='⏹ Berhenti'}catch(e){toast('Tidak bisa memulai rekaman')}}
async function gnAI(k){const t=gid('gnt').value.trim();if(!t)return toast('Rekam atau ketik teks dulu');const o=gid('gno');o.textContent='Memproses...';
 const P={tr:'Terjemahkan teks berikut ke bahasa '+GN.tgt+'. Balas hanya hasil terjemahan.\n\n'+t,sm:'Ringkas teks berikut dalam bahasa yang sama dengan teksnya, dalam poin singkat.\n\n'+t,nt:'Susun notulen dari transkrip berikut: ringkasan, keputusan, dan action item (PIC dan deadline jika disebut). Gunakan bahasa Indonesia.\n\n'+t};
 try{const sp=window.claude&&claude.use?await claude.use('sample'):null;if(!sp)throw{code:'na'};const r=await sp(P[k],{modelTier:'quick'});o.textContent=r.text}catch(e){o.textContent='';toast(e&&e.code=='na'?'Fitur ini butuh izin Claude di halaman ini':'Gagal memproses, coba lagi')}}
function gnCopy(){const t=gid('gno').textContent;if(!t)return toast('Belum ada hasil');if(navigator.clipboard)navigator.clipboard.writeText(t).then(()=>toast('Hasil disalin'),()=>toast('Salin manual dari kotak hasil'));else toast('Salin manual dari kotak hasil')}
function genP(){const op=(a,v)=>a.map(x=>`<option ${x==v?'selected':''}>${x}</option>`).join('');
 return `<div class="card" style="display:block"><div style="display:flex;justify-content:space-between;margin-bottom:10px"><b>Speech to script</b><span class="cxrl" style="background:#0891B2">GENIO</span></div><div style="display:flex;gap:8px"><select class="in" style="flex:1" onchange="GN.lang=this.value"><option value="id-ID" ${GN.lang=='id-ID'?'selected':''}>Suara: Indonesia</option><option value="en-US" ${GN.lang=='en-US'?'selected':''}>Suara: English</option></select><select class="in" style="flex:1" onchange="GN.tgt=this.value">${op(['Inggris','Indonesia','Mandarin','Jepang','Arab','Jerman','Prancis'],GN.tgt)}</select></div><button id="gnb" class="btn" style="background:var(--th)" onclick="gnRec()">${GN.on?'⏹ Berhenti':'🎙 Mulai rekam'}</button><textarea id="gnt" class="in" rows="5" placeholder="Hasil rekaman muncul di sini. Bisa juga ketik atau tempel teks." style="margin-top:10px" oninput="GN.txt=this.value">${eh(GN.txt)}</textarea><div class="chips" style="padding-bottom:4px"><button onclick="gnAI('tr')">🌐 Terjemahkan</button><button onclick="gnAI('sm')">📝 Ringkas</button><button onclick="gnAI('nt')">📋 Notulen</button></div><small style="color:var(--mute)">Hasil</small><div id="gno" style="white-space:pre-wrap;font-size:13.5px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px;margin:6px 0;min-height:48px;word-break:break-word"></div><button class="btn" style="background:var(--mute)" onclick="gnCopy()">Salin hasil</button><p style="font-size:11px;color:var(--mute);margin-top:8px">Rekam suara memakai pengenalan suara browser (Chrome atau Android) dan perlu izin mikrofon. Terjemahan, ringkasan, dan notulen diproses Claude dengan izinmu.</p></div>`}
PNL.verdio=verdP;PNL.genio=genP;
render();
</script>
<script>if('serviceWorker' in navigator){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}</script>
